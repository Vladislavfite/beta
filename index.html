<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <!--
  ============================================================================
   TOWER DEFENSE — ЕДИНЫЙ ФАЙЛ (index.html)
   ----------------------------------------------------------------------------
   ✔ Адаптив: 720×1280 логический размер, масштаб через Phaser Scale FIT + CENTER
   ✔ Чистый рестарт при нажатии "Играть" и "Играть снова"
   ✔ Исправлены дублирующиеся события resize/orientation и setInterval-вотчеры
   ✔ Единичный таймер волн, без гонок; волны растут по сложности
   ✔ Звук убийства врага: assets/sound/killenemy.mp3
   ✔ Комментарии и секции, чтобы упростить поддержку и публикацию
   ✔ Совместимо с python -m http.server / любым статическим сервером

   Важно по ассетам (минимум):
   - assets/map.png
   - assets/menu.webm, assets/gameover.webm
   - assets/elements/{play.png, playagain.png, menu.png, reload.png, sound.png, soundoff.png, fast.png, slow.png, pause.png, play2.png, gold.png, moloticon.png, up.png, noup.png}
   - assets/money/money1..6.png
   - assets/reklama/reklama1..6.png
   - assets/base/base0,20,40,60,80,100.png
   - assets/attacktower/statik/tower{1..12}/stower{1..4}.png
   - assets/attacktower/attack/tower{1..12}/aatcktower{1..5}.png
   - assets/enemy/walk/walk1..7.png
   - assets/enemy/atack_enemy/atackenemy1..7.png
   - assets/enemy/die_enemy/dead1..7.png
   - assets/elements/arrow.png
   - assets/sound/{lobby.mp3, battle.mp3, arrow.mp3, klick.ogg, gameover.mp3, towerup.mp3, towerrush.mp3, money.mp3, killenemy.mp3}
  ============================================================================
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tower Defense — адаптивный единый файл</title>

  <!-- =========================== СТИЛИ =========================== -->
  <style>
    :root{
      --w:720px;              /* логическая ширина сцены */
      --h:1280px;             /* логическая высота сцены  */
      --safe-pad:max(0px, env(safe-area-inset-top,0px));
    }
    html,body{
      height:100%; margin:0; background:#000; overflow:hidden; -webkit-tap-highlight-color:transparent;
      font-family: Arial, Helvetica, sans-serif;
    }
    #viewport{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:#000; touch-action:none;
    }
    #stage{
      position:relative; width:var(--w); height:var(--h); overflow:hidden;
      image-rendering:crisp-edges; -webkit-user-select:none; user-select:none;
    }
    #game{ position:absolute; left:0; top:0; width:100%; height:100%; }

    .overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:60; }
    .hidden{ display:none; }

    .panel{ position:relative; z-index:2; display:flex; flex-direction:column; gap:18px; align-items:center; justify-content:center; }
    .title{ color:#fff; margin:0; text-shadow:0 0 10px rgba(0,0,0,.6); }
    .bg-video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; pointer-events:none; filter:brightness(.92) contrast(1.04); }

    .imgbtn{ width:38%; max-width:340px; height:auto; cursor:pointer; user-select:none; -webkit-user-drag:none;
      filter: drop-shadow(0 0 14px rgba(0,0,0,.75)); transition:transform .08s ease; }
    .imgbtn:active{ transform:scale(.97); }

    /* Прелоадер (минимал) */
    #preloaderOverlay{ background:#000; }
    #bar{ width:60%; max-width:520px; height:18px; background:#222; border-radius:9px; overflow:hidden;
      box-shadow: inset 0 0 12px rgba(0,0,0,.6); }
    #bar > div{ height:100%; width:0%; background:#1e90ff; transition:width .12s linear; }

    /* HUD-текст (скрыт для DOM, используем канвасный, но оставлено на будущее) */
    #hud{ display:none; }
  </style>

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
</head>
<body>
  <div id="viewport">
    <div id="stage">

      <!-- ======================== ПРЕЛОАДЕР ======================== -->
      <div id="preloaderOverlay" class="overlay">
        <div class="panel" style="gap:14px;">
          <h2 class="title">Загрузка…</h2>
          <div id="bar"><div id="barFill"></div></div>
          <div id="pct" class="title">0%</div>
        </div>
      </div>

      <!-- ======================== ГЛАВНОЕ МЕНЮ ===================== -->
      <div id="menuOverlay" class="overlay hidden">
        <video id="menuVideo" class="bg-video" src="assets/menu.webm" autoplay loop muted playsinline></video>
        <div class="panel" style="padding-top: min(32vh, 360px);">
          <img id="startImg" class="imgbtn" src="assets/elements/play.png" alt="Start">
        </div>
      </div>

      <!-- ======================== GAME OVER ========================= -->
      <div id="gameoverOverlay" class="overlay hidden">
        <video id="goVideo" class="bg-video" src="assets/gameover.webm" autoplay loop muted playsinline></video>
        <div class="panel" style="padding-top: min(32vh, 360px);">
          <img id="restartImg" class="imgbtn" src="assets/elements/playagain.png" alt="Play Again">
        </div>
      </div>

      <!-- Канвас Phaser -->
      <div id="game"></div>

      <!-- Старый DOM HUD (оставлен как заглушка) -->
      <div id="hud">
        <div class="left">
          <div id="goldText" class="text">Gold: 0</div>
          <div id="waveText" class="text">Wave: 0</div>
        </div>
        <div class="right">
          <div id="baseText" class="text">BASE HP 100</div>
        </div>
      </div>

    </div>
  </div>

  <!-- =========================== ИГРА ============================== -->
  <script>
  /* *********************************************************************
     ЕДИНЫЙ СКРИПТ: Preloader → Menu → Game → GameOver
     - Строго один resize/orientation listener (без дублей)
     - Синхронизация DOM-оверлеев под реальный CSS-размер канваса
     - Всегда чистый старт из меню / из GameOver
  ********************************************************************* */

  // ========= ВКЛЮЧИ ЛОГ ВОЛН (true/false) =========
  window.__WAVE_DEBUG__ = false;

  // ---------------- Константы геймплея ----------------
  const CONST = {
    WIDTH: 720, HEIGHT: 1280,
    START_GOLD: 600,
    KILL_REWARD: 100,
    WAVE_BONUS: 80,
    TOWER_COST: 100,
    UPGRADE_COST_BASE: 120,
    ENEMY_AGGRO: 150,
    TOWER_RANGE: 200,

    // Точки строительства (адаптировано из твоего набора)
    BUILD_SPOTS: [
      [484,95],[359,145],[435,235],[373,288],[218,310],[113,394],[316,417],[444,432],
      [589,550],[484,527],[351,539],[286,631],[162,630],[127,728],[416,706],[285,760],
      [430,822],[301,867],[285,1000],[355,1015],[511,992],[581,946],[667,1016],
      [532,1083],[458,1127],[329,1149],[174,1116]
    ],

    // Пути врагов (адаптировано)
    PATHS: [
      [[377,50],[429,138],[410,189],[346,224],[311,257],[290,305],[331,354],[400,463],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[81,335],[189,359],[331,354],[400,463],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[636,490],[544,498],[413,491],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[52,667],[168,691],[289,700],[347,736],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[646,963],[565,1029],[441,1069],[312,1082],[226,1059]]
    ]
  };

  // ---------------- Быстрые DOM-хелперы ----------------
  const $ = (id)=>document.getElementById(id);
  const stageBox = $('stage');
  const preloaderOverlay = $('preloaderOverlay');
  const barFill = $('barFill');
  const pct = $('pct');
  const menuOverlay = $('menuOverlay');
  const gameoverOverlay = $('gameoverOverlay');
  const startImg = $('startImg');
  const restartImg = $('restartImg');
  const menuVideo = $('menuVideo');
  const goVideo = $('goVideo');

  // ---------------- Глобальное состояние ----------------
  const State = {
    started: false,
    paused: false,
    soundEnabled: true,
    gold: CONST.START_GOLD,
    wave: 0,
    baseHp: 100
  };

  // ---------------- Оверлеи ----------------
  const showPreloader = ()=> preloaderOverlay.classList.remove('hidden');
  const hidePreloader = ()=> preloaderOverlay.classList.add('hidden');
  const showMenuOverlay = ()=>{ menuOverlay.classList.remove('hidden'); gameoverOverlay.classList.add('hidden'); };
  const hideMenuOverlay = ()=> menuOverlay.classList.add('hidden');
  const showGameoverOverlay = ()=>{ gameoverOverlay.classList.remove('hidden'); menuOverlay.classList.add('hidden'); };
  const hideGameoverOverlay = ()=> gameoverOverlay.classList.add('hidden');

  // ======================= СЦЕНА =======================
  class AppScene extends Phaser.Scene {
    constructor(){ super({ key:'AppScene' }); }

    preload(){
      // DOM-прелоадер
      showPreloader();
      this.load.on('progress', (v)=>{
        const p = Math.floor(v*100);
        if (barFill) barFill.style.width = p+'%';
        if (pct) pct.textContent = p+'%';
      });

      // БАЗОВЫЕ АСЕТЫ
      this.load.image('map','assets/map.png');

      // КНОПКИ / UI
      this.load.image('molot','assets/elements/moloticon.png');
      this.load.image('up_icon','assets/elements/up.png');
      this.load.image('noup_icon','assets/elements/noup.png');
      this.load.image('arrow','assets/elements/arrow.png');
      this.load.image('menu','assets/elements/menu.png');
      this.load.image('reload','assets/elements/reload.png');
      this.load.image('sound_on','assets/elements/sound.png');
      this.load.image('sound_off','assets/elements/soundoff.png');
      this.load.image('turbo_on','assets/elements/fast.png');
      this.load.image('turbo_off','assets/elements/slow.png');
      this.load.image('pause','assets/elements/pause.png');
      this.load.image('resume','assets/elements/play2.png');
      this.load.image('gold_panel','assets/elements/gold.png');

      // Монетка анимация
      for(let i=1;i<=6;i++) this.load.image(`coin_${i}`, `assets/money/money${i}.png`);

      // HUD базы
      [0,20,40,60,80,100].forEach(p=> this.load.image(`base_${p}`, `assets/base/base${p}.png`));

      // Реклама-иконка (мигание)
      for(let i=1;i<=6;i++) this.load.image(`ad_${i}`, `assets/reklama/reklama${i}.png`);

      // Враги (кадры)
      for(let i=0;i<7;i++){
        this.load.image(`e_walk_${i}`,`assets/enemy/walk/walk${i+1}.png`);
        this.load.image(`e_atk_${i}`,`assets/enemy/atack_enemy/atackenemy${i+1}.png`);
        this.load.image(`e_die_${i}`,`assets/enemy/die_enemy/dead${i+1}.png`);
      }

      // Башни 1..12 уровней
      for(let i=1;i<=12;i++){
        for(let j=1;j<=4;j++) this.load.image(`tower${i}_idle_${j}`, `assets/attacktower/statik/tower${i}/stower${j}.png`);
        for(let j=1;j<=5;j++) this.load.image(`tower${i}_atk_${j-1}`, `assets/attacktower/attack/tower${i}/aatcktower${j}.png`);
      }

      // Звуки
      this.load.audio('lobby','assets/sound/lobby.mp3');
      this.load.audio('battle','assets/sound/battle.mp3');
      this.load.audio('arrow_s','assets/sound/arrow.mp3');
      this.load.audio('klick','assets/sound/klick.ogg');
      this.load.audio('gameover_s','assets/sound/gameover.mp3');
      this.load.audio('towerup','assets/sound/towerup.mp3');
      this.load.audio('towerrush','assets/sound/towerrush.mp3');
      this.load.audio('money','assets/sound/money.mp3');
      this.load.audio('kill','assets/sound/killenemy.mp3');   // ✓ звук убийства врага
    }

    create(){
      // Карта
      this.add.image(CONST.WIDTH/2, CONST.HEIGHT/2, 'map').setDisplaySize(CONST.WIDTH, CONST.HEIGHT);

      // Группы
      this.enemies = this.add.group();
      this.bullets = this.add.group();
      this.towers = [];
      this.buildSprites = new Array(CONST.BUILD_SPOTS.length).fill(null);

      // Скорости и timeScale
      this.speedScale = 1;
      this.time.timeScale = this.speedScale;

      // Звуки
      this.sndLobby   = this.sound.add('lobby',  { loop:true, volume:0.6 });
      this.sndBattle  = this.sound.add('battle', { loop:true, volume:0.6 });
      this.sndArrowLp = this.sound.add('arrow_s',{ loop:true, volume:0.35 });
      this.sndOver    = this.sound.add('gameover_s', { volume: 0.9 });
      this.sndUp      = this.sound.add('towerup', { volume: 0.9 });
      this.sndRush    = this.sound.add('towerrush', { volume: 0.9 });
      this.sndMoney   = this.sound.add('money',   { volume: 0.9 });
      this.sndKill    = this.sound.add('kill',    { volume: 0.8 });

      // mute сохранённый
      try{
        const saved = localStorage.getItem('td_mute');
        if(saved!==null) State.soundEnabled = (saved!=='1');
      }catch(_){}
      this.sound.setMute(!State.soundEnabled);

      // Хелперы звука
      this.stopAllLoops = ()=>{
        try{ this.sndArrowLp.stop(); }catch(_){}
        try{ this.sndBattle.stop(); }catch(_){}
        try{ this.sndLobby.stop(); }catch(_){}
      };
      this.playLobby = ()=>{ if(State.paused)return; this.stopAllLoops(); try{ !this.sndLobby.isPlaying && this.sndLobby.play(); }catch(_){} };
      this.playBattle= ()=>{ if(State.paused)return; this.stopAllLoops(); try{ !this.sndBattle.isPlaying && this.sndBattle.play(); }catch(_){} };
      this.playGameOver=()=>{ this.stopAllLoops(); try{ this.sndOver.play(); }catch(_){} };

      // Прелоадер → меню
      hidePreloader();
      showMenuOverlay();
      this.playLobby();

      // Строительные споты
      CONST.BUILD_SPOTS.forEach((p,i)=> this._createHammer(p,i));

      // Анимации
      this._createAnims();

      // HUD и боковые кнопки
      this._buildSideButtons();
      this._buildHUD();

      // Тикер стрельбы
      this.shootTicker = this.time.addEvent({ delay: 120, loop: true, callback: ()=> this._towersTick() });
    }

    // ---------------- Update ----------------
    update(){
      if(!State.started || State.paused) { this._syncHUD(); return; }
      this.enemies.getChildren().forEach(e => this._updateEnemy(e));
      this.bullets.getChildren().forEach(b => this._updateBullet(b));
      this._syncHUD();
    }

    // ---------------- HUD ----------------
    _buildHUD(){
      const yBottom = CONST.HEIGHT - 463;
      this.goldPanel = this.add.image(80, yBottom, 'gold_panel').setOrigin(0,1).setScale(1/3).setDepth(91);

      this.coin = this.add.sprite(this.goldPanel.x + 58, this.goldPanel.y - 36, 'coin_1')
        .setDepth(92).setScale(0.65);
      if (this.anims.exists('coin_anim')) this.coin.play('coin_anim');

      this.goldText = this.add.text(this.goldPanel.x + 95, this.goldPanel.y - 36, String(State.gold), {
        font:'26px Arial', fill:'#fff', stroke:'#000', strokeThickness:4
      }).setOrigin(0,0.5).setDepth(999);

      this.baseHud = this.add.image(CONST.WIDTH - 550, CONST.HEIGHT - 450, 'base_100');
      this._applyBaseHudTexture();

      this.adBtn = this.add.sprite(CONST.WIDTH - 76, CONST.HEIGHT - 96, 'ad_1')
        .setDepth(95).setInteractive({useHandCursor:true});
      if(this.anims.exists('ad_anim')) this.adBtn.play('ad_anim');
      this.adBtn.on('pointerdown', ()=>{
        if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
        State.gold += 1000; this._syncHUD();
      });
    }

    _applyBaseHudTexture(){
      const p = Math.max(0, Math.min(100, Math.round(State.baseHp/20)*20));
      const key = `base_${p}`;
      if(this.textures.exists(key)) this.baseHud.setTexture(key);
    }

    _syncHUD(){
      if(this.goldText) this.goldText.setText(String(State.gold|0));
      if(this.baseHud) this._applyBaseHudTexture();
    }

    _buildSideButtons(){
      const x = 576;
      const yMenu   = 629;
      const yReload = 709;
      const ySound  = 789;
      const yTurbo  = 869;
      const gap     = 80;

      const btnMenu = this.add.image(x, yMenu, 'menu').setInteractive().setDepth(60);
      btnMenu.on('pointerdown', ()=>{
        if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
        this.pauseToMenu();
      });

      const btnReload = this.add.image(x, yReload, 'reload').setInteractive().setDepth(60);
      btnReload.on('pointerdown', ()=>{
        if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
        this.restartRound();
      });

      const btnSound = this.add.image(x, ySound, State.soundEnabled ? 'sound_on' : 'sound_off')
        .setInteractive().setDepth(60);
      const applyMuteIcon = ()=> btnSound.setTexture(State.soundEnabled ? 'sound_on' : 'sound_off');
      btnSound.on('pointerdown', ()=>{
        State.soundEnabled = !State.soundEnabled;
        this.sound.setMute(!State.soundEnabled);
        try{ localStorage.setItem('td_mute', State.soundEnabled ? '0':'1'); }catch(_){}
        applyMuteIcon();
        if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
      });

      this.btnTurbo = this.add.image(x, yTurbo, 'turbo_off').setInteractive().setDepth(60);
      const applyTurboIcon = ()=> this.btnTurbo.setTexture(this.speedScale>1?'turbo_on':'turbo_off');
      this.btnTurbo.on('pointerdown', ()=>{
        if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
        this._toggleTurbo(); applyTurboIcon();
      });
      applyTurboIcon();

      this.btnPause = this.add.image(x, yTurbo + gap, 'pause').setDepth(60).setInteractive({useHandCursor:true});
      this.btnResume= this.add.image(x, yTurbo + gap, 'resume').setDepth(60).setInteractive({useHandCursor:true}).setVisible(false);

      this.btnPause.on('pointerdown', ()=>{ if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
        this._setPaused(true);
      });
      this.btnResume.on('pointerdown', ()=>{ if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
        this._setPaused(false);
      });
    }

    _toggleTurbo(){
      this.speedScale = this.speedScale>1 ? 1 : 2;
      if(!State.paused){
        this.time.timeScale = this.speedScale;
        this.tweens.timeScale = this.speedScale;
      }
    }

    _setPaused(flag){
      State.paused = !!flag;
      if(this.btnPause && this.btnResume){
        this.btnPause.setVisible(!State.paused);
        this.btnResume.setVisible(State.paused);
      }
      if(State.paused){
        this.time.timeScale = 0;
        this.tweens.pauseAll();
      } else {
        this.time.timeScale = this.speedScale;
        this.tweens.resumeAll();
      }
    }

    // --------- Экраны/жизненный цикл ---------
    startGameFreshFromMenu(){
      hideMenuOverlay();
      try{ menuVideo.pause(); }catch(_){}
      this.stopAllLoops();
      if (this.waveTimer) { try{ this.waveTimer.remove(); }catch(_){ } this.waveTimer=null; }
      this.scene.restart();
      this.events.once('create', ()=>{
        this._hardResetState();
        this.playBattle();
        State.started = true;
        this._scheduleNextWave(1200);
      });
    }

    pauseToMenu(){
      State.started = false;
      this._setPaused(false);
      this.stopAllLoops();
      this.playLobby();
      showMenuOverlay();
      if (this.waveTimer) { try{ this.waveTimer.remove(); }catch(_){ } this.waveTimer = null; }
    }

    showGameOver(){
      State.started = false;
      this._setPaused(false);
      this.playGameOver();
      showGameoverOverlay();
      try{ goVideo.currentTime = 0; goVideo.play().catch(()=>{}); }catch(_){}
      if (this.waveTimer) { try{ this.waveTimer.remove(); }catch(_){ } this.waveTimer = null; }
    }

    _hardResetState(){
      State.gold = CONST.START_GOLD;
      State.wave = 0;
      State.baseHp = 100;
      State.paused = false;
      this.speedScale = 1;
      this.time.timeScale = 1;
      this.tweens.timeScale = 1;

      try{ this.enemies.clear(true,true); }catch(_){}
      try{ this.bullets.clear(true,true); }catch(_){}
      try{
        this.towers.forEach(t=>{ if(t && t.sprite && t.sprite.active){ t.sprite.destroy(); } });
        this.towers = [];
      }catch(_){}
      try{
        this.buildSprites.forEach((spr, i)=>{
          if(spr && spr.active) spr.destroy();
          const pos = CONST.BUILD_SPOTS[i];
          this._createHammer(pos, i);
        });
      }catch(_){}
      this._syncHUD();
    }

    restartRound(){
      this.stopAllLoops();
      if (this.waveTimer) { try{ this.waveTimer.remove(); }catch(_){ } this.waveTimer=null; }
      this.scene.restart();
      this.events.once('create', ()=>{
        this._hardResetState();
        hidePreloader(); hideMenuOverlay(); hideGameoverOverlay();
        this.playBattle();
        State.started = true;
        this._scheduleNextWave(1200);
      });
    }

    // --------- Строительство / апгрейды ---------
    _createHammer(pos, index){
      const img = this.add.image(pos[0],pos[1],'molot').setInteractive({useHandCursor:true}).setScale(0.6).setDepth(10);
      img.on('pointerdown', ()=> this._buildTower(index));
      this.buildSprites[index] = img;
    }

    _buildTower(index){
      if(State.gold < CONST.TOWER_COST){ alert('Not enough gold'); return; }
      const pos = CONST.BUILD_SPOTS[index];
      if(this.buildSprites[index]){ try{ this.buildSprites[index].destroy(); }catch(_){}
        this.buildSprites[index] = null;
      }
      State.gold -= CONST.TOWER_COST; this._syncHUD();
      try{ this.sndMoney && this.sndMoney.play(); }catch(_){}

      const ts = this.add.sprite(pos[0],pos[1],'tower1_idle_1').setInteractive().setDepth(5);
      ts.level = 1;
      ts._typeKey = 'tower1';
      ts._range = CONST.TOWER_RANGE;
      ts._shootRate = 900;
      ts._bulletSpeed = 9;
      ts._damage = 5 * ts.level;
      ts.hp = 50;
      ts._upgradeCost = CONST.UPGRADE_COST_BASE * (ts.level + 1);

      if(this.textures.exists('up_icon') && this.textures.exists('noup_icon')){
        ts.upIcon = this.add.image(pos[0]-28,pos[1]+40,'noup_icon').setScale(0.6).setDepth(6).setVisible(true);
      }

      ts.on('pointerdown', ()=> this._upgradeTower(ts));

      const idle = `${ts._typeKey}_idle_anim`; if(this.anims.exists(idle)) ts.play(idle);
      ts.setFlipX(ts.x > CONST.WIDTH/2);

      ts.on('destroy', ()=> {
        this.buildSprites[index] = null;
        this._createHammer(pos,index);
      });

      this.towers.push({ sprite: ts });
    }

    _upgradeTower(ts){
      const cost = Math.floor(ts._upgradeCost || (CONST.UPGRADE_COST_BASE*(ts.level+1)));
      if(ts.level >= 12) return;
      if(State.gold < cost){ alert('Need ' + cost + ' gold'); return; }

      State.gold -= cost; this._syncHUD();
      ts.level += 1;
      ts._typeKey = 'tower' + ts.level;
      ts._range = Math.min(300, ts._range + 30);
      ts._shootRate = Math.max(300, ts._shootRate - 120);
      ts._damage = 5 * ts.level;
      ts.hp += 50;
      ts._upgradeCost = CONST.UPGRADE_COST_BASE * (ts.level + 1);

      const idle = `${ts._typeKey}_idle_anim`; if(this.anims.exists(idle)) ts.play(idle);
      if(ts.level>=12 && ts.upIcon) ts.upIcon.setVisible(false);

      try{ this.sndUp.play(); }catch(_){}
    }

    // --------- ПУЛ ПУЛЬ ---------
    _getBullet(){
      const kids = this.bullets.getChildren();
      for(let i=0;i<kids.length;i++){
        const b = kids[i];
        if(!b.active){ return b; }
      }
      const nb = this.add.image(0,0,'arrow');
      nb.setActive(false).setVisible(false);
      this.bullets.add(nb);
      return nb;
    }

    // --------- Стрельба ---------
    _towersTick(){
      if(!State.started || State.paused) return;

      let anyShot = false;
      const now = Date.now();

      for(const tObj of this.towers){
        const ts = tObj.sprite; if(!ts || !ts.active) continue;

        if(ts.upIcon){
          const nextCost = Math.floor(ts._upgradeCost || (CONST.UPGRADE_COST_BASE*(ts.level+1)));
          const key = State.gold >= nextCost ? 'up_icon' : 'noup_icon';
          if(ts.upIcon.texture && ts.upIcon.texture.key !== key) ts.upIcon.setTexture(key);
          ts.upIcon.setVisible(!(ts.level>=12));
          ts.upIcon.x = ts.x - 28; ts.upIcon.y = ts.y + 40;
        }

        ts._lastShotTime = ts._lastShotTime || 0;
        if(now - ts._lastShotTime < ts._shootRate){
          const idleKey = `${ts._typeKey}_idle_anim`;
          if(this.anims.exists(idleKey) && (!ts.anims.currentAnim || ts.anims.currentAnim.key.indexOf('_idle_anim')===-1)) ts.play(idleKey, true);
          continue;
        }

        // цель
        let target=null, dmin=1e9;
        this.enemies.getChildren().forEach(e=>{
          if(!e.active || e.state==='die') return;
          const d = Phaser.Math.Distance.Between(ts.x, ts.y, e.x, e.y);
          if(d < ts._range && d < dmin){ dmin=d; target=e; }
        });

        ts._lastShotTime = now;
        if(target){
          let b = this._getBullet();
          b.setActive(true).setVisible(true);
          b.setTexture('arrow');
          b.setScale(0.5);
          b.setPosition(ts.x, ts.y - Math.round((ts.displayHeight||40)*0.4));
          b.target = target;
          b.speed = ts._bulletSpeed || 9;
          b.damage = ts._damage || (5*ts.level);
          b.hitRadius = 16;
          b.setDepth(30);

          const atkKey = `${ts._typeKey}_atk_anim`; if(this.anims.exists(atkKey)) ts.play(atkKey,true);
          ts.setFlipX(ts.x > CONST.WIDTH/2);
          anyShot = true;
        }else{
          const idleKey = `${ts._typeKey}_idle_anim`; if(this.anims.exists(idleKey)) ts.play(idleKey,true);
        }
      }

      try{
        if(anyShot){
          if(!this.sndArrowLp.isPlaying && !this.sound.mute) this.sndArrowLp.play();
        }else{
          if(this.sndArrowLp.isPlaying) this.sndArrowLp.stop();
        }
      }catch(_){}
    }

    // --------- Пуля ---------
    _updateBullet(b){
      if(!b || !b.active) return;
      if(!b.target || !b.target.active || b.target.state==='die'){
        try{ b.setActive(false).setVisible(false); }catch(_){}
        return;
      }
      const dx = b.target.x - b.x;
      const dy = b.target.y - b.y;
      const dist = Math.hypot(dx, dy);
      const sp = b.speed || 8;
      const hitR = b.hitRadius || 16;

      if(dist <= hitR){
        const dmg = (b.damage || 5);
        b.target.hp -= dmg;
        this._floatText(b.target.x, b.target.y-28, '-' + dmg);
        if(b.target.hp <= 0){ this._killEnemy(b.target); }
        try{ b.setActive(false).setVisible(false); }catch(_){}
        return;
      }

      const nx = dx / dist;
      const ny = dy / dist;
      b.x += nx * sp;
      b.y += ny * sp;
      b.rotation = Phaser.Math.Angle.Between(b.x,b.y,b.target.x,b.target.y);

      if(b.x < -50 || b.x > CONST.WIDTH+50 || b.y < -50 || b.y > CONST.HEIGHT+50){
        try{ b.setActive(false).setVisible(false); }catch(_){}
      }
    }

    _floatText(x,y,text){
      const t = this.add.text(x, y, text, {font:'20px Arial', fill:'#ffec8b', stroke:'#000', strokeThickness:3}).setDepth(100);
      t.setOrigin(0.5,1);
      this.tweens.add({
        targets:t, y:y-30, alpha:0, duration:650, ease:'Cubic.easeOut',
        onComplete:()=>{ t.destroy(); }
      });
    }

    _killEnemy(e){
      if(!e || e.state==='die') return;
      e.state = 'die';
      if(e.anims) e.anims.stop();
      if(e.hpBar){ e.hpBar.destroy(); e.hpBar = null; }

      const hasDieAnim = this.anims.exists('e_die_anim');
      if (hasDieAnim) {
        e.once(Phaser.Animations.Events.ANIMATION_COMPLETE, (anim) => {
          if (anim && anim.key === 'e_die_anim') {
            this.time.delayedCall(120, () => { if (e && e.active) e.destroy(); });
          }
        });
        e.play('e_die_anim');
      } else {
        this.time.delayedCall(120, () => { if (e && e.active) e.destroy(); });
      }

      try{ this.sndKill && this.sndKill.play(); }catch(_){}
      State.gold += CONST.KILL_REWARD;
      this._syncHUD();
    }

    // --------- Враг ---------
    _spawnEnemy(path, hp){
      const spawn = path[0];
      const e = this.add.sprite(spawn[0],spawn[1],'e_walk_0').setScale(0.35);
      e.maxHp = hp; e.hp = hp;
      e.speed = 0.12 + Math.min(0.018 * State.wave, 0.32);
      e.path = path; e.pathIndex = 1;
      e.state='walk'; e._savedPathIndex=null; e._lastAttack=0;
      if(this.anims.exists('e_walk_anim')) e.play('e_walk_anim');
      this.enemies.add(e);

      e.hpBar = this.add.graphics().setDepth(40);
      e.hpBar.__owner = e;
      this._drawHpBar(e);
    }

    _drawHpBar(e){
      if(!e || !e.hpBar) return;
      const w = 40, h = 6;
      const x = e.x - w/2;
      const y = e.y - 40;
      const p = Math.max(0, Math.min(1, e.hp / e.maxHp));
      e.hpBar.clear();
      e.hpBar.fillStyle(0x000000, 0.5).fillRect(x-1,y-1,w+2,h+2);
      e.hpBar.fillStyle(0x8b0000, 0.6).fillRect(x,y,w,h);
      e.hpBar.fillStyle(0x32cd32, 0.9).fillRect(x,y,w*p,h);
    }

    _updateEnemy(e){
      if(!e || !e.active || e.state==='die') return;
      if(e.hpBar){ this._drawHpBar(e); }

      // Агро башни
      let nearest=null, nd=1e9;
      for(const tObj of this.towers){
        const ts=tObj.sprite; if(!ts||!ts.active) continue;
        const d=Phaser.Math.Distance.Between(e.x,e.y,ts.x,ts.y);
        if(d < CONST.ENEMY_AGGRO && d < nd){ nd=d; nearest=ts; }
      }
      if(nearest){
        e.targetTower=nearest; e._savedPathIndex=e.pathIndex;
        if(this.anims.exists('e_atk_anim') && e.anims?.currentAnim?.key!=='e_atk_anim') e.play('e_atk_anim');
      }

      // Атака башни
      if(e.targetTower && e.targetTower.active){
        this._moveTowards(e, e.targetTower.x, e.targetTower.y, e.speed);
        e.setFlipX(e.targetTower.x < e.x);
        const d = Phaser.Math.Distance.Between(e.x,e.y,e.targetTower.x,e.targetTower.y);
        if(d < 26 && (!e._lastAttack || Date.now()-e._lastAttack > 900)){
          e._lastAttack = Date.now();
          if(e.targetTower.hp != null){
            e.targetTower.hp -= 10;
            try{
              e.targetTower.setTint && e.targetTower.setTint(0xff9999);
              this.time.delayedCall(80,()=>{ try{ e.targetTower.clearTint && e.targetTower.clearTint(); }catch(_){} });
            }catch(_){}
            if(e.targetTower.hp <= 0){
              try{ this.sndRush.play(); }catch(_){}
              try{ e.targetTower.upIcon && e.targetTower.upIcon.destroy(); }catch(_){}
              try{ e.targetTower.destroy(); }catch(_){}
              this.towers = this.towers.filter(t => t && t.sprite && t.sprite.active);
              e.targetTower=null; e.state='returning';
              if(e._savedPathIndex!=null) e.pathIndex=e._savedPathIndex;
            }
          }else{
            e.targetTower=null; e.state='returning';
          }
        }
        return;
      }

      // Возврат к пути
      if(e.state==='returning'){
        const target = e.path[e.pathIndex] || e.path[e.path.length-1];
        this._moveTowards(e, target[0], target[1], e.speed);
        if(Phaser.Math.Distance.Between(e.x,e.y,target[0],target[1])<8){
          e.state='walk'; if(this.anims.exists('e_walk_anim') && e.anims?.currentAnim?.key!=='e_walk_anim') e.play('e_walk_anim');
        }
        return;
      }

      // Дошёл до базы
      if(e.pathIndex >= e.path.length){
        if(!e._lastAttack || Date.now()-e._lastAttack > 900){
          e._lastAttack = Date.now();
          State.baseHp -= 5; if(State.baseHp < 0) State.baseHp = 0;
          this._syncHUD();
          if(State.baseHp<=0){ this.showGameOver(); }
        }
        if(this.anims.exists('e_atk_anim') && e.anims?.currentAnim?.key!=='e_atk_anim') e.play('e_atk_anim');
        return;
      }

      // Движение по точкам
      const wp = e.path[e.pathIndex];
      if(wp){
        this._moveTowards(e, wp[0], wp[1], e.speed);
        if(Phaser.Math.Distance.Between(e.x,e.y,wp[0],wp[1])<6) e.pathIndex++;
        e.setFlipX(wp[0] < e.x);
        if(this.anims.exists('e_walk_anim') && e.anims?.currentAnim?.key!=='e_walk_anim') e.play('e_walk_anim');
      }
    }

    _moveTowards(obj, tx, ty, speed){
      const dx=tx-obj.x, dy=ty-obj.y, dist=Math.hypot(dx,dy);
      if(dist<0.1) return;
      obj.x += (dx/dist)*speed*2;
      obj.y += (dy/dist)*speed*2;
    }

    // --------- Волны (строгий единичный таймер) ---------
    _scheduleNextWave(delay = 1500) {
      if (this.waveTimer) { this.waveTimer.remove(); this.waveTimer = null; }
      this.waveTimer = this.time.addEvent({
        delay,
        callback: () => this._startWave(),
      });
    }

    _startWave() {
      if (!State.started || State.paused) return;

      State.wave++;
      this._syncHUD();

      const enemyHpBase = 25 + State.wave * 5;
      const hpJitter = Phaser.Math.Between(-2, 4);
      const enemiesPerSpawn = Math.min(1 + Math.floor((State.wave - 1) / 4), 4);

      let spawnCount;
      if (State.wave <= 2) spawnCount = 1;
      else if (State.wave <= 6) spawnCount = Phaser.Math.Between(1, 2);
      else spawnCount = Phaser.Math.Between(2, 3);
      spawnCount = Math.min(spawnCount, CONST.PATHS.length);

      const chosenIndexes = Phaser.Utils.Array.Shuffle(
        [...Array(CONST.PATHS.length).keys()]
      ).slice(0, spawnCount);

      chosenIndexes.forEach((pathIndex, idx) => {
        const path = CONST.PATHS[pathIndex];
        for (let j = 0; j < enemiesPerSpawn; j++) {
          const base = (State.wave <= 3) ? Phaser.Math.Between(2400, 3000)
                                         : Phaser.Math.Between(2000, 2600);
          const delay = j * base + idx * 1000;
          const hp = Math.max(10, enemyHpBase + hpJitter);
          this.time.addEvent({ delay, callback: () => this._spawnEnemy(path, hp) });
        }
      });

      const nextDelayBase = (State.wave <= 3) ? 12000 : 10000;
      const nextDelay = nextDelayBase + enemiesPerSpawn * 3200 + Phaser.Math.Between(0, 1800);
      this._scheduleNextWave(nextDelay);

      if (window.__WAVE_DEBUG__) {
        console.log(`Wave ${State.wave}: paths=${spawnCount}, perPath=${enemiesPerSpawn}, HP≈${enemyHpBase}, next=${nextDelay}ms`);
      }
    }

    // --------- Анимации ---------
    _createAnims(){
      for(let i=1;i<=12;i++){
        const idle=[], atk=[];
        for(let j=1;j<=4;j++) idle.push({key:`tower${i}_idle_${j}`});
        for(let j=0;j<5;j++) atk.push({key:`tower${i}_atk_${j}`});
        if(!this.anims.exists(`tower${i}_idle_anim`))
          this.anims.create({key:`tower${i}_idle_anim`,frames:idle,frameRate:8,repeat:-1});
        if(!this.anims.exists(`tower${i}_atk_anim`))
          this.anims.create({key:`tower${i}_atk_anim`, frames:atk, frameRate:12,repeat:-1});
      }
      const eWalk=[], eAtk=[], eDie=[];
      for(let i=0;i<7;i++){
        eWalk.push({key:`e_walk_${i}`});
        eAtk.push({key:`e_atk_${i}`});
        eDie.push({key:`e_die_${i}`});
      }
      if(!this.anims.exists('e_walk_anim'))
        this.anims.create({key:'e_walk_anim', frames:eWalk, frameRate:8, repeat:-1});
      if(!this.anims.exists('e_atk_anim'))
        this.anims.create({key:'e_atk_anim', frames:eAtk, frameRate:8, repeat:-1});
      if(!this.anims.exists('e_die_anim'))
        this.anims.create({ key:'e_die_anim', frames:eDie.map(f=>({key:f.key})), frameRate:10, repeat:0, hideOnComplete:false });

      if(!this.anims.exists('coin_anim')){
        this.anims.create({key:'coin_anim', frames:[1,2,3,4,5,6].map(i=>({key:`coin_${i}`})), frameRate: 10, repeat:-1});
      }
      if(!this.anims.exists('ad_anim')){
        this.anims.create({key:'ad_anim', frames:[1,2,3,4,5,6].map(i=>({key:`ad_${i}`})), frameRate: 8, repeat:-1});
      }
    }
  }

  // ======================= PHASER СТАРТ =======================
  const config = {
    type: Phaser.AUTO,
    parent: 'game',
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH,
      width: CONST.WIDTH,
      height: CONST.HEIGHT,
      autoRound: true
    },
    physics:{ default:'arcade', arcade:{ debug:false } },
    scene:[AppScene],
    backgroundColor: '#000000'
  };
  const game = new Phaser.Game(config);

  // ============== СИНХРОН DOM ↔ КАНВАС ==============
  function _syncStageToCanvas(){
    if(!game || !game.scale) return;
    const s = game.scale;
    const cssW = Math.floor(s.displaySize?.width || s.gameSize?.width || CONST.WIDTH);
    const cssH = Math.floor(s.displaySize?.height || s.gameSize?.height || CONST.HEIGHT);
    if (cssW > 0) stageBox.style.width  = cssW + 'px';
    if (cssH > 0) stageBox.style.height = cssH + 'px';
    stageBox.style.paddingTop = 'var(--safe-pad)';
  }

  // первый sync
  window.addEventListener('load', ()=>{
    showPreloader();
    if (game && game.isBooted && game.scale) {
      game.scale.refresh();
    }
    _syncStageToCanvas();
  }, { passive:true });

  // единичный resize (debounce через rAF)
  let __resizeRaf = 0;
  window.addEventListener('resize', ()=>{
    if (__resizeRaf) cancelAnimationFrame(__resizeRaf);
    __resizeRaf = requestAnimationFrame(()=>{
      if (game && game.isBooted && game.scale) {
        try { game.scale.refresh(); } catch(e) {}
      }
      _syncStageToCanvas();
      __resizeRaf = 0;
    });
  }, { passive:true });

  // единичный orientationchange
  window.addEventListener('orientationchange', ()=>{
    setTimeout(()=>{
      if (game && game.isBooted && game.scale) {
        try { game.scale.refresh(); } catch(e){}
      }
      _syncStageToCanvas();
    }, 300);
  }, { passive:true });

  // событие Phaser resize
  const onReady = ()=>{
    try{ game.scale.on('resize', ()=>{ _syncStageToCanvas(); }); }catch(_){}
    _syncStageToCanvas();
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive'){
    setTimeout(onReady, 0);
  }else{
    document.addEventListener('DOMContentLoaded', onReady, { once:true });
  }

  // ======================= DOM-КНОПКИ =======================
  startImg.addEventListener('click', ()=>{
    const sc = game.scene.keys['AppScene'];
    if(!sc) return;
    sc.startGameFreshFromMenu(); // всегда чистый старт
  });
  restartImg.addEventListener('click', ()=>{
    hideGameoverOverlay();
    const sc = game.scene.keys['AppScene'];
    if(!sc) return;
    sc.startGameFreshFromMenu();
  });
  </script>
</body>
