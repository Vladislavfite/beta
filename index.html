<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <!-- Фиксированное игровое поле под твой арт 720x1280 -->
  <meta name="viewport" content="width=720, height=1280, user-scalable=no" />
  <title>Tower Defense — single window build</title>

  <!-- ====== СТИЛИ ОБОЛОЧКИ И СЛОЁВ ====== -->
  <style>
    :root{--w:720px;--h:1280px}
    html,body{height:100%;margin:0;background:#000;display:flex;align-items:center;justify-content:center}
    #container{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#000}
    canvas{position:absolute;left:0;top:0}

    /* Оверлеи (меню/гейм-овер) поверх Phaser canvas */
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:60}
    .hidden{display:none}
    .panel{position:relative;z-index:2;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center}
    .title{color:#fff;font-family:Arial,Helvetica,sans-serif;margin:0}

    /* Фоновые видео-контейнеры для меню и game over */
    .bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

    /* Кнопка "Начать" и "Рестарт" (DOM) */
    .btn{width:280px;height:80px;border-radius:18px;border:none;font-size:28px;background:#1e90ff;color:#fff;cursor:pointer;box-shadow:0 0 20px rgba(0,0,0,.5);font-family:Arial,Helvetica,sans-serif}

    /* HUD в DOM (чёткий текст поверх канваса) */
    #hud{position:absolute;left:0;right:0;bottom:0;height:120px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;z-index:50;pointer-events:none}
    #hud .left,#hud .right{pointer-events:auto}
    #hud .text{color:#fff;font-family:Arial,Helvetica,sans-serif; text-shadow:0 0 6px rgba(0,0,0,.8)}

    /* Лёгкая подмасштабировка на маленьких экранах */
    @media (max-width:800px){#container{transform:scale(.9)}}
  </style>

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
</head>
<body>
  <div id="container">

    <!-- ====== ГЛАВНОЕ МЕНЮ (ЛУПАЮЩЕЕСЯ ВИДЕО + МУЗЫКА LOBBY) ====== -->
    <!-- Важно: видео должно быть MUTED, чтобы автостарт прошёл в браузерах -->
    <div id="menuOverlay" class="overlay">
      <video id="menuVideo" class="bg-video" src="assets/menu.webm" autoplay loop muted playsinline></video>
      <div class="panel">
        <h1 class="title">Tower Defense</h1>
        <button id="startBtn" class="btn">▶ Начать игру</button>
      </div>
    </div>

    <!-- ====== ЭКРАН GAME OVER (ЛУПАЮЩЕЕСЯ ВИДЕО + КНОПКА + МУЗЫКА) ====== -->
    <div id="gameoverOverlay" class="overlay hidden">
      <video id="goVideo" class="bg-video" src="assets/gameover.webm" autoplay loop muted playsinline></video>
      <div class="panel">
        <h2 class="title">Game Over</h2>
        <button id="restartBtn" class="btn">▶ Начать заново</button>
      </div>
    </div>

    <!-- Холст для Phaser -->
    <div id="game" style="width:720px;height:1280px"></div>

    <!-- HUD-тексты (DOM) -->
    <div id="hud">
      <div class="left">
        <div id="goldText" class="text">Gold: 0</div>
        <div id="waveText" class="text">Wave: 0</div>
      </div>
      <div class="right">
        <div id="baseText" class="text">BASE HP 1000</div>
      </div>
    </div>

  </div>

  <script>
  /* ========================================================================
     ЕДИНЫЙ ФАЙЛ С ТРЕМЯ СЛОЯМИ:
     - Меню (menu.webm + lobby.mp3), кнопка "Начать".
     - Игра (Phaser сцена), боковое меню: MENU / RELOAD / SOUND_ON|OFF.
     - GameOver (gameover.webm + gameover.mp3), кнопка "Рестарт".
     Все ассеты остаются в /assets. Никаких переходов на другие HTML.
     ======================================================================== */

  // ---------- Константы уровня и пути (как в твоём коде) ----------
  const CONST = {
    WIDTH: 720, HEIGHT: 1280,

    BUILD_SPOTS: [
      [484,95],[359,155],[435,235],[373,288],[218,310],[113,394],[316,417],[444,432],
      [589,550],[484,527],[351,539],[286,631],[162,630],[127,728],[416,706],[285,781],
      [430,822],[301,867],[275,1016],[355,1015],[511,992],[581,946],[667,1016],
      [532,1083],[458,1127],[329,1149],[174,1116]
    ],

    PATHS: [
      [[377,50],[429,138],[410,189],[346,224],[311,257],[290,305],[331,354],[400,463],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[81,335],[189,359],[331,354],[400,463],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[636,490],[544,498],[413,491],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[52,667],[168,691],[289,700],[347,736],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[646,963],[565,1029],[441,1069],[312,1082],[226,1059]]
    ],

    // Баланс по запросу: снижена скорострельность и урон
    START_GOLD: 50000,
    KILL_REWARD: 10,
    WAVE_BONUS: 50,
    TOWER_COST: 100,
    UPGRADE_COST_BASE: 150,

    ENEMY_AGGRO: 150,
    TOWER_RANGE: 200
  };

  // ---------- DOM-шорткаты ----------
  const $ = (id)=>document.getElementById(id);
  const menuOverlay = $('menuOverlay');
  const gameoverOverlay = $('gameoverOverlay');
  const startBtn = $('startBtn');
  const restartBtn = $('restartBtn');
  const menuVideo = $('menuVideo');
  const goVideo = $('goVideo');

  const goldText = $('goldText'), waveText = $('waveText'), baseText = $('baseText');

  // ---------- Глобальное состояние ----------
  const State = {
    started: false,
    gold: CONST.START_GOLD,
    wave: 0,
    baseHp: 1000,
  };

  // ========================================================================
  //                         PHASER: ОСНОВНАЯ СЦЕНА
  // ========================================================================
  class AppScene extends Phaser.Scene {
    constructor(){ super({ key:'AppScene' }); }

    preload(){
      // Фон-карта
      this.load.image('map','assets/map.png');

      // Постройки
      this.load.image('molot','assets/elements/moloticon.png');
      this.load.image('up_icon','assets/elements/up.png');
      this.load.image('noup_icon','assets/elements/noup.png');

      // ПУЛЯ/СТРЕЛА — обязательно этот путь: assets/elements/arrow.png
      this.load.image('arrow','assets/elements/arrow.png');

      // Боковые кнопки (только 3 по ТЗ): menu, reload, sound_on/off
      this.load.image('menu','assets/elements/menu.png');
      this.load.image('reload','assets/elements/reload.png');
      this.load.image('sound_on','assets/elements/sound.png');
      this.load.image('sound_off','assets/elements/soundoff.png');

      // ВРАГИ: анимации ходьбы/атаки/смерти — кадры по структуре ассетов
      for(let i=0;i<7;i++){
        this.load.image(`e_walk_${i}`,`assets/enemy/walk/walk${i+1}.png`);
        this.load.image(`e_atk_${i}`,`assets/enemy/atack_enemy/atackenemy${i+1}.png`);
        this.load.image(`e_die_${i}`,`assets/enemy/die_enemy/dead${i+1}.png`);
      }

      // БАШНИ: статик/атака (ключи соответствуют твоей структуре)
      for(let i=1;i<=12;i++){
        for(let j=1;j<=4;j++) this.load.image(`tower${i}_idle_${j}`, `assets/attacktower/statik/tower${i}/stower${j}.png`);
        for(let j=1;j<=5;j++) this.load.image(`tower${i}_atk_${j-1}`, `assets/attacktower/attack/tower${i}/aatcktower${j}.png`);
      }

      // Звуки: lobby (меню), battle (игра), стрелы (arrow loop), клик, gameover, апгрейд/разрушение
      try{ this.load.audio('lobby','assets/sound/lobby.mp3'); }catch(e){}
      try{ this.load.audio('battle','assets/sound/battle.mp3'); }catch(e){}
      try{ this.load.audio('arrow_s','assets/sound/arrow.mp3'); }catch(e){}
      try{ this.load.audio('klick','assets/sound/klick.ogg'); }catch(e){}
      try{ this.load.audio('gameover_s','assets/sound/gameover.mp3'); }catch(e){}
      try{ this.load.audio('towerup','assets/sound/towerup.mp3'); }catch(e){}
      try{ this.load.audio('towerrush','assets/sound/towerrush.mp3'); }catch(e){}
    }

    create(){
      // Фон карты
      this.add.image(CONST.WIDTH/2, CONST.HEIGHT/2, 'map').setDisplaySize(CONST.WIDTH, CONST.HEIGHT);

      // Группы
      this.enemies = this.add.group();
      this.bullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: 300, runChildUpdate: false });
      this.towers = [];
      this.buildSprites = new Array(CONST.BUILD_SPOTS.length).fill(null);

      // Споты для строительства
      CONST.BUILD_SPOTS.forEach((p,i)=> this._createHammer(p,i));

      // Анимации
      this._createAnims();

      // Аудио-объекты
      try{
        this.sndLobby   = this.sound.add('lobby',  { loop:true, volume:0.6 });
        this.sndBattle  = this.sound.add('battle', { loop:true, volume:0.6 });
        this.sndArrowLp = this.sound.add('arrow_s',{ loop:true, volume:0.35 });
        this.sndOver    = this.sound.add('gameover_s', { volume: 0.9 });
        this.sndUp      = this.sound.add('towerup', { volume: 0.9 });
        this.sndRush    = this.sound.add('towerrush', { volume: 0.9 });
      }catch(e){}

      // Боковое меню (три кнопки: MENU / RELOAD / SOUND)
      this._buildSideButtons();

      // Таймер стрельбы башен
      this.time.addEvent({ delay: 120, loop: true, callback: ()=> this._towersTick() });

      // Попадание пули по врагу
      this.physics.add.overlap(this.bullets, this.enemies, (b,e)=> this._onBulletHit(b,e));

      // На старте — пауза сцены (идёт лобби-видео и музыка меню)
      this._pauseToMenu();
    }

    update(){
      // Если игра не начата — ничего не обновляем (HUD синхронизируем на всякий)
      if(!State.started) { this._syncHUD(); return; }

      // Апдейт врагов и пуль
      this.enemies.getChildren().forEach(e => this._updateEnemy(e));
      this.bullets.getChildren().forEach(b => this._updateBullet(b));

      // Обновление HUD
      this._syncHUD();
    }

    // ====== Жизненный цикл игры ======
    startGameFromMenu(){
      // Скрыть меню, остановить лобби-видео/музыку, запустить боевую музыку
      hideMenuOverlay();
      try{ menuVideo.pause(); }catch(_){}
      try{ this.sndLobby && this.sndLobby.stop(); }catch(_){}
      try{ this.sndBattle && !this.sndBattle.isPlaying && this.sndBattle.play(); }catch(_){}

      // Снять паузу
      State.started = true;
      this.scene.resume();

      // Запустить волны
      this._scheduleNextWave(600);
    }

    showGameOver(){
      // Остановить боевую музыку, выключить луп стрел, проиграть звук окончания, показать оверлей с видео
      State.started = false;
      try{ this.sndBattle && this.sndBattle.stop(); }catch(_){}
      try{ this.sndArrowLp && this.sndArrowLp.stop(); }catch(_){}
      try{ this.sndOver && this.sndOver.play(); }catch(_){}

      this.scene.pause();
      showGameoverOverlay();
      try{ goVideo.currentTime = 0; goVideo.play().catch(()=>{}); }catch(_){}
    }

    restartToMenu(){
      // Полный ресет
      State.started = false;
      State.gold = CONST.START_GOLD;
      State.wave = 0;
      State.baseHp = 1000;

      // Остановить все луп-звуки
      try{ this.sndBattle && this.sndBattle.stop(); }catch(_){}
      try{ this.sndArrowLp && this.sndArrowLp.stop(); }catch(_){}

      // Перезапустить сцену и показать меню
      this.scene.restart();
      this._pauseToMenu();
    }

    _pauseToMenu(){
      // Пауза сцены, включить меню-видео и лобби-трек
      this.scene.pause();
      showMenuOverlay();
      try{ menuVideo.currentTime = 0; menuVideo.play().catch(()=>{}); }catch(_){}
      try{ this.sndLobby && !this.sndLobby.isPlaying && this.sndLobby.play(); }catch(_){}
    }

    // ====== UI / HUD ======
    _syncHUD(){
      goldText.textContent = 'Gold: ' + State.gold;
      waveText.textContent = 'Wave: ' + State.wave;
      baseText.textContent = 'BASE HP ' + Math.max(0, State.baseHp);
    }

    _buildSideButtons(){
      // Расположение 3-х кнопок справа
      const x = 576;
      const yMenu   = 629;        // MENU
      const yReload = 629 + 80;   // RELOAD
      const ySound  = 629 + 160;  // SOUND

      // MENU — вернуться в главное меню (пауза + лобби)
      const btnMenu = this.add.image(x, yMenu, 'menu').setInteractive().setDepth(60);
      btnMenu.on('pointerdown', ()=>{ try{ this.sound.play('klick'); }catch(_){}
        this._pauseToMenu();
      });

      // RELOAD — мягкий рестарт сцены (и возврат в меню)
      const btnReload = this.add.image(x, yReload, 'reload').setInteractive().setDepth(60);
      btnReload.on('pointerdown', ()=>{ try{ this.sound.play('klick'); }catch(_){}
        this.restartToMenu();
      });

      // SOUND ON/OFF — переключение общей mute
      const btnSound = this.add.image(x, ySound, 'sound_on').setInteractive().setDepth(60);
      btnSound.on('pointerdown', ()=>{
        const m = !this.sound.mute;
        this.sound.setMute(m);
        btnSound.setTexture(m ? 'sound_off' : 'sound_on');
        try{ this.sound.play('klick'); }catch(_){}
      });
    }

    // ====== Строительство/улучшение ======
    _createHammer(pos, index){
      const img = this.add.image(pos[0],pos[1],'molot').setInteractive({useHandCursor:true}).setScale(0.6).setDepth(10);
      img.on('pointerdown', ()=> this._buildTower(index));
      this.buildSprites[index] = img;
    }

    _buildTower(index){
      if(State.gold < CONST.TOWER_COST){ alert('Not enough gold'); return; }
      const pos = CONST.BUILD_SPOTS[index];
      if(this.buildSprites[index]){ try{ this.buildSprites[index].destroy(); }catch(_){}
        this.buildSprites[index] = null;
      }
      State.gold -= CONST.TOWER_COST; this._syncHUD();

      const ts = this.add.sprite(pos[0],pos[1],'tower1_idle_1').setInteractive().setDepth(5);
      // Баланс: меньшая скорострельность и урон
      ts.level = 1;
      ts._typeKey = 'tower1';
      ts._range = CONST.TOWER_RANGE;
      ts._shootRate = 900;         // было ~500
      ts._bulletSpeed = 9;
      ts._damage = 5 * ts.level;   // было 10 * level
      ts.hp = 50;
      ts._upgradeCost = CONST.UPGRADE_COST_BASE * (ts.level + 1);

      // Пиктограмма апгрейда
      if(this.textures.exists('up_icon') && this.textures.exists('noup_icon')){
        ts.upIcon = this.add.image(pos[0]-28,pos[1]+40,'noup_icon').setScale(0.6).setDepth(6).setVisible(true);
      }

      // Клик по башне = апгрейд
      ts.on('pointerdown', ()=> this._upgradeTower(ts));

      // Стартовая анимация "idle"
      const idle = `${ts._typeKey}_idle_anim`; if(this.anims.exists(idle)) ts.play(idle);
      ts.setFlipX(ts.x > CONST.WIDTH/2);

      // Восстановление молота при разрушении
      ts.buildSpotIndex = index;
      ts.on('destroy', ()=> {
        this.buildSprites[index] = null;
        this._createHammer(pos,index);
      });

      this.towers.push({ sprite: ts });
    }

    _upgradeTower(ts){
      const cost = Math.floor(ts._upgradeCost || (CONST.UPGRADE_COST_BASE*(ts.level+1)));
      if(ts.level >= 12) return;
      if(State.gold < cost){ alert('Need ' + cost + ' gold'); return; }

      State.gold -= cost; this._syncHUD();
      ts.level += 1;
      ts._typeKey = 'tower' + ts.level;
      ts._range = Math.min(300, ts._range + 30);
      ts._shootRate = Math.max(300, ts._shootRate - 120);  // с каждым уровнем быстрее, но не слишком
      ts._damage = 5 * ts.level;                           // урон растёт мягко
      ts.hp += 50;
      ts._upgradeCost = CONST.UPGRADE_COST_BASE * (ts.level + 1);

      // Смена спрайтовой анимации на новый тип башни
      const idle = `${ts._typeKey}_idle_anim`; if(this.anims.exists(idle)) ts.play(idle);
      if(ts.level>=12 && ts.upIcon) ts.upIcon.setVisible(false);

      // ЗВУК АПГРЕЙДА БАШНИ
      try{ this.sndUp && this.sndUp.play(); }catch(_){}
    }

    // ====== Бой/стрельба ======
    _towersTick(){
      if(!State.started) return;

      let anyShot = false;
      const now = Date.now();

      for(const tObj of this.towers){
        const ts = tObj.sprite; if(!ts || !ts.active) continue;

        // Иконка апгрейда
        if(ts.upIcon){
          const nextCost = Math.floor(ts._upgradeCost || (CONST.UPGRADE_COST_BASE*(ts.level+1)));
          const key = State.gold >= nextCost ? 'up_icon' : 'noup_icon';
          if(ts.upIcon.texture && ts.upIcon.texture.key !== key) ts.upIcon.setTexture(key);
          ts.upIcon.setVisible(!(ts.level>=12));
          ts.upIcon.x = ts.x - 28; ts.upIcon.y = ts.y + 40;
        }

        ts._lastShotTime = ts._lastShotTime || 0;
        if(now - ts._lastShotTime < ts._shootRate){
          const idleKey = `${ts._typeKey}_idle_anim`;
          if(this.anims.exists(idleKey) && (!ts.anims.currentAnim || ts.anims.currentAnim.key.indexOf('_idle_anim')===-1)) ts.play(idleKey, true);
          continue;
        }

        // Поиск цели в радиусе
        let target=null, dmin=1e9;
        this.enemies.getChildren().forEach(e=>{
          if(!e.active || e.state==='die') return;
          const d = Phaser.Math.Distance.Between(ts.x, ts.y, e.x, e.y);
          if(d < ts._range && d < dmin){ dmin=d; target=e; }
        });

        ts._lastShotTime = now;
        if(target){
          let b = this.bullets.get();
          if(!b){ b = this.physics.add.image(ts.x, ts.y, 'arrow'); this.bullets.add(b); }
          b.setActive(true).setVisible(true);
          if(b.body) b.body.enable = true;
          b.setTexture('arrow');                  // ЯВНО выставляем текстуру стрелы
          b.setScale(0.5);
          b.setPosition(ts.x, ts.y - Math.round((ts.displayHeight||40)*0.4));
          b.target = target;
          b.speed = ts._bulletSpeed || 9;
          b.damage = ts._damage || (5*ts.level);
          b.setDepth(30);

          const atkKey = `${ts._typeKey}_atk_anim`; if(this.anims.exists(atkKey)) ts.play(atkKey,true);
          ts.setFlipX(ts.x > CONST.WIDTH/2);
          anyShot = true;
        }else{
          const idleKey = `${ts._typeKey}_idle_anim`; if(this.anims.exists(idleKey)) ts.play(idleKey,true);
        }
      }

      // Луп выстрелов: включаем звук, если сейчас есть выстрелы
      try{
        if(anyShot){
          if(this.sndArrowLp && !this.sndArrowLp.isPlaying && !this.sound.mute) this.sndArrowLp.play();
        }else{
          if(this.sndArrowLp && this.sndArrowLp.isPlaying) this.sndArrowLp.stop();
        }
      }catch(_){}
    }

    _onBulletHit(b,e){
      if(!b.active || !e.active) return;

      // Лёгкий урон при оверлапе (двойную обработку страхуем)
      e.hp -= (b.damage || 5);
      if(e.setTint) e.setTint(0xffcccc);
      this.time.delayedCall(60, ()=>{ try{ e && e.clearTint && e.clearTint(); }catch(_){} });

      if(e.hp <= 0 && e.state !== 'die'){
        this._killEnemy(e); // анимация смерти + удаление по завершению
      }

      // Ресайкл пули
      try{ b.setActive(false); b.setVisible(false); if(b.body){ b.body.enable=false; b.body.setVelocity(0,0); } }catch(_){}
    }

    _updateBullet(b){
      if(!b || !b.active) return;

      // Потеря цели — убрать пулю
      if(!b.target || !b.target.active || b.target.state==='die'){
        try{ b.setActive(false); b.setVisible(false); if(b.body){ b.body.enable=false; b.body.setVelocity(0,0); } }catch(_){}
        return;
      }

      // Движение к цели
      const a = Phaser.Math.Angle.Between(b.x,b.y,b.target.x,b.target.y);
      b.rotation = a;
      const sp = b.speed || 8;
      b.x += Math.cos(a)*sp; b.y += Math.sin(a)*sp;

      // Сработать по близости (страховка на случай пропуска overlap)
      const dx=b.target.x-b.x, dy=b.target.y-b.y;
      if(Math.hypot(dx,dy) < 10){
        try{
          if(b.target && b.target.active){
            b.target.hp -= (b.damage||5);
            if(b.target.hp <= 0 && b.target.state!=='die'){ this._killEnemy(b.target); }
          }
        }catch(_){}
        try{ b.setActive(false); b.setVisible(false); if(b.body){ b.body.enable=false; b.body.setVelocity(0,0); } }catch(_){}
      }

      // Вышли за экран — убрать пулю
      if(b.x < -50 || b.x > CONST.WIDTH+50 || b.y < -50 || b.y > CONST.HEIGHT+50){
        try{ b.setActive(false); b.setVisible(false); if(b.body) b.body.enable=false; }catch(_){}
      }
    }

    _killEnemy(e){
      e.state = 'die';
      // === ВКЛЮЧАЕМ АНИМАЦИЮ СМЕРТИ (assets/enemy/die_enemy/dead1..7.png) ===
      if(this.anims.exists('e_die_anim')) e.play('e_die_anim');
      State.gold += CONST.KILL_REWARD; this._syncHUD();

      // После проигрыша анимации — уничтожение
      e.once('animationcomplete', (anim)=>{
        if(!anim || anim.key==='e_die_anim'){
          try{ e.body && (e.body.enable=false); e.destroy(); }catch(_){}
        }
      });
    }

    // ====== Враги/движение/атаки ======
    _spawnEnemy(path, hp){
      const spawn = path[0];
      const e = this.physics.add.sprite(spawn[0],spawn[1],'e_walk_0').setScale(0.35);
      e.maxHp = hp; e.hp = hp;
      e.speed = 0.22 + Math.min(0.05*State.wave, 0.5);
      e.path = path; e.pathIndex = 1;
      e.state='walk'; e._savedPathIndex=null; e._lastAttack=0;
      e.play('e_walk_anim');
      this.enemies.add(e);
    }

    _updateEnemy(e){
      if(!e || !e.active || e.state==='die') return;

      // Захват ближайшей башни в зоне агро
      let nearest=null, nd=1e9;
      for(const tObj of this.towers){
        const ts=tObj.sprite; if(!ts||!ts.active) continue;
        const d=Phaser.Math.Distance.Between(e.x,e.y,ts.x,ts.y);
        if(d < CONST.ENEMY_AGGRO && d < nd){ nd=d; nearest=ts; }
      }
      if(nearest){ e.targetTower=nearest; e._savedPathIndex=e.pathIndex; if(e.anims.currentAnim?.key!=='e_atk_anim') e.play('e_atk_anim'); }

      // Атака башни
      if(e.targetTower && e.targetTower.active){
        this._moveTowards(e, e.targetTower.x, e.targetTower.y, e.speed);
        e.setFlipX(e.targetTower.x < e.x);
        const d = Phaser.Math.Distance.Between(e.x,e.y,e.targetTower.x,e.targetTower.y);
        if(d < 26 && (!e._lastAttack || Date.now()-e._lastAttack > 900)){
          e._lastAttack = Date.now();
          if(e.targetTower.hp != null){
            e.targetTower.hp -= 10;
            try{ e.targetTower.setTint && e.targetTower.setTint(0xff9999); this.time.delayedCall(80,()=>{ try{ e.targetTower.clearTint && e.targetTower.clearTint(); }catch(_){}});}catch(_){}
            if(e.targetTower.hp <= 0){
              // ЗВУК "враг сломал башню"
              try{ this.sndRush && this.sndRush.play(); }catch(_){}

              // Восстановить точку строительства (молот)
            
              try{ e.targetTower.upIcon && e.targetTower.upIcon.destroy(); }catch(_){}
              try{ e.targetTower.destroy(); }catch(_){}
              this.towers = this.towers.filter(t=>t && t.sprite && t.sprite.active);

              e.targetTower=null; e.state='returning';
              if(e._savedPathIndex!=null) e.pathIndex=e._savedPathIndex;
            }
          }else{
            e.targetTower=null; e.state='returning';
          }
        }
        return;
      }

      // Возврат к пути
      if(e.state==='returning'){
        const target = e.path[e.pathIndex] || e.path[e.path.length-1];
        this._moveTowards(e, target[0], target[1], e.speed);
        if(Phaser.Math.Distance.Between(e.x,e.y,target[0],target[1])<8){
          e.state='walk'; if(e.anims.currentAnim?.key!=='e_walk_anim') e.play('e_walk_anim');
        }
        return;
      }

      // Дошёл до базы — бьём базу
      if(e.pathIndex >= e.path.length){
        if(!e._lastAttack || Date.now()-e._lastAttack > 900){
          e._lastAttack = Date.now();
          State.baseHp -= 10; if(State.baseHp < 0) State.baseHp = 0;
          this._syncHUD();
          if(State.baseHp<=0){ this.showGameOver(); }
        }
        if(e.anims.currentAnim?.key!=='e_atk_anim') e.play('e_atk_anim');
        return;
      }

      // Шаг по путевым точкам
      const wp = e.path[e.pathIndex];
      if(wp){
        this._moveTowards(e, wp[0], wp[1], e.speed);
        if(Phaser.Math.Distance.Between(e.x,e.y,wp[0],wp[1])<6) e.pathIndex++;
        e.setFlipX(wp[0] < e.x);
        if(e.anims.currentAnim?.key!=='e_walk_anim') e.play('e_walk_anim');
      }
    }

    _moveTowards(obj, tx, ty, speed){
      const dx=tx-obj.x, dy=ty-obj.y, dist=Math.hypot(dx,dy);
      if(dist<0.1) return; obj.x += (dx/dist)*speed*2; obj.y += (dy/dist)*speed*2;
    }

    // ====== ВОЛНЫ ======
    _scheduleNextWave(delay=1000){
      this.time.addEvent({ delay, callback: ()=> this._startWave() });
    }

    _startWave(){
      if(!State.started) return;
      State.wave++; State.gold += CONST.WAVE_BONUS; this._syncHUD();

      const enemyHp = 100 + State.wave;
      const maxEnemiesPerSpawn = 20;
      const enemiesPerSpawn = Math.min(maxEnemiesPerSpawn, 1 + State.wave);

      for(let i=0;i<CONST.PATHS.length;i++){
        const path = CONST.PATHS[i];
        for(let j=0;j<enemiesPerSpawn;j++){
          this.time.addEvent({ delay: j*850 + i*300, callback: ()=> this._spawnEnemy(path, enemyHp) });
        }
      }
      const nextDelay = (enemiesPerSpawn * 850) + 3200;
      this._scheduleNextWave(nextDelay);
    }

    // ====== Анимации ======
    _createAnims(){
      // Башни
      for(let i=1;i<=12;i++){
        const idle=[], atk=[];
        for(let j=1;j<=4;j++) idle.push({key:`tower${i}_idle_${j}`});
        for(let j=0;j<5;j++) atk.push({key:`tower${i}_atk_${j}`});
        if(!this.anims.exists(`tower${i}_idle_anim`)) this.anims.create({key:`tower${i}_idle_anim`,frames:idle,frameRate:8,repeat:-1});
        if(!this.anims.exists(`tower${i}_atk_anim`))  this.anims.create({key:`tower${i}_atk_anim`, frames:atk, frameRate:12, repeat:-1});
      }
      // Враги
      const eWalk=[], eAtk=[], eDie=[];
      for(let i=0;i<7;i++){ eWalk.push({key:`e_walk_${i}`}); eAtk.push({key:`e_atk_${i}`}); eDie.push({key:`e_die_${i}`}); }
      if(!this.anims.exists('e_walk_anim')) this.anims.create({key:'e_walk_anim',frames:eWalk,frameRate:8,repeat:-1});
      if(!this.anims.exists('e_atk_anim'))  this.anims.create({key:'e_atk_anim', frames:eAtk, frameRate:8,repeat:-1});
      if(!this.anims.exists('e_die_anim'))  this.anims.create({key:'e_die_anim', frames:eDie, frameRate:10, repeat:0}); // <— смерть проигрывается ОДИН РАЗ
    }
  }

  // ========================================================================
  //                             PHASER СТАРТ
  // ========================================================================
  const config = {
    type: Phaser.AUTO,
    width: CONST.WIDTH, height: CONST.HEIGHT,
    parent: 'game',
    physics:{ default:'arcade', arcade:{ debug:false } },
    scene:[AppScene]
  };
  const game = new Phaser.Game(config);

  // ========================================================================
  //                   DOM-ЛОГИКА ПЕРЕКЛЮЧЕНИЯ СЛОЁВ
  // ========================================================================
  function showMenuOverlay(){ menuOverlay.classList.remove('hidden'); gameoverOverlay.classList.add('hidden'); }
  function hideMenuOverlay(){ menuOverlay.classList.add('hidden'); }
  function showGameoverOverlay(){ gameoverOverlay.classList.remove('hidden'); menuOverlay.classList.add('hidden'); }
  function hideGameoverOverlay(){ gameoverOverlay.classList.add('hidden'); }

  // Старт из меню
  startBtn.addEventListener('click', ()=>{
    const sc = game.scene.keys['AppScene'];
    if(!sc) return;
    sc.startGameFromMenu(); // отключит lobby и видео меню, включит battle
  });

  // Рестарт с гейм-овера → в меню
  restartBtn.addEventListener('click', ()=>{
    hideGameoverOverlay();
    const sc = game.scene.keys['AppScene'];
    if(!sc) return;
    sc.restartToMenu();
  });

  // На загрузке страницы показываем меню и запускаем видео (звук меню запускается из сцены)
  window.addEventListener('load', ()=>{
    try{ showMenuOverlay(); menuVideo.play().catch(()=>{}); }catch(_){}
  });
  </script>
</body>
</html>
