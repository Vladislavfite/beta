<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Tower Defense</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: #000;
    }
    #menu, #gameover {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      z-index: 10;
    }
    #menu button, #gameover button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
    }
    #gameover, #menu { display: none; }
  </style>
</head>
<body>

  <canvas id="game" width="720" height="1280"></canvas>

  <div id="menu">
    <h1>Главное меню</h1>
    <button id="startBtn">Играть</button>
  </div>

  <div id="gameover">
    <h1>Игра окончена</h1>
    <button id="restartBtn">Начать заново</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
