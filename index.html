<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Tower Defense</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <script src="phaser.min.js"></script>
  <script src="main.js"></script>
  <script>
    // === ИНИЦИАЛИЗАЦИЯ ИГРЫ ===
    const config = {
      type: Phaser.AUTO,
      width: 720,
      height: 1280,
      backgroundColor: "#000000",
      physics: {
        default: "arcade",
        arcade: { debug: false }
      },
      scene: {
        preload: create_preload,
        create: create,
        update: update
      }
    };

    const game = new Phaser.Game(config);

    // Безопасная обработка ошибок
    window.addEventListener("error", (e) => {
      console.warn("Script error:", e.message);
    });
  </script>

</body>
</html>
