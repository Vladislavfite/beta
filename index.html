<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=720, height=1280, user-scalable=no" />
  <title>Tower Defense — single window</title>
  <style>
    :root{--w:720px;--h:1280px}
    html,body{height:100%;margin:0;background:#000;display:flex;align-items:center;justify-content:center}
    #container{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#000}
    canvas{position:absolute;left:0;top:0}

    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:auto}
    .panel{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
    .hidden{display:none}

    .btn{width:280px;height:80px;border-radius:18px;border:none;font-size:28px;background:#1e90ff;color:#fff;cursor:pointer;box-shadow:0 0 20px rgba(0,0,0,.5);z-index:2}

    .bg-video, .bg-img {position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}

    #hud{position:absolute;left:0;right:0;bottom:0;height:120px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;z-index:50;pointer-events:none}
    #hud .left,#hud .right{pointer-events:auto}
    #hud .text{color:#fff;font-family:Arial,sans-serif; text-shadow:0 0 6px rgba(0,0,0,.8)}

    @media (max-width:800px){#container{transform:scale(.9)}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
</head>
<body>
  <div id="container">
    <!-- MENU (lobby.webm background) -->
    <div id="menu" class="overlay">
      <video id="menuVid" class="bg-video" src="assets/lobby.webm" autoplay loop muted playsinline></video>
      <div class="panel">
        <h1 style="color:#fff;margin:0;font-family:Arial;z-index:2">Tower Defense</h1>
        <button id="startBtn" class="btn">▶ Начать игру</button>
      </div>
    </div>

    <!-- GAMEOVER (gameover.webp background) -->
    <div id="gameover" class="overlay hidden">
      <img id="goImg" class="bg-img" src="assets/gameover.webp" alt="gameover"/>
      <div class="panel">
        <h2 style="color:#fff;margin:0;font-family:Arial;z-index:2">Game Over</h2>
        <button id="restartBtn" class="btn">▶ Начать заново</button>
      </div>
    </div>

    <!-- Phaser canvas host -->
    <div id="game" style="width:720px;height:1280px"></div>

    <!-- HUD -->
    <div id="hud">
      <div class="left">
        <div id="goldText" class="text">Gold: 0</div>
        <div id="waveText" class="text">Wave: 0</div>
      </div>
      <div class="right">
        <div id="baseText" class="text">BASE HP 1000</div>
      </div>
    </div>
  </div>

  <script>
  // ====== CONSTANTS / STATE ======
  const CONST = {
    WIDTH: 720, HEIGHT: 1280,
    BUILD_SPOTS: [[484,95],[359,155],[435,235],[373,288],[218,310],[113,394],[316,417],[444,432],[589,550],[484,527],[351,539],[286,631],[162,630],[127,728],[416,706],[285,781],[430,822],[301,867],[275,1016],[355,1015],[511,992],[581,946],[667,1016],[532,1083],[458,1127],[329,1149],[174,1116]],
    PATHS: [
      [[377,50],[429,138],[410,189],[346,224],[311,257],[290,305],[331,354],[400,463],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[81,335],[189,359],[331,354],[400,463],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[636,490],[544,498],[413,491],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[52,667],[168,691],[289,700],[347,736],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[646,963],[565,1029],[441,1069],[312,1082],[226,1059]]
    ],
    START_GOLD: 50000, KILL_REWARD: 10, WAVE_BONUS: 50, TOWER_COST: 100, UPGRADE_COST_BASE: 150,
    ENEMY_AGGRO: 150, TOWER_RANGE: 200
  };

  const $ = (id)=>document.getElementById(id);
  const menuEl = $('menu'), gameoverEl = $('gameover'), startBtn = $('startBtn'), restartBtn = $('restartBtn');
  const goldText = $('goldText'), waveText = $('waveText'), baseText = $('baseText');
  const menuVid = $('menuVid');

  const State = {
    started:false,
    gold: CONST.START_GOLD,
    wave: 0,
    baseHp: 1000,
    muted:false
  };

  // ====== PHASER SCENE ======
  class AppScene extends Phaser.Scene {
    constructor(){ super({ key:'AppScene' }); }

    preload(){
      // map / ui
      this.load.image('map','assets/map.png');
      this.load.image('molot','assets/elements/moloticon.png');
      this.load.image('up_icon','assets/elements/up.png');
      this.load.image('noup_icon','assets/elements/noup.png');
      this.load.image('arrow','assets/elements/arrow.png'); // bullet sprite

      // side menu icons
      ['menu_icon','pause_icon','play2','reload_icon','sound_on','sound_off','reklama'].forEach(k=>this.load.image(k,`assets/elements/${k.replace('menu_icon','menu')}.png`));

      // towers & enemies spritesheets-as-frames
      for(let i=1;i<=12;i++){
        for(let j=1;j<=4;j++) this.load.image(`tower${i}_idle_${j}`, `assets/attacktower/statik/tower${i}/stower${j}.png`);
        for(let j=1;j<=5;j++) this.load.image(`tower${i}_atk_${j-1}`, `assets/attacktower/attack/tower${i}/aatcktower${j}.png`);
      }
      for(let i=0;i<7;i++){
        this.load.image(`e_walk_${i}`,`assets/enemy/walk/walk${i+1}.png`);
        this.load.image(`e_atk_${i}`,`assets/enemy/atack_enemy/atackenemy${i+1}.png`);
        this.load.image(`e_die_${i}`,`assets/enemy/die_enemy/dead${i+1}.png`);
      }

      // sounds
      [['arrow_s','assets/sound/arrow.mp3'],
       ['battle','assets/sound/battle.mp3'],
       ['lobby','assets/sound/lobby.mp3'],
       ['gameover_s','assets/sound/gameover.mp3'],
       ['klick','assets/sound/klick.ogg']
      ].forEach(([k,p])=>{ try{ this.load.audio(k,p); }catch(e){} });
    }

    create(){
      // background map
      this.add.image(CONST.WIDTH/2, CONST.HEIGHT/2, 'map').setDisplaySize(CONST.WIDTH, CONST.HEIGHT);

      // groups
      this.enemies = this.add.group();
      this.bullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: 300, runChildUpdate: false });

      this.towers = [];
      this.buildSprites = new Array(CONST.BUILD_SPOTS.length).fill(null);

      // build spots (hammers)
      CONST.BUILD_SPOTS.forEach((p,i)=> this._createHammer(p,i));

      // ui texts (DOM sync)
      this._syncHUD();

      // animations
      this._createAnims();

      // sounds
      try{
        this.sndBattle = this.sound.add('battle', { loop:true, volume:0.6 });
        this.sndLobby  = this.sound.add('lobby',  { loop:true, volume:0.6 });
        this.sndGameOver = this.sound.add('gameover_s', { volume:0.9 });
        this.sndArrowLoop = this.sound.add('arrow_s', { loop:true, volume:0.35 });
      }catch(e){}

      // side menu (Phaser UI)
      this._buildSideMenu();

      // main loop for towers
      this.time.addEvent({ delay: 120, loop: true, callback: ()=> this._towerTick() });

      // collisions bullets/enemies
      this.physics.add.overlap(this.bullets, this.enemies, (b,e)=> this._onBulletHit(b,e));

      // STARTUP: freeze gameplay until pressed "start"
      this.scene.pause(); // pause physics/timers
    }

    // ---------- menu control from DOM ----------
    startGame(){
      if(State.started) return;
      State.started = true;
      try{ this.sndLobby && this.sndLobby.stop(); }catch(e){}
      try{ this.sndBattle && !this.sndBattle.isPlaying && this.sndBattle.play(); }catch(e){}
      // unpause and begin waves
      this.scene.resume();
      this._scheduleNextWave(500);
    }

    showMenu(){
      State.started = false;
      try{ this.sndBattle && this.sndBattle.stop(); }catch(e){}
      try{ this.sndLobby && !this.sndLobby.isPlaying && this.sndLobby.play(); }catch(e){}
      this.scene.pause();
    }

    showGameOver(){
      try{ this.sndBattle && this.sndBattle.stop(); }catch(e){}
      try{ this.sndGameOver && this.sndGameOver.play(); }catch(e){}
      this.scene.pause();
      gameoverEl.classList.remove('hidden');
    }

    // ---------- helpers ----------
    _syncHUD(){
      goldText.textContent = 'Gold: ' + State.gold;
      waveText.textContent = 'Wave: ' + State.wave;
      baseText.textContent = 'BASE HP ' + Math.max(0, State.baseHp);
    }

    _createHammer(pos, index){
      const img = this.add.image(pos[0],pos[1],'molot').setInteractive({useHandCursor:true}).setScale(0.6).setDepth(10);
      img.on('pointerdown', ()=> this._buildTower(index));
      this.buildSprites[index] = img;
    }

    _buildTower(index){
      if(State.gold < CONST.TOWER_COST){ alert('Not enough gold'); return; }
      const pos = CONST.BUILD_SPOTS[index];
      this.buildSprites[index] && this.buildSprites[index].destroy();
      this.buildSprites[index] = null;
      State.gold -= CONST.TOWER_COST; this._syncHUD();

      const ts = this.add.sprite(pos[0],pos[1],'tower1_idle_1').setInteractive().setDepth(5);
      // ↓ Снижена скорость атаки и урон
      ts.level = 1;
      ts._typeKey = 'tower1';
      ts._range = CONST.TOWER_RANGE;
      ts._shootRate = 900;          // было ~500
      ts._bulletSpeed = 9;
      ts._damage = 5 * ts.level;    // было 10 * level
      ts.hp = 50;
      ts._upgradeCost = CONST.UPGRADE_COST_BASE * (ts.level + 1);

      if(this.textures.exists('up_icon') && this.textures.exists('noup_icon')){
        ts.upIcon = this.add.image(pos[0]-28,pos[1]+40,'noup_icon').setScale(0.6).setDepth(6).setVisible(true);
      }

      ts.on('pointerdown', ()=> this._upgradeTower(ts));
      this.towers.push({ sprite: ts });
      ts.setFlipX(ts.x > CONST.WIDTH/2);

      const idleAnim = `${ts._typeKey}_idle_anim`; if(this.anims.exists(idleAnim)) ts.play(idleAnim);
      ts.on('destroy', ()=> { this.buildSprites[index]=null; this._createHammer(pos,index); });
    }

    _upgradeTower(ts){
      const cost = Math.floor(ts._upgradeCost || (CONST.UPGRADE_COST_BASE*(ts.level+1)));
      if(ts.level >= 12) return;
      if(State.gold < cost){ alert('Need ' + cost + ' gold'); return; }
      State.gold -= cost; this._syncHUD();
      ts.level += 1;
      ts._typeKey = 'tower' + ts.level;
      ts._range = Math.min(300, ts._range + 30);
      ts._shootRate = Math.max(300, ts._shootRate - 120);  // апгрейд ускоряет, но в рамках
      ts._damage = 5 * ts.level;                           // урон растет мягко
      ts.hp += 50;
      ts._upgradeCost = CONST.UPGRADE_COST_BASE * (ts.level + 1);
      const idle = ts._typeKey + '_idle_anim'; if(this.anims.exists(idle)) ts.play(idle);
      if(ts.level>=12 && ts.upIcon) ts.upIcon.setVisible(false);
    }

    _towerTick(){
      if(!State.started) return;
      const now = Date.now();
      // determine if any bullets active to drive arrow sound
      let anyShot = false;

      for(const tObj of this.towers){
        const ts = tObj.sprite; if(!ts || !ts.active) continue;
        ts._lastShotTime = ts._lastShotTime || 0;
        // upgrade icon state
        if(ts.upIcon){
          const nextCost = Math.floor(ts._upgradeCost || (CONST.UPGRADE_COST_BASE*(ts.level+1)));
          const key = State.gold >= nextCost ? 'up_icon' : 'noup_icon';
          if(ts.upIcon.texture && ts.upIcon.texture.key !== key) ts.upIcon.setTexture(key);
          ts.upIcon.setVisible(!(ts.level>=12));
          ts.upIcon.x = ts.x - 28; ts.upIcon.y = ts.y + 40;
        }

        if(now - ts._lastShotTime < ts._shootRate){
          const idleKey = `${ts._typeKey}_idle_anim`; if(this.anims.exists(idleKey) && (!ts.anims.currentAnim || ts.anims.currentAnim.key.indexOf('_idle_anim')===-1)) ts.play(idleKey,true);
          continue;
        }

        // find nearest enemy
        let target=null, dmin=1e9;
        this.enemies.getChildren().forEach(e=>{
          if(!e.active || e.state==='die') return;
          const d = Phaser.Math.Distance.Between(ts.x, ts.y, e.x, e.y);
          if(d < ts._range && d < dmin){ dmin=d; target=e; }
        });

        ts._lastShotTime = now;
        if(target){
          let b = this.bullets.get();
          if(!b){ b = this.physics.add.image(ts.x, ts.y, 'arrow'); this.bullets.add(b); }
          b.setActive(true).setVisible(true);
          if(b.body) b.body.enable = true;
          b.setPosition(ts.x, ts.y - Math.round((ts.displayHeight||40)*0.4));
          b.setScale(0.5);
          b.target = target; b.speed = ts._bulletSpeed || 9; b.damage = ts._damage || (5*ts.level);
          b.setDepth(30);

          const atkKey = `${ts._typeKey}_atk_anim`; if(this.anims.exists(atkKey)) ts.play(atkKey,true);
          ts.setFlipX(ts.x > CONST.WIDTH/2);
          anyShot = true;
        }else{
          const idleKey = `${ts._typeKey}_idle_anim`; if(this.anims.exists(idleKey)) ts.play(idleKey,true);
        }
      }

      // arrow loop sound on/off
      try{
        if(anyShot){
          if(this.sndArrowLoop && !this.sndArrowLoop.isPlaying && !this.sound.mute) this.sndArrowLoop.play();
        }else{
          if(this.sndArrowLoop && this.sndArrowLoop.isPlaying) this.sndArrowLoop.stop();
        }
      }catch(e){}
    }

    _onBulletHit(b,e){
      if(!b.active || !e.active) return;
      e.hp -= (b.damage || 5);
      if(e.setTint) e.setTint(0xffcccc);
      this.time.delayedCall(60, ()=>{ try{ e && e.clearTint && e.clearTint(); }catch(_){}});

      if(e.hp <= 0 && e.state !== 'die'){
        e.state = 'die';
        if(this.anims.exists('e_die_anim')) e.play('e_die_anim');
        State.gold += CONST.KILL_REWARD; this._syncHUD();
        e.once('animationcomplete', (anim)=>{
          if(anim && anim.key==='e_die_anim'){
            try{ e.body && (e.body.enable=false); e.destroy(); }catch(_){}
          }
        });
      }

      // recycle bullet
      try{ b.setActive(false); b.setVisible(false); if(b.body){ b.body.enable=false; b.body.setVelocity(0,0); } }catch(_){}
    }

    _updateBullet(b){
      if(!b || !b.active) return;
      if(!b.target || !b.target.active || b.target.state==='die'){
        try{ b.setActive(false); b.setVisible(false); if(b.body){ b.body.enable=false; b.body.setVelocity(0,0); } }catch(_){}
        return;
      }
      const a = Phaser.Math.Angle.Between(b.x,b.y,b.target.x,b.target.y);
      b.rotation = a;
      const sp = b.speed || 8;
      b.x += Math.cos(a)*sp; b.y += Math.sin(a)*sp;

      const dx=b.target.x-b.x, dy=b.target.y-b.y;
      if(Math.sqrt(dx*dx+dy*dy) < 10){
        try{
          if(b.target && b.target.active){
            b.target.hp -= (b.damage||5);
            if(b.target.setTint) b.target.setTint(0xffcccc);
            this.time.delayedCall(60, ()=>{ try{ b.target && b.target.clearTint && b.target.clearTint(); }catch(_){} });
          }
        }catch(_){}
        try{ b.setActive(false); b.setVisible(false); if(b.body){ b.body.enable=false; b.body.setVelocity(0,0); } }catch(_){}
      }

      if(b.x < -50 || b.x > CONST.WIDTH+50 || b.y < -50 || b.y > CONST.HEIGHT+50){
        try{ b.setActive(false); b.setVisible(false); if(b.body) b.body.enable=false; }catch(_){}
      }
    }

    _createAnims(){
      // towers
      for(let i=1;i<=12;i++){
        const idle=[], atk=[];
        for(let j=1;j<=4;j++) idle.push({key:`tower${i}_idle_${j}`});
        for(let j=0;j<5;j++) atk.push({key:`tower${i}_atk_${j}`});
        if(!this.anims.exists(`tower${i}_idle_anim`)) this.anims.create({key:`tower${i}_idle_anim`,frames:idle,frameRate:8,repeat:-1});
        if(!this.anims.exists(`tower${i}_atk_anim`))  this.anims.create({key:`tower${i}_atk_anim`, frames:atk, frameRate:12, repeat:-1});
      }
      // enemies
      const eWalk=[], eAtk=[], eDie=[];
      for(let i=0;i<7;i++){ eWalk.push({key:`e_walk_${i}`}); eAtk.push({key:`e_atk_${i}`}); eDie.push({key:`e_die_${i}`}); }
      if(!this.anims.exists('e_walk_anim')) this.anims.create({key:'e_walk_anim',frames:eWalk,frameRate:8,repeat:-1});
      if(!this.anims.exists('e_atk_anim'))  this.anims.create({key:'e_atk_anim', frames:eAtk, frameRate:8,repeat:-1});
      if(!this.anims.exists('e_die_anim'))  this.anims.create({key:'e_die_anim', frames:eDie, frameRate:10, repeat:0});
    }

    _scheduleNextWave(delay=1000){
      this.time.addEvent({ delay, callback: ()=> this._startWave() });
    }

    _startWave(){
      if(!State.started) return;
      State.wave++; State.gold += CONST.WAVE_BONUS; this._syncHUD();

      const enemyHp = 100 + State.wave;
      const maxEnemiesPerSpawn = 20;
      const enemiesPerSpawn = Math.min(maxEnemiesPerSpawn, 1 + State.wave);
      for(let i=0;i<CONST.PATHS.length;i++){
        const path = CONST.PATHS[i];
        for(let j=0;j<enemiesPerSpawn;j++){
          this.time.addEvent({ delay: j*850 + i*300, callback: ()=> this._spawnEnemy(path, enemyHp) });
        }
      }
      const nextDelay = (enemiesPerSpawn * 850) + 3200;
      this._scheduleNextWave(nextDelay);
    }

    _spawnEnemy(path, hp){
      const spawn = path[0];
      const e = this.physics.add.sprite(spawn[0],spawn[1],'e_walk_0').setScale(0.35);
      e.maxHp = hp; e.hp = hp;
      e.speed = 0.22 + Math.min(0.05*State.wave, 0.5);
      e.path = path; e.pathIndex = 1;
      e.state='walk'; e._savedPathIndex=null; e._lastAttack=0;
      e.play('e_walk_anim');
      this.enemies.add(e);
    }

    _updateEnemy(e){
      if(!e || !e.active || e.state==='die') return;

      // aggro tower
      let nearest=null, nd=1e9;
      for(const tObj of this.towers){
        const ts=tObj.sprite; if(!ts||!ts.active) continue;
        const d=Phaser.Math.Distance.Between(e.x,e.y,ts.x,ts.y);
        if(d < CONST.ENEMY_AGGRO && d < nd){ nd=d; nearest=ts; }
      }
      if(nearest){ e.targetTower=nearest; e._savedPathIndex=e.pathIndex; if(e.anims.currentAnim?.key!=='e_atk_anim') e.play('e_atk_anim'); }

      // attack tower
      if(e.targetTower && e.targetTower.active){
        this._moveTowards(e, e.targetTower.x, e.targetTower.y, e.speed);
        e.setFlipX(e.targetTower.x < e.x);
        const d = Phaser.Math.Distance.Between(e.x,e.y,e.targetTower.x,e.targetTower.y);
        if(d < 26 && (!e._lastAttack || Date.now()-e._lastAttack > 900)){
          e._lastAttack = Date.now();
          if(e.targetTower.hp != null){
            e.targetTower.hp -= 10;
            try{ e.targetTower.setTint && e.targetTower.setTint(0xff9999); this.time.delayedCall(80,()=>{ try{ e.targetTower.clearTint && e.targetTower.clearTint(); }catch(_){}});}catch(_){}
            if(e.targetTower.hp <= 0){
              // respawn hammer
              const idx = CONST.BUILD_SPOTS.findIndex((p,i)=> this.buildSprites[i]===null);
              if(idx>=0){
                const p = CONST.BUILD_SPOTS[idx];
                this.buildSprites[idx] = this.add.image(p[0],p[1],'molot').setInteractive().setScale(0.6).on('pointerdown', ()=> this._buildTower(idx));
              }
              try{ e.targetTower.upIcon && e.targetTower.upIcon.destroy(); }catch(_){}
              try{ e.targetTower.destroy(); }catch(_){}
              this.towers = this.towers.filter(t=>t && t.sprite && t.sprite.active);
              e.targetTower=null; e.state='returning';
              if(e._savedPathIndex!=null) e.pathIndex=e._savedPathIndex;
            }
          }else{
            e.targetTower=null; e.state='returning';
          }
        }
        return;
      }

      // return to path
      if(e.state==='returning'){
        const target = e.path[e.pathIndex] || e.path[e.path.length-1];
        this._moveTowards(e, target[0], target[1], e.speed);
        if(Phaser.Math.Distance.Between(e.x,e.y,target[0],target[1])<8){
          e.state='walk'; if(e.anims.currentAnim?.key!=='e_walk_anim') e.play('e_walk_anim');
        }
        return;
      }

      // finish path -> damage base
      if(e.pathIndex >= e.path.length){
        if(!e._lastAttack || Date.now()-e._lastAttack > 900){
          e._lastAttack = Date.now();
          State.baseHp -= 10; if(State.baseHp < 0) State.baseHp = 0;
          this._syncHUD();
          if(State.baseHp<=0){ this.showGameOver(); }
        }
        if(e.anims.currentAnim?.key!=='e_atk_anim') e.play('e_atk_anim');
        return;
      }

      // walk
      const wp = e.path[e.pathIndex];
      if(wp){
        this._moveTowards(e, wp[0], wp[1], e.speed);
        if(Phaser.Math.Distance.Between(e.x,e.y,wp[0],wp[1])<6) e.pathIndex++;
        e.setFlipX(wp[0] < e.x);
        if(e.anims.currentAnim?.key!=='e_walk_anim') e.play('e_walk_anim');
      }
    }

    _moveTowards(obj, tx, ty, speed){
      const dx=tx-obj.x, dy=ty-obj.y, dist=Math.hypot(dx,dy);
      if(dist<0.1) return; obj.x += (dx/dist)*speed*2; obj.y += (dy/dist)*speed*2;
    }

    _buildSideMenu(){
      // right column buttons
      const x = 576, y0 = 629, dy = 71;
      const addBtn = (key, yy, cb)=>{ try{ const b=this.add.image(x,yy,key).setInteractive().setDepth(60); b.on('pointerdown',()=>{ try{ this.sound.play('klick'); }catch(_){ } cb&&cb(); }); return b; }catch(e){ return null; } };

      // menu -> back to menu overlay
      addBtn('menu', y0, ()=>{ showMenuDOM(); this.showMenu(); });

      // reload -> restart scene state
      addBtn('reload', y0+dy, ()=> restartGame());

      // play2 -> resume
      addBtn('play2', y0+dy*1.0, ()=>{ if(!State.started){ hideMenuDOM(); this.startGame(); } });

      // pause/resume icon
      addBtn('pause', y0+dy* -1, ()=>{ if(this.scene.isPaused()) { hideMenuDOM(); this.scene.resume(); } else { this.scene.pause(); } });

      // sound toggle
      const soundBtn = addBtn('sound_on', y0+dy*2, ()=>{
        const m = !this.sound.mute; this.sound.setMute(m);
        soundBtn.setTexture(m? 'sound_off':'sound_on');
      });

      // reklama placeholder
      addBtn('reklama', 1127, ()=> console.log('Ad placeholder'));
    }

    update(){
      if(!State.started) return;
      this.enemies.getChildren().forEach(e=> this._updateEnemy(e));
      this.bullets.getChildren().forEach(b=> this._updateBullet(b));
      this._syncHUD();
    }
  }

  // ====== PHASER BOOT ======
  const config = { type: Phaser.AUTO, width: CONST.WIDTH, height: CONST.HEIGHT, parent: 'game',
    physics:{ default:'arcade', arcade:{ debug:false } }, scene:[AppScene] };
  const game = new Phaser.Game(config);

  // ====== DOM MENU CONTROL ======
  function showMenuDOM(){ menuEl.classList.remove('hidden'); gameoverEl.classList.add('hidden'); try{ menuVid.play().catch(()=>{});}catch(_){ } }
  function hideMenuDOM(){ menuEl.classList.add('hidden'); try{ menuVid.pause(); }catch(_){ } }

  function showGameOverDOM(){ gameoverEl.classList.remove('hidden'); menuEl.classList.add('hidden'); }
  function hideGameOverDOM(){ gameoverEl.classList.add('hidden'); }

  startBtn.addEventListener('click', ()=>{
    hideMenuDOM();
    const sc = game.scene.keys['AppScene'];
    if(sc){ sc.startGame(); }
  });

  restartBtn.addEventListener('click', ()=>{
    hideGameOverDOM();
    restartGame(true);
  });

  function restartGame(fromButton=false){
    const sc = game.scene.keys['AppScene'];
    if(!sc) return;
    // reset state
    State.started = false;
    State.gold = CONST.START_GOLD; State.wave = 0; State.baseHp = 1000;
    // sounds
    try{ sc.sndArrowLoop && sc.sndArrowLoop.stop(); }catch(_){}
    try{ sc.sndBattle && sc.sndBattle.stop(); }catch(_){}
    sc.scene.restart();
    showMenuDOM();
    sc.showMenu();
  }

  // on load -> show menu + lobby music attempt (will actually play after gesture)
  window.addEventListener('load', ()=>{
    showMenuDOM();
    const sc = game.scene.keys['AppScene'];
    // sound will start on first click automatically inside startGame()
  });
  </script>
</body>
</html>
