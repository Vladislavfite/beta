<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=720, height=1280, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Tower Defense — база, герои, 2-я валюта (без помощников)</title>

  <!-- Предзагрузка ключевых ассетов -->
  <script>
    (function preloadAssets(){
      const add = (as, href, type) => {
        const l = document.createElement('link');
        l.rel = 'preload'; l.as = as; l.href = href; if(type) l.type = type;
        document.head.appendChild(l);
      };
      // Видео
      add('video','assets/menu.webm','video/webm');
      add('video','assets/gameover.webm','video/webm');

      // Карта
      add('image','assets/map.png','image/png');

 // База (сам объект): basehp20/40/60/80/100
[20,40,60,80,100].forEach(p=> add('image', `assets/base/basehp${p}.png`, 'image/png'));

// Иконка HP над базой (надпись/плашка хп): base0/20/40/60/100
[0,20,40,60,100].forEach(p=> add('image', `assets/base/base${p}.png`, 'image/png'));


      // UI
      ['moloticon','up','noup','arrow','menu','reload','sound','soundoff','fast','slow','pause','play2','gold','play','playagain','bluecoin','hero1','hero2','hero3','star1','star2','star3']
        .forEach(n=> add('image',`assets/elements/${n}.png`,'image/png'));

      // Монеты/реклама
      for(let i=1;i<=6;i++){
        add('image',`assets/money/money${i}.png`,'image/png');
        add('image',`assets/reklama/reklama${i}.png`,'image/png');
      }

      // Враги
      for(let i=1;i<=7;i++){
        add('image',`assets/enemy/walk/walk${i}.png`,'image/png');
        add('image',`assets/enemy/atack_enemy/atackenemy${i}.png`,'image/png');
        add('image',`assets/enemy/die_enemy/dead${i}.png`,'image/png');
      }

      // Башни
      for(let t=1;t<=12;t++){
        for(let j=1;j<=4;j++) add('image',`assets/attacktower/statik/tower${t}/stower${j}.png`,'image/png');
        for(let j=1;j<=5;j++) add('image',`assets/attacktower/attack/tower${t}/aatcktower${j}.png`,'image/png');
      }

      // Герои (idle4/walk4/atk6/dead5)
      for(let h=1;h<=3;h++){
        for(let j=1;j<=4;j++) add('image',`assets/hero/h${h}_idle${j}.png`,'image/png');
        for(let j=1;j<=4;j++) add('image',`assets/hero/h${h}_walk${j}.png`,'image/png');
        for(let j=1;j<=6;j++) add('image',`assets/hero/h${h}_atk${j}.png`,'image/png');
        for(let j=1;j<=5;j++) add('image',`assets/hero/h${h}_dead${j}.png`,'image/png');
      }

      // Звук
      ['lobby','battle','arrow','gameover','towerup','towerrush','money','killenemy','boss','uplevel','herodead1','herodead2','herodead3','uronbase']
        .forEach(n=> add('audio',`assets/sound/${n}.mp3`,'audio/mpeg'));
      add('audio','assets/sound/klick.ogg','audio/ogg');
    })();
  </script>

  <style>
    :root{ --w:720px; --h:1280px; }
    html,body{ height:100%; margin:0; background:#000; overflow:hidden; -webkit-tap-highlight-color:transparent; }
    #viewport{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; touch-action:none; }
    #stage{ position:relative; width:var(--w); height:var(--h); overflow:hidden; user-select:none;
            image-rendering:crisp-edges; image-rendering:-webkit-optimize-contrast; }
    #game{ position:absolute; inset:0; }

    .overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:60; pointer-events:auto; }
    .hidden{ display:none; }
    .panel{ position:relative; z-index:2; display:flex; flex-direction:column; gap:18px; align-items:center; justify-content:center; padding-top:36vh; }
    .title{ color:#fff; margin:0; font:700 20px/1.2 Arial,Helvetica,sans-serif; text-shadow:0 0 12px rgba(0,0,0,.6); z-index:2; }
    .bg-video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; pointer-events:none; filter:brightness(.9) contrast(1.05); }
    .imgbtn{ width:44%; max-width:360px; height:auto; cursor:pointer; filter:drop-shadow(0 0 16px rgba(0,0,0,.7)); transition:transform .08s; user-select:none; -webkit-user-drag:none; }
    .imgbtn:active{ transform:scale(.98); }

    #preloaderOverlay{ background:#000; }
    #bar{ width:60%; max-width:520px; height:18px; background:#1a1a1a; border-radius:9px; overflow:hidden; box-shadow: inset 0 0 12px rgba(0,0,0,.6); }
    #bar > div{ height:100%; width:0%; background:#1e90ff; transition:width .12s linear; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <!-- Прелоадер -->
      <div id="preloaderOverlay" class="overlay">
        <div class="panel">
          <h2 class="title">Загрузка…</h2>
          <div id="bar"><div id="barFill"></div></div>
          <div id="pct" class="title">0%</div>
        </div>
      </div>

      <!-- Меню -->
      <div id="menuOverlay" class="overlay hidden">
        <video id="menuVideo" class="bg-video" src="assets/menu.webm" autoplay loop muted playsinline></video>
        <div class="panel"><img id="startImg" class="imgbtn" src="assets/elements/play.png" alt="Start"></div>
      </div>

      <!-- Game Over -->
      <div id="gameoverOverlay" class="overlay hidden">
        <video id="goVideo" class="bg-video" src="assets/gameover.webm" autoplay loop muted playsinline></video>
        <div class="panel"><img id="restartImg" class="imgbtn" src="assets/elements/playagain.png" alt="Play Again"></div>
      </div>

      <!-- Канвас Phaser -->
      <div id="game"></div>
    </div>
  </div>
  <script>
/* ========================= КОНСТАНТЫ / СОСТОЯНИЕ ========================= */
const CONST = {
  WIDTH: 720, HEIGHT: 1280,
  BUILD_SPOTS: [
    [484,95],[359,145],[435,235],[373,288],[218,310],[113,394],[316,417],[444,432],
    [589,550],[484,527],[351,539],[286,631],[162,630],[127,728],[416,706],[285,760],
    [430,822],[301,867],[285,1000],[355,1015],[511,992],[581,946],[667,1016],
    [532,1083],[458,1127],[329,1149],[174,1116]
  ],
  PATHS: [
    [[377,50],[429,138],[410,189],[346,224],[311,257],[290,305],[331,354],[400,463],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
    [[81,335],[189,359],[331,354],[400,463],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
    [[636,490],[544,498],[413,491],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
    [[52,667],[168,691],[289,700],[347,736],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
    [[646,963],[565,1029],[441,1069],[312,1082],[226,1059]]
  ],
  START_GOLD: 600,
  KILL_REWARD: 100,
  HERO_REWARD: 10,
  WAVE_BONUS: 80,
  TOWER_COST: 100,
  UPGRADE_COST_BASE: 120,
  ENEMY_AGGRO: 150,
  TOWER_RANGE: 200,
  PREWARM_ENEMIES: 40,
  PREWARM_BULLETS: 60,
  BASE_POS: { x:160, y:993 },
  HERO_SPAWN: { x:226, y:1059 },
  HERO_COSTS: [100,200,300],
  HERO_UPGRADE_COST: 1000
};
const Z = {
  MAP: 0,
  ENEMY: 10,      // враги — ниже башен
  TOWER: 15,      // башни перекрывают врагов
  BASE: 20,
  BULLET: 30,
  ENEMY_HP: 40,
  HERO: 50,
  HERO_HP: 60,
  UI: 95,
  TEXT: 100
};
const $ = (id)=>document.getElementById(id);
const stageBox = $('stage');
const preloaderOverlay = $('preloaderOverlay');
const menuOverlay = $('menuOverlay');
const gameoverOverlay = $('gameoverOverlay');
const startImg = $('startImg');
const restartImg = $('restartImg');
const menuVideo = $('menuVideo');
const goVideo = $('goVideo');
const barFill = $('barFill');
const pct = $('pct');

const State = {
  started:false, paused:false, soundEnabled:true,
  gold: CONST.START_GOLD, heroCoins: 0, wave: 0,
  baseHp: 100, lastBaseHp: 100,   // <— добавили трекинг
  heroes: []
};

/* ========================= УТИЛИТЫ DOM ========================= */
const showPreloader = ()=> preloaderOverlay.classList.remove('hidden');
const hidePreloader = ()=> preloaderOverlay.classList.add('hidden');
const showMenuOverlay = ()=>{ menuOverlay.classList.remove('hidden'); menuOverlay.style.display='flex'; gameoverOverlay.classList.add('hidden'); try{ menuVideo.currentTime=0; menuVideo.play().catch(()=>{});}catch(_){} };
const hideMenuOverlay = ()=>{ menuOverlay.classList.add('hidden'); menuOverlay.style.display='none'; try{ menuVideo.pause(); }catch(_){} };
const showGameoverOverlay = ()=>{ gameoverOverlay.classList.remove('hidden'); menuOverlay.classList.add('hidden'); try{ goVideo.currentTime=0; goVideo.play().catch(()=>{});}catch(_){} };
const hideGameoverOverlay = ()=>{ gameoverOverlay.classList.add('hidden'); try{ goVideo.pause(); }catch(_){} };

/* ========================= СЦЕНА ИГРЫ ========================= */
class AppScene extends Phaser.Scene{
  constructor(){ super('AppScene'); }

  preload(){
    showPreloader();
    this.load.on('progress', v=>{ const p=(v*100)|0; barFill.style.width=p+'%'; pct.textContent=p+'%'; });

    // Карта
    this.load.image('map','assets/map.png');

    // Элементы
    this.load.image('molot','assets/elements/moloticon.png');
    this.load.image('up_icon','assets/elements/up.png');
    this.load.image('noup_icon','assets/elements/noup.png');
    this.load.image('arrow','assets/elements/arrow.png');
    this.load.image('menu','assets/elements/menu.png');
    this.load.image('reload','assets/elements/reload.png');
    this.load.image('sound_on','assets/elements/sound.png');
    this.load.image('sound_off','assets/elements/soundoff.png');
    this.load.image('fast','assets/elements/fast.png');
    this.load.image('slow','assets/elements/slow.png');
    this.load.image('pause','assets/elements/pause.png');
    this.load.image('resume','assets/elements/play2.png');
    this.load.image('gold_panel','assets/elements/gold.png');
    this.load.image('bluecoin','assets/elements/bluecoin.png');

    // Кнопки меню
    this.load.image('btn_play','assets/elements/play.png');
    this.load.image('btn_again','assets/elements/playagain.png');

    // Монеты / реклама
    for(let i=1;i<=6;i++){
      this.load.image(`coin_${i}`,`assets/money/money${i}.png`);
      this.load.image(`ad_${i}`,`assets/reklama/reklama${i}.png`);
    }

    // База (спрайт и HP-индикатор)
[0,20,40,60,80,100].forEach(p=>{
  this.load.image(`basehpbar_${p}`,`assets/base/base${p}.png`); // HP-индикатор над базой
});
[20,40,60,80,100].forEach(p=>{
  this.load.image(`basehp_${p}`,`assets/base/basehp${p}.png`); // основной спрайт базы
});


    // Враги
    for(let i=0;i<7;i++){
      this.load.image(`e_walk_${i}`,`assets/enemy/walk/walk${i+1}.png`);
      this.load.image(`e_atk_${i}`,`assets/enemy/atack_enemy/atackenemy${i+1}.png`);
      this.load.image(`e_die_${i}`,`assets/enemy/die_enemy/dead${i+1}.png`);
    }

    // Башни
    for(let i=1;i<=12;i++){
      for(let j=1;j<=4;j++) this.load.image(`tower${i}_idle_${j}`,`assets/attacktower/statik/tower${i}/stower${j}.png`);
      for(let j=1;j<=5;j++) this.load.image(`tower${i}_atk_${j-1}`,`assets/attacktower/attack/tower${i}/aatcktower${j}.png`);
    }

    // Герои (idle4/walk4/atk6/dead5)
    for(let h=1;h<=3;h++){
      for(let j=1;j<=4;j++) this.load.image(`h${h}_idle_${j}`,`assets/hero/h${h}_idle${j}.png`);
      for(let j=1;j<=4;j++) this.load.image(`h${h}_walk_${j}`,`assets/hero/h${h}_walk${j}.png`);
      for(let j=1;j<=6;j++) this.load.image(`h${h}_atk_${j}`, `assets/hero/h${h}_atk${j}.png`);
      for(let j=1;j<=5;j++) this.load.image(`h${h}_dead_${j}`,`assets/hero/h${h}_dead${j}.png`);
    }

    // Иконки покупки героев
    this.load.image('btn_hero1','assets/elements/hero1.png');
    this.load.image('btn_hero2','assets/elements/hero2.png');
    this.load.image('btn_hero3','assets/elements/hero3.png');

    // Звук
    this.load.audio('lobby','assets/sound/lobby.mp3');
    this.load.audio('battle','assets/sound/battle.mp3');
    this.load.audio('arrow_s','assets/sound/arrow.mp3');
    this.load.audio('klick','assets/sound/klick.ogg');
    this.load.audio('gameover_s','assets/sound/gameover.mp3');
    this.load.audio('towerup','assets/sound/towerup.mp3');
    this.load.audio('towerrush','assets/sound/towerrush.mp3');
    this.load.audio('money','assets/sound/money.mp3');
    this.load.audio('kill','assets/sound/killenemy.mp3');
    this.load.audio('boss','assets/sound/boss.mp3');
    this.load.audio('uplevel','assets/sound/uplevel.mp3');
    this.load.audio('herodead1','assets/sound/herodead1.mp3');
    this.load.audio('herodead2','assets/sound/herodead2.mp3');
    this.load.audio('herodead3','assets/sound/herodead3.mp3');
    this.load.audio('uronbase','assets/sound/uronbase.mp3');
  }

  create(){
    /* Карта */
    this.add.image(CONST.WIDTH/2, CONST.HEIGHT/2, 'map').setDisplaySize(CONST.WIDTH, CONST.HEIGHT).setDepth(Z.MAP);

    /* Группы/пулы */
    this.enemies = this.add.group(); this.bullets = this.add.group();
    this.towers = []; this.buildSprites = new Array(CONST.BUILD_SPOTS.length).fill(null);
    this.enemyPool = []; this.bulletPool = [];

    for(let i=0;i<CONST.PREWARM_ENEMIES;i++){
      const e = this.add.sprite(-9999, -9999, 'e_walk_0')
  .setScale(0.35)
  .setVisible(false)
  .setActive(false)
  .setDepth(Z.ENEMY);
      e.hpBar = this.add.graphics().setDepth(Z.ENEMY_HP).setVisible(false); e.hpBar.__owner = e;
      this.enemies.add(e); this.enemyPool.push(e);
    }
    for(let i=0;i<CONST.PREWARM_BULLETS;i++){
      const b = this.add.image(-9999,-9999,'arrow').setVisible(false).setActive(false).setDepth(Z.BULLET);
      this.bullets.add(b); this.bulletPool.push(b);
    }

    /* Скорость/звук */
    this.speedScale = 1; this.time.timeScale = 1;
    this.sndLobby   = this.sound.add('lobby',{loop:true, volume:.6});
    this.sndBattle  = this.sound.add('battle',{loop:true, volume:.6});
    this.sndArrowLp = this.sound.add('arrow_s',{loop:true, volume:.35});
    this.sndOver    = this.sound.add('gameover_s',{volume:.9});
    this.sndUp      = this.sound.add('towerup',{volume:.9});
    this.sndRush    = this.sound.add('towerrush',{volume:.9});
    this.sndMoney   = this.sound.add('money',{volume:.9});
    this.sndKill    = this.sound.add('kill',{volume:.8});
    this.sndBoss    = this.sound.add('boss',{volume:.675}); // 75% от прежнего
    this.sndUplevel = this.sound.add('uplevel',{volume:.9});
    this.sndBaseHit = this.sound.add('uronbase',{volume:.9});

    try{ const saved = localStorage.getItem('td_mute'); if(saved!==null) State.soundEnabled = (saved!=='1'); }catch(_){}
    this.sound.mute = !State.soundEnabled;

    this.stopAllLoops = ()=>{ try{ this.sndArrowLp.stop(); }catch(_){} try{ this.sndBattle.stop(); }catch(_){} try{ this.sndLobby.stop(); }catch(_){} };
    this.playLobby = ()=>{ if(State.paused) return; this.stopAllLoops(); try{ !this.sndLobby.isPlaying && this.sndLobby.play(); }catch(_){} };
    this.playBattle = ()=>{ if(State.paused) return; this.stopAllLoops(); try{ !this.sndBattle.isPlaying && this.sndBattle.play(); }catch(_){} };
    this.playGameOver = ()=>{ this.stopAllLoops(); try{ this.sndOver.play(); }catch(_){} };

    /* Прелоадер → меню */
    hidePreloader(); this.playLobby(); showMenuOverlay();

    /* Споты строительства */
    CONST.BUILD_SPOTS.forEach((p,i)=> this._createHammer(p,i));

    /* Анимации */
    this._createAnims();

    /* HUD / боковые кнопки */
    this._buildHUD();
    this._buildSideButtons();

    /* База (кликабельная) + полоска HP */
    this._createBase();

    /* Панель героев (открывается по клику на базу) */
    this._createHeroPanel();

    /* Цикл стрельбы башен */
    this.shootTicker = this.time.addEvent({ delay:120, loop:true, callback:()=> this._towersTick() });
  }

  update(){
    if(!State.started || State.paused){ this._syncHUD(); return; }
    for(const e of this.enemies.getChildren()) if(e.active&&e.visible) this._updateEnemy(e);
    for(const b of this.bullets.getChildren()) if(b.active&&b.visible) this._updateBullet(b);
    for(const h of State.heroes) if(h?.spr?.active && h.spr.visible) this._updateHero(h);
    this._syncHUD();
    // сортировка по глубине — башни перекрывают врагов
this.children.list.sort((a, b) => a.depth - b.depth);

  }

  /* ============ ХЕЛПЕРЫ ============ */
  playIfExists(sprite, key, repeat=true){ if(!sprite || !key) return; const exists = this.anims.exists(key); if(!exists) return; const cur = sprite.anims && sprite.anims.currentAnim && sprite.anims.currentAnim.key; if(cur === key) return; sprite.play(key, repeat); }
  _moveTowards(obj, tx, ty, speed){ const dx=tx-obj.x, dy=ty-obj.y, d=Math.hypot(dx,dy); if(d<0.1) return; const k = (speed||0.2)*2; obj.x += dx/d*k; obj.y += dy/d*k; }
  _floatText(x,y,text,color='#ffec8b'){ const t = this.add.text(x,y,text,{font:'20px Arial',fill:color,stroke:'#000',strokeThickness:3}).setDepth(Z.TEXT).setOrigin(.5,1); this.tweens.add({targets:t,y:y-30,alpha:0,duration:650,ease:'Cubic.easeOut',onComplete:()=> t.destroy()}); }

  /* ============ HUD / UI ============ */
  _buildHUD(){
    const yBottom = CONST.HEIGHT - 463;
    this.goldPanel = this.add.image(80, yBottom, 'gold_panel').setOrigin(0,1).setScale(1/3).setDepth(Z.UI);
    this.coin = this.add.sprite(this.goldPanel.x+58, this.goldPanel.y-36, 'coin_1').setDepth(Z.UI+1).setScale(.65);
    if(!this.anims.exists('coin_anim')) this.anims.create({key:'coin_anim',frames:[1,2,3,4,5,6].map(i=>({key:`coin_${i}`})),frameRate:10,repeat:-1});
    this.playIfExists(this.coin,'coin_anim');

    this.goldText = this.add.text(this.goldPanel.x+95, this.goldPanel.y-36, String(State.gold), {font:'26px Arial',fill:'#fff',stroke:'#000',strokeThickness:4}).setOrigin(0,.5).setDepth(Z.UI+2);

    this.blueCoinIcon = this.add.image(CONST.WIDTH/2-40, 46, 'bluecoin').setDepth(Z.UI).setScale(.9);
    this.blueCoinText = this.add.text(CONST.WIDTH/2+0, 46, String(State.heroCoins), {font:'26px Arial',fill:'#9fd6ff',stroke:'#002',strokeThickness:4}).setOrigin(0,.5).setDepth(Z.UI+2);

    this.adBtn = this.add.sprite(CONST.WIDTH-76, CONST.HEIGHT-96, 'ad_1').setDepth(Z.UI+1).setInteractive({useHandCursor:true});
    if(!this.anims.exists('ad_anim')) this.anims.create({key:'ad_anim',frames:[1,2,3,4,5,6].map(i=>({key:`ad_${i}`})),frameRate:8,repeat:-1});
    this.playIfExists(this.adBtn,'ad_anim');
    this.adBtn.on('pointerdown', ()=>{ if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){} State.gold += 1000; this._syncHUD(); });
  }

  _syncHUD(){
  if(this.goldText) this.goldText.setText(String(State.gold|0));
  if(this.blueCoinText) this.blueCoinText.setText(String(State.heroCoins|0));

  if(State.baseHp !== State.lastBaseHp){        // только при реальном изменении
    this._applyBaseTexture();
    State.lastBaseHp = State.baseHp;
  }
  this._refreshHeroPanel();
}

  _buildSideButtons(){
    const x=576, y0=629, gap=80;
    const btnMenu = this.add.image(x, y0+0*gap, 'menu').setInteractive().setDepth(Z.UI);
    const btnReload = this.add.image(x, y0+1*gap, 'reload').setInteractive().setDepth(Z.UI);
    const btnSound = this.add.image(x, y0+2*gap, State.soundEnabled?'sound_on':'sound_off').setInteractive().setDepth(Z.UI);
    this.btnTurbo = this.add.image(x, y0+3*gap, 'slow').setInteractive().setDepth(Z.UI);
    this.btnPause = this.add.image(x, y0+4*gap, 'pause').setInteractive().setDepth(Z.UI);
    this.btnResume = this.add.image(x, y0+4*gap, 'resume').setInteractive().setDepth(Z.UI).setVisible(false);

    const applyMuteIcon = ()=> btnSound.setTexture(State.soundEnabled ? 'sound_on':'sound_off');
    const applyTurboIcon = ()=> this.btnTurbo.setTexture(this.speedScale>1 ? 'fast':'slow');

    btnMenu.on('pointerdown', ()=>{ if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){ } this.returnToMenu(); });
    btnReload.on('pointerdown', ()=>{ if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){ } this.beginNewGame(); });
    btnSound.on('pointerdown', ()=>{ State.soundEnabled = !State.soundEnabled; this.sound.mute = !State.soundEnabled; try{ localStorage.setItem('td_mute', State.soundEnabled?'0':'1'); }catch(_){ } applyMuteIcon(); if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){ } });
    this.btnTurbo.on('pointerdown', ()=>{ if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){ } this._toggleTurbo(); applyTurboIcon(); });
    this.btnPause.on('pointerdown', ()=>{ if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){ } this._setPaused(true); });
    this.btnResume.on('pointerdown', ()=>{ if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){ } this._setPaused(false); });

    applyTurboIcon();
  }

  _toggleTurbo(){ this.speedScale = this.speedScale>1 ? 1 : 2; if(!State.paused){ this.time.timeScale = this.speedScale; this.tweens.timeScale = this.speedScale; } }
  _setPaused(flag){ State.paused = !!flag; this.btnPause && this.btnPause.setVisible(!State.paused); this.btnResume && this.btnResume.setVisible(State.paused); if(State.paused){ this.time.timeScale=0; this.tweens.pauseAll(); } else { this.time.timeScale=this.speedScale; this.tweens.resumeAll(); } }

  /* ============ БАЗА ============ */
  _createBase(){
  this.base = this.add.image(CONST.BASE_POS.x, CONST.BASE_POS.y, 'basehp_100')
    .setDepth(Z.BASE)
    .setInteractive({useHandCursor:true});

  // добавляем иконку HP (спрайт сверху)
  this.baseHpIcon = this.add.image(CONST.BASE_POS.x, CONST.BASE_POS.y-110, 'basehpbar_100').setDepth(Z.UI+5);

  this.base.on('pointerdown', ()=>{
    if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
    if(!State.started || State.paused) return;
    this._toggleHeroPanel();
  });

  this._applyBaseTexture(true);
}

  _applyBaseTexture(forceSound=false){
  const hp = Math.max(0, Math.min(100, State.baseHp));

  // база: 0% и 20% -> basehp20; далее 40/60/80/100
  let stepBase = 100;
  if(hp <= 20) stepBase = 20;
  else if(hp <= 40) stepBase = 40;
  else if(hp <= 60) stepBase = 60;
  else if(hp <= 80) stepBase = 80;
  else stepBase = 100;

  // иконка: 0/20/40/60/100
  let stepIcon = 0;
  if(hp <= 0) stepIcon = 0;
  else if(hp <= 20) stepIcon = 20;
  else if(hp <= 40) stepIcon = 40;
  else if(hp <= 60) stepIcon = 60;
  else stepIcon = 100;

  const baseKey  = `basehp_${stepBase}`;
  const iconKey  = `basehpbar_${stepIcon}`;

  if(this.base && this.textures.exists(baseKey)) this.base.setTexture(baseKey);

  if(!this.baseHpIcon){
    this.baseHpIcon = this.add.image(CONST.BASE_POS.x, CONST.BASE_POS.y-110, iconKey).setDepth(Z.UI+5);
  }else if(this.textures.exists(iconKey)){
    this.baseHpIcon.setTexture(iconKey);
  }

  if(forceSound && this.sndBaseHit && !this.sound.mute){
    try{ this.sndBaseHit.play(); }catch(_){}
  }
}

  /* ============ ГЕРОИ: ПАНЕЛЬ/ПОКУПКА/УЛУЧШЕНИЕ ============ */
  _createHeroPanel(){
    const bx = CONST.BASE_POS.x, by = CONST.BASE_POS.y, gapX=66;
    this.heroPanel = { open:false, btns:[], ups:[], priceTexts:[] };
    for(let t=1;t<=3;t++){
      const ix = bx + (t-2)*gapX, iy = by - 130;
      const btn = this.add.image(ix,iy,`btn_hero${t}`).setDepth(Z.UI+3).setScale(1).setVisible(false).setInteractive({useHandCursor:true});
      btn.type = t; btn.on('pointerdown', ()=> this._buyHero(t)); this.heroPanel.btns.push(btn);

      const up = this.add.image(ix-28, iy+40, 'noup_icon').setDepth(Z.UI+4).setScale(.84).setVisible(false)
        .setInteractive({useHandCursor:true});
      up.type = t; up.on('pointerdown', ()=> this._upgradeHeroesOfType(t)); this.heroPanel.ups.push(up);

      const price = CONST.HERO_COSTS[t-1]||0;
      const txt = this.add.text(ix, iy+68, String(price), {font:'20px Arial',fill:'#9fd6ff',stroke:'#001a33',strokeThickness:3})
        .setDepth(Z.UI+5).setOrigin(.5,0).setVisible(false);
      this.heroPanel.priceTexts.push(txt);
    }
  }

  _toggleHeroPanel(){ this.heroPanel.open = !this.heroPanel.open;
    for(const b of this.heroPanel.btns) b.setVisible(this.heroPanel.open);
    for(const u of this.heroPanel.ups) u.setVisible(this.heroPanel.open);
    for(const t of this.heroPanel.priceTexts) t.setVisible(this.heroPanel.open);
    this._refreshHeroPanel(); }

  _refreshHeroPanel(){ if(!this.heroPanel?.btns?.length) return; const canUp = State.heroCoins >= CONST.HERO_UPGRADE_COST;
    for(const u of this.heroPanel.ups){ if(u.visible) u.setTexture(canUp?'up_icon':'noup_icon'); }
    for(const b of this.heroPanel.btns){ const cost = CONST.HERO_COSTS[b.type-1]||0; b.setTint(State.heroCoins>=cost ? 0xffffff : 0x777777); } }

   // === Покупка героя (жёсткое ограничение: 1 герой на тип) ===
_buyHero(type){
  const cost = CONST.HERO_COSTS[type-1] || 0;

  if (State.heroCoins < cost) {
    this._floatText(CONST.BASE_POS.x, CONST.BASE_POS.y - 140, `Нужно ${cost}`, '#9fd6ff');
    if (State.soundEnabled) try { this.sound.play('klick'); } catch(_) {}
    return;
  }

  // Не даём купить, если активный герой этого типа уже есть
  const already = State.heroes.some(h => h && h.type === type && h.spr && h.spr.active && !h._dying);
  if (already) {
    this._floatText(CONST.BASE_POS.x, CONST.BASE_POS.y - 140, 'Уже нанят', '#9fd6ff');
    return;
  }

  State.heroCoins -= cost;
  this._spawnHero(type);
  this._syncHUD();
}
// === Улучшение героя ===
_upgradeHeroesOfType(type){
  // Проверяем, хватает ли валюты
  if (State.heroCoins < CONST.HERO_UPGRADE_COST) {
    this._floatText(
      CONST.BASE_POS.x,
      CONST.BASE_POS.y - 140,
      `Нужно ${CONST.HERO_UPGRADE_COST}`,
      '#9fd6ff'
    );
    if (State.soundEnabled) {
      try { this.sound.play('klick'); } catch(_) {}
    }
    return;
  }

  // Списываем стоимость
  State.heroCoins -= CONST.HERO_UPGRADE_COST;

  // Применяем улучшение ко всем активным героям нужного типа
  let upgraded = 0;
  for (const h of State.heroes) {
    if (!h || !h.spr?.active || h.type !== type) continue;

    upgraded++;
    h.level = (h.level || 1) + 1;
    h.hpMax = Math.round(h.hpMax * 1.25);
    h.hp = Math.min(h.hpMax, Math.round(h.hp + h.hpMax * 0.25));
    h.dmg = Math.round(h.dmg * 1.2);
    h.cooldown = Math.max(400, Math.round(h.cooldown * 0.9));

    this._floatText(h.spr.x, h.spr.y - 70, 'UP!', '#9fd6ff');
  }

  // Если были улучшены герои — проигрываем звук
  if (upgraded > 0) {
    try { this.sndUplevel.play(); } catch(_) {}
  } else {
    // Если героев такого типа нет — вернём валюту
    State.heroCoins += CONST.HERO_UPGRADE_COST;
    this._floatText(
      CONST.BASE_POS.x,
      CONST.BASE_POS.y - 140,
      'Нет героев этого типа',
      '#9fd6ff'
    );
  }

  // Обновляем HUD
  this._syncHUD();
}
  _drawHeroHp(h){
    if(!h||!h.hpBar||!h.spr?.visible) return;
    const w=36, hh=6, x=h.spr.x-w/2, y=h.spr.y-40, p=Math.max(0,Math.min(1,h.hp/h.hpMax));
    h.hpBar.clear();
    h.hpBar.fillStyle(0x000000,.5).fillRect(x-1,y-1,w+2,hh+2);
    h.hpBar.fillStyle(0x003366,.6).fillRect(x,y,w,hh);
    h.hpBar.fillStyle(0x66ccff,.95).fillRect(x,y,w*p,hh);
  }

_updateHero(h){
  if(!h?.spr?.active) return;

  // смерть героя
  if(h.hp <= 0 && !h._dying){
    this._killHero(h);
    return;
  }

  this._drawHeroHp(h);

  // цель обновляем, если умерла
  if(!h.target || !h.target.active || h.target.state==='die'){
    h.target = this._findNearestEnemy(h.spr.x, h.spr.y, 240);
  }

  // если есть цель — атака
  if(h.target){
    const e = h.target;
    const d = Phaser.Math.Distance.Between(h.spr.x,h.spr.y,e.x,e.y);

    if(d > h.range){
      this._moveTowards(h.spr, e.x, e.y, h.speed);
      this.playIfExists(h.spr, h.walkKey, true);
      h.spr.setFlipX(e.x < h.spr.x);
    } else {
      const now = Date.now();
      if(now - (h._lastHit||0) >= h.cooldown){
        h._lastHit = now;
        this.playIfExists(h.spr, h.atkKey, false);
        e.hp -= h.dmg;
        this._floatText(e.x, e.y-22, '-'+h.dmg, '#9fd6ff');
        if(e.hp <= 0) this._killEnemy(e);
        this.time.delayedCall(400, ()=>{ if(h?.spr?.active) this.playIfExists(h.spr, h.walkKey, true); });
      }
    }
    return;
  }

  // нет цели — движение по маршруту
  if(!h.path || !h.path.length) return;
  const wp = h.path[h.pIndex] || h.path[h.path.length-1];
  this._moveTowards(h.spr, wp[0], wp[1], h.speed);
  this.playIfExists(h.spr, h.walkKey, true);
  h.spr.setFlipX(wp[0] < h.spr.x);
  if(Phaser.Math.Distance.Between(h.spr.x,h.spr.y,wp[0],wp[1]) < 10 && h.pIndex < h.path.length-1){
    h.pIndex++;
  }
}


_killHero(h){
  // Проверка: герой существует, жив, не в процессе умирания
  if(!h || !h.spr?.active || h._dying) return;
  h._dying = true;

  // Проигрываем случайный звук смерти (один раз)
  try {
    if(State.soundEnabled){
      const pick = ['herodead1','herodead2','herodead3'][Math.floor(Math.random()*3)];
      this.sound.play(pick);
    }
  } catch(_){}

  // Когда анимация закончится — удалить героя
  const end = ()=> this._deactivateHero(h);

  // Если есть анимация смерти — проиграть её
  if(this.anims.exists(h.deadKey)){
    h.spr.once(Phaser.Animations.Events.ANIMATION_COMPLETE, end);
    h.spr.play(h.deadKey);
  } else {
    // Если нет анимации — просто удалить через 600 мс
    this.time.delayedCall(600, end);
  }
}

_deactivateHero(h){
  try { h.hpBar?.destroy(); } catch(_){}
  try { h.spr?.destroy(); } catch(_){}

  // Полностью удалить героя из массива State.heroes
  State.heroes = State.heroes.filter(x => x && x !== h);
}

_findNearestEnemy(x, y, radius = 220){
  let nearest = null, dmin = radius;
  for(const e of this.enemies.getChildren()){
    if(!e.active || !e.visible || e.state === 'die') continue;
    const d = Phaser.Math.Distance.Between(x, y, e.x, e.y);
    if(d < dmin){ dmin = d; nearest = e; }
  }
  return nearest;
}

  /* ============ СПОТЫ/БАШНИ ============ */
  _createHammer(pos,index){
    const img = this.add.image(pos[0],pos[1],'molot').setInteractive({useHandCursor:true}).setScale(.6).setDepth(10);
    img.on('pointerdown', ()=> this._buildTower(index));
    this.buildSprites[index]=img;
  }

  _buildTower(index){
    if(State.gold < CONST.TOWER_COST){
      this._floatText(CONST.WIDTH/2, CONST.HEIGHT/2-80, 'Недостаточно золота');
      if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
      return;
    }
    const pos=CONST.BUILD_SPOTS[index];
    if(this.buildSprites[index]){ try{ this.buildSprites[index].destroy(); }catch(_){} this.buildSprites[index]=null; }
    State.gold -= CONST.TOWER_COST; this._syncHUD(); try{ this.sndMoney && this.sndMoney.play(); }catch(_){}
    const ts = this.add.sprite(pos[0],pos[1],'tower1_idle_1').setInteractive().setDepth(Z.TOWER);
    ts.level=1; ts._typeKey='tower1'; ts._range=CONST.TOWER_RANGE; ts._shootRate=900; ts._bulletSpeed=9; ts._damage=5; ts.hp=50;
    ts._upgradeCost = CONST.UPGRADE_COST_BASE*(ts.level+1);
    ts.upIcon = this.add.image(pos[0]-28,pos[1]+40,'noup_icon').setScale(.6).setDepth(Z.TOWER+1).setVisible(true);
    ts.on('pointerdown', ()=> this._upgradeTower(ts));
    this.playIfExists(ts, `${ts._typeKey}_idle_anim`, true);
    ts.setFlipX(ts.x > CONST.WIDTH/2);
    ts.on('destroy', ()=>{ this.buildSprites[index]=null; this._createHammer(pos,index); try{ ts.upIcon?.destroy(); }catch(_){} });
    this.towers.push({sprite:ts});
  }

  _upgradeTower(ts){
    if(ts.level>=12) return;
    const cost = Math.floor(ts._upgradeCost || (CONST.UPGRADE_COST_BASE*(ts.level+1)));
    if(State.gold < cost){ this._floatText(ts.x, ts.y-70, 'Недостаточно золота'); if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){ } return; }
    State.gold -= cost; this._syncHUD();
    ts.level += 1; ts._typeKey = 'tower' + ts.level; ts._range = Math.min(300, ts._range + 30); ts._shootRate = Math.max(300, ts._shootRate - 120);
    ts._damage = 5 * ts.level; ts.hp += 50; ts._upgradeCost = CONST.UPGRADE_COST_BASE * (ts.level + 1);
    this.playIfExists(ts, `${ts._typeKey}_idle_anim`, true);
    if(ts.level>=12 && ts.upIcon) ts.upIcon.setVisible(false);
    try{ this.sndUp.play(); }catch(_){}
  }

  _towersTick(){
    if(!State.started || State.paused) return;
    let anyShot=false; const now=Date.now();
    for(const tObj of this.towers){
      const ts=tObj.sprite; if(!ts||!ts.active) continue;

      if(ts.upIcon){
        const nextCost = Math.floor(ts._upgradeCost || (CONST.UPGRADE_COST_BASE*(ts.level+1)));
        ts.upIcon.setTexture(State.gold>=nextCost ? 'up_icon':'noup_icon');
        ts.upIcon.setVisible(!(ts.level>=12));
        ts.upIcon.x = ts.x-28; ts.upIcon.y=ts.y+40;
      }

      ts._lastShotTime = ts._lastShotTime||0;
      if(now - ts._lastShotTime < ts._shootRate){ this.playIfExists(ts, `${ts._typeKey}_idle_anim`, true); continue; }

      let target=null, dmin=1e9;
      for(const e of this.enemies.getChildren()){
        if(!e.active||!e.visible||e.state==='die') continue;
        const d=Phaser.Math.Distance.Between(ts.x,ts.y,e.x,e.y);
        if(d<ts._range && d<dmin){ dmin=d; target=e; }
      }
      ts._lastShotTime = now;
      if(target){
        const b=this._getBullet();
        b.setActive(true).setVisible(true).setTexture('arrow').setScale(.5).setPosition(ts.x, ts.y-Math.round((ts.displayHeight||40)*.4)).setDepth(Z.BULLET);
        b.target=target; b.speed=ts._bulletSpeed||9; b.damage=ts._damage||5*ts.level; b.hitRadius=16;
        this.playIfExists(ts,`${ts._typeKey}_atk_anim`,true);
        ts.setFlipX(ts.x > CONST.WIDTH/2); anyShot=true;
      }else{
        this.playIfExists(ts,`${ts._typeKey}_idle_anim`,true);
      }
    }
    try{
      if(anyShot){ if(!this.sndArrowLp.isPlaying && !this.sound.mute) this.sndArrowLp.play(); }
      else{ if(this.sndArrowLp.isPlaying) this.sndArrowLp.stop(); }
    }catch(_){}
  }

  _getBullet(){ for(const b of this.bulletPool) if(!b.active && !b.visible) return b; const nb = this.add.image(-9999,-9999,'arrow').setVisible(false).setActive(false).setDepth(Z.BULLET); this.bullets.add(nb); this.bulletPool.push(nb); return nb; }

  _updateBullet(b){
    if(!b || !b.active || !b.visible) return;
    if(!b.target || !b.target.active || b.target.state==='die'){ b.setActive(false).setVisible(false).setPosition(-9999,-9999); b.target=null; return; }
    const dx=b.target.x-b.x, dy=b.target.y-b.y, dist=Math.hypot(dx,dy), sp=b.speed||8, hitR=b.hitRadius||16;
    if(dist<=hitR){
      const dmg=b.damage||5; b.target.hp -= dmg; this._floatText(b.target.x,b.target.y-28,'-'+dmg);
      if(b.target.hp<=0) this._killEnemy(b.target);
      b.setActive(false).setVisible(false).setPosition(-9999,-9999); b.target=null; return;
    }
    const nx=dx/dist, ny=dy/dist; b.x += nx*sp; b.y += ny*sp; b.rotation = Phaser.Math.Angle.Between(b.x,b.y,b.target.x,b.target.y);
    if(b.x<-50||b.x>CONST.WIDTH+50||b.y<-50||b.y>CONST.HEIGHT+50){ b.setActive(false).setVisible(false).setPosition(-9999,-9999); b.target=null; }
  }

  /* ============ ВРАГИ/ВОЛНЫ ============ */
  _getEnemy(){
    for(const e of this.enemyPool) if(!e.active && !e.visible) return e;
    const e = this.add.sprite(-9999,-9999,'e_walk_0').setScale(0.35).setVisible(false).setActive(false).setDepth(Z.ENEMY);
    e.hpBar = this.add.graphics().setDepth(Z.ENEMY_HP).setVisible(false); e.hpBar.__owner=e;
    this.enemies.add(e); this.enemyPool.push(e); return e;
  }

  _spawnEnemy(path, hp){
    const spawn=path[0], e=this._getEnemy();
    e.isBoss=false; e.maxHp=hp; e.hp=hp; e.speed=.12 + Math.min(.018*State.wave,.32);
    e.path=path; e.pathIndex=1; e.state='walk'; e._savedPathIndex=null; e._lastAttack=0;
    e.setPosition(spawn[0],spawn[1]).setVisible(true).setActive(true).setScale(.35);
    this.playIfExists(e,'e_walk_anim',true);
    e.hpBar.setVisible(true); this._drawEnemyHp(e);
  }

  _spawnBoss(path){
    const spawn=path[0], e=this._getEnemy();
    e.maxHp=(25+State.wave*5)*3; e.hp=e.maxHp; e.speed=.05; e.damage=20;
    e.path=path; e.pathIndex=1; e.state='walk'; e.isBoss=true; e.setScale(.7);
    e.setPosition(spawn[0],spawn[1]).setVisible(true).setActive(true);
    this.playIfExists(e,'e_walk_anim',true);
    e.hpBar.setVisible(true); this._drawEnemyHp(e);
    this._floatText(e.x,e.y-60,'БОСС!','#ff8080');
    try{ this.sndBoss.play(); }catch(_){}
  }

  _drawEnemyHp(e){
    if(!e||!e.hpBar||!e.visible) return;
    const w=40,h=6,x=e.x-w/2,y=e.y-40,p=Math.max(0,Math.min(1,e.hp/e.maxHp));
    e.hpBar.clear(); e.hpBar.fillStyle(0x000000,.5).fillRect(x-1,y-1,w+2,h+2);
    e.hpBar.fillStyle(0x8b0000,.6).fillRect(x,y,w,h);
    e.hpBar.fillStyle(0x32cd32,.9).fillRect(x,y,w*p,h);
  }

  _updateEnemy(e){
    if(!e||!e.active||!e.visible||e.state==='die') return;
    this._drawEnemyHp(e);

    // Цели поблизости
    let targetHero=null, hdmin=1e9;
    for(const h of State.heroes){
      if(!h?.spr?.active) continue;
      const d=Phaser.Math.Distance.Between(e.x,e.y,h.spr.x,h.spr.y);
      if(d<CONST.ENEMY_AGGRO && d<hdmin){ hdmin=d; targetHero=h; }
    }
    let targetTower=null, tdmin=1e9;
    for(const tObj of this.towers){
      const ts=tObj.sprite; if(!ts||!ts.active) continue;
      const d=Phaser.Math.Distance.Between(e.x,e.y,ts.x,ts.y);
      if(d<CONST.ENEMY_AGGRO && d<tdmin){ tdmin=d; targetTower=ts; }
    }

    if (targetHero && (!targetTower || hdmin <= tdmin)) {
  e.targetTower = null;
  e.targetHero = targetHero;
  e._savedPathIndex = e.pathIndex;

  this.playIfExists(e, 'e_atk_anim', true);
  this._moveTowards(e, targetHero.spr.x, targetHero.spr.y, e.speed);
  e.setFlipX(targetHero.spr.x < e.x);

  const d = Phaser.Math.Distance.Between(e.x, e.y, targetHero.spr.x, targetHero.spr.y);
  if (d < 26 && (!e._lastAttack || Date.now() - e._lastAttack > 900)) {
    e._lastAttack = Date.now();
    const dmg = e.isBoss ? 22 : 12;
    targetHero.hp = Math.max(0, targetHero.hp - dmg);
    this._floatText(targetHero.spr.x, targetHero.spr.y - 28, '-' + dmg, '#ffb3b3');
    if (targetHero.hp <= 0) {
      this._killHero(targetHero);
      e.targetHero = null;
    }
  }
  return;
} else if (targetTower) {

      e.targetHero=null; e.targetTower=targetTower; e._savedPathIndex=e.pathIndex;
      this.playIfExists(e,'e_atk_anim',true);
      this._moveTowards(e, targetTower.x, targetTower.y, e.speed);
      e.setFlipX(targetTower.x<e.x);
      const d=Phaser.Math.Distance.Between(e.x,e.y,targetTower.x,targetTower.y);
      if(d<26 && (!e._lastAttack || Date.now()-e._lastAttack>900)){
        e._lastAttack=Date.now();
        if(e.targetTower.hp!=null){
          const dmg=e.isBoss?20:10;
          e.targetTower.hp -= dmg;
          if(e.targetTower.hp<=0){
            try{ this.sndRush.play(); }catch(_){}
            try{ e.targetTower.upIcon && e.targetTower.upIcon.destroy(); }catch(_){}
            try{ e.targetTower.destroy(); }catch(_){}
            this.towers = this.towers.filter(t=>t && t.sprite && t.sprite.active);
            e.targetTower=null; e.state='returning';
            if(e._savedPathIndex!=null) e.pathIndex=e._savedPathIndex;
          }
        }
      }
      return;
    } else {
      e.targetHero=null; e.targetTower=null;
    }

    // Возврат к пути
    if(e.state==='returning'){
      const target = e.path[e.pathIndex] || e.path[e.path.length-1];
      this._moveTowards(e,target[0],target[1],e.speed);
      if(Phaser.Math.Distance.Between(e.x,e.y,target[0],target[1])<8){ e.state='walk'; this.playIfExists(e,'e_walk_anim',true); }
      return;
    }

    // === Дошёл до базы ===
if (e.pathIndex >= e.path.length) {
  // атака базы раз в 900 мс
  if (!e._lastAttack || Date.now() - e._lastAttack > 900) {
    e._lastAttack = Date.now();

    // урон по базе
    State.baseHp = Math.max(0, State.baseHp - 5);
    this._applyBaseTexture(true); // обновляем спрайт и звук урона

    // если база разрушена — завершить игру
    if (State.baseHp <= 0) {
      State.baseHp = 0;
      this._applyBaseTexture(true);
      this.showGameOver();
      return; // выходим, чтобы враг не продолжал атаку
    }
  }

  // проигрываем анимацию атаки
  this.playIfExists(e, 'e_atk_anim', true);
  return;
}


    // Движение по точкам
    const wp = e.path[e.pathIndex];
    if(wp){
      this._moveTowards(e, wp[0], wp[1], e.speed);
      if(Phaser.Math.Distance.Between(e.x,e.y,wp[0],wp[1])<6) e.pathIndex++;
      e.setFlipX(wp[0] < e.x);
      this.playIfExists(e,'e_walk_anim',true);
    }
  }

  _killEnemy(e){
    if(!e || e.state==='die') return;
    e.state='die'; e.anims && e.anims.stop();
    const end = ()=> this._deactivateEnemy(e);
    if(this.anims.exists('e_die_anim')){ e.once(Phaser.Animations.Events.ANIMATION_COMPLETE, end); e.play('e_die_anim'); } else end();
    try{ this.sndKill && this.sndKill.play(); }catch(_){}
    State.gold += e.isBoss ? CONST.KILL_REWARD*5 : CONST.KILL_REWARD;
    State.heroCoins += CONST.HERO_REWARD;
    if(e.isBoss) this._floatText(e.x,e.y-50,'БОСС ПОБЕЖДЁН!','#ffd6d6');
    this._syncHUD();
  }

  _deactivateEnemy(e){
    if(e.hpBar){ e.hpBar.clear().setVisible(false); }
    e.setActive(false).setVisible(false).setPosition(-9999,-9999);
    e.targetTower=null; e.targetHero=null; e.path=null; e.pathIndex=0; e.state='idle'; e.isBoss=false;
    e.setScale(.35); e.clearTint && e.clearTint();
  }

  /* ============ ВОЛНЫ ============ */
  _scheduleNextWave(delay=1500){
    if(this.waveTimer){ try{ this.waveTimer.remove(); }catch(_){} this.waveTimer=null; }
    this.waveTimer = this.time.addEvent({ delay, callback:()=> this._startWave() });
  }

  _startWave(){
    if(!State.started || State.paused) return;
    State.wave++; this._syncHUD();
    const enemyHpBase = 25 + State.wave*5;
    const hpJitter = Phaser.Math.Between(-2,4);
    const enemiesPerSpawn = Math.min(1 + Math.floor((State.wave-1)/4), 4);
    let spawnCount = (State.wave<=2)?1:(State.wave<=6?Phaser.Math.Between(1,2):Phaser.Math.Between(2,3));
    spawnCount = Math.min(spawnCount, CONST.PATHS.length);
    const idxs = Phaser.Utils.Array.Shuffle([...Array(CONST.PATHS.length).keys()]).slice(0,spawnCount);

    idxs.forEach((pi, idx)=>{
      const path = CONST.PATHS[pi];
      for(let j=0;j<enemiesPerSpawn;j++){
        const baseDelay = (State.wave<=3)?Phaser.Math.Between(2400,3000):Phaser.Math.Between(2000,2600);
        const delay = j*baseDelay + idx*1000;
        const hp = Math.max(10, enemyHpBase + hpJitter);
        this.time.addEvent({ delay, callback:()=> this._spawnEnemy(path, hp) });
      }
    });

    const nextDelayBase = (State.wave<=3)?12000:10000;
    const nextDelay = nextDelayBase + enemiesPerSpawn*3200 + Phaser.Math.Between(0,1800);

    if(State.wave % 5 === 0){
      const bossPath = Phaser.Utils.Array.GetRandom(CONST.PATHS);
      this.time.addEvent({ delay:2500, callback:()=> this._spawnBoss(bossPath) });
    }
    this._scheduleNextWave(nextDelay);
  }

  /* ============ ЖИЗНЕННЫЙ ЦИКЛ ИГРЫ ============ */
  beginNewGame(){
    hideMenuOverlay(); hideGameoverOverlay(); this.stopAllLoops(); try{ this.sndLobby.stop(); }catch(_){}
    if(this.waveTimer){ try{ this.waveTimer.remove(); }catch(_){ } this.waveTimer=null; }

    // Сброс состояния
    State.gold = CONST.START_GOLD; State.heroCoins=0; State.wave=0; State.baseHp=100;
    State.paused=false; State.started=true;

    // Очистка героев
    for(const h of State.heroes){ try{ h.hpBar?.destroy(); h.spr?.destroy(); }catch(_){} }
    State.heroes.length=0;

    // Сброс врагов/пуль
    for(const e of this.enemies.getChildren()){
      if(e.hpBar){ e.hpBar.clear().setVisible(false); }
      e.setActive(false).setVisible(false).setPosition(-9999,-9999);
      e.state='idle'; e.targetTower=null; e.targetHero=null; e.path=null; e.pathIndex=0; e.isBoss=false;
      e.setScale(.35); e.clearTint && e.clearTint();
    }
    for(const b of this.bullets.getChildren()){ b.setActive(false).setVisible(false).setPosition(-9999,-9999); b.target=null; }

    // Удаляем башни и перерисовываем споты
    try{
      for(const t of this.towers){ if(t?.sprite?.active) t.sprite.destroy(); if(t?.sprite?.upIcon) t.sprite.upIcon.destroy(); }
      this.towers.length=0;
      this.buildSprites.forEach((spr,i)=>{ try{ spr?.destroy(); }catch(_){} this._createHammer(CONST.BUILD_SPOTS[i], i); });
    }catch(_){}

    this._applyBaseTexture(); this._syncHUD();
    this.playBattle();
    this._scheduleNextWave(1200);
  }

  returnToMenu(){
    State.started=false; this._setPaused(false); this.stopAllLoops();
    try{ this.sndBattle.stop(); }catch(_){}
    try{ this.sndArrowLp.stop(); }catch(_){}
    this.playLobby(); showMenuOverlay();
    if(this.waveTimer){ try{ this.waveTimer.remove(); }catch(_){ } this.waveTimer=null; }
  }

  showGameOver(){
    State.started=false; this._setPaused(false); this.stopAllLoops();
    try{ this.sndBattle.stop(); }catch(_){}
    try{ this.sndArrowLp.stop(); }catch(_){}
    this.playGameOver(); showGameoverOverlay();
    if(this.waveTimer){ try{ this.waveTimer.remove(); }catch(_){ } this.waveTimer=null; }
  }

  /* ============ АНИМАЦИИ ============ */
  _createAnims(){
    // Башни
    for(let i=1;i<=12;i++){
      const idle=[], atk=[];
      for(let j=1;j<=4;j++) idle.push({key:`tower${i}_idle_${j}`});
      for(let j=0;j<5;j++) atk.push({key:`tower${i}_atk_${j}`});
      if(!this.anims.exists(`tower${i}_idle_anim`)) this.anims.create({key:`tower${i}_idle_anim`,frames:idle,frameRate:8,repeat:-1});
      if(!this.anims.exists(`tower${i}_atk_anim`)) this.anims.create({key:`tower${i}_atk_anim`, frames:atk, frameRate:12,repeat:-1});
    }
    // Враги
    const eWalk=[], eAtk=[], eDie=[];
    for(let i=0;i<7;i++){ eWalk.push({key:`e_walk_${i}`}); eAtk.push({key:`e_atk_${i}`}); eDie.push({key:`e_die_${i}`}); }
    if(!this.anims.exists('e_walk_anim')) this.anims.create({key:'e_walk_anim',frames:eWalk,frameRate:8,repeat:-1});
    if(!this.anims.exists('e_atk_anim'))  this.anims.create({key:'e_atk_anim', frames:eAtk, frameRate:8,repeat:-1});
    if(!this.anims.exists('e_die_anim'))  this.anims.create({key:'e_die_anim', frames:eDie, frameRate:10,repeat:0, hideOnComplete:false});
    // Герои
    for(let h=1;h<=3;h++){
      if(!this.anims.exists(`h${h}_idle`)) this.anims.create({key:`h${h}_idle`,frames:[1,2,3,4].map(i=>({key:`h${h}_idle_${i}`})),frameRate:6, repeat:-1});
      if(!this.anims.exists(`h${h}_walk`)) this.anims.create({key:`h${h}_walk`,frames:[1,2,3,4].map(i=>({key:`h${h}_walk_${i}`})),frameRate:8, repeat:-1});
      if(!this.anims.exists(`h${h}_atk`))  this.anims.create({key:`h${h}_atk`, frames:[1,2,3,4,5,6].map(i=>({key:`h${h}_atk_${i}`})), frameRate:12,repeat:0});
      if(!this.anims.exists(`h${h}_dead`)) this.anims.create({key:`h${h}_dead`,frames:[1,2,3,4,5].map(i=>({key:`h${h}_dead_${i}`})),frameRate:10,repeat:0});
    }
  }

  // === Спавн героя ===
_spawnHero(type){
  const spec = {
    1:{ speed:.22, hp:160, dmg:22, range:26, scale:.31, idle:'h1_idle', walk:'h1_walk', atk:'h1_atk', dead:'h1_dead' },
    2:{ speed:.16, hp:260, dmg:18, range:28, scale:.34, idle:'h2_idle', walk:'h2_walk', atk:'h2_atk', dead:'h2_dead' },
    3:{ speed:.19, hp:210, dmg:32, range:30, scale:.33, idle:'h3_idle', walk:'h3_walk', atk:'h3_atk', dead:'h3_dead' }
  }[type||1];

  // небольшое смещение при спавне
  const randOffset = {x:Phaser.Math.Between(-12,12), y:Phaser.Math.Between(-4,4)};
  const offset = {1:{x:-10,y:0}, 2:{x:0,y:0}, 3:{x:+10,y:0}}[type] || {x:0,y:0};

  const s = this.add.sprite(
    CONST.HERO_SPAWN.x + offset.x + randOffset.x,
    CONST.HERO_SPAWN.y + offset.y + randOffset.y,
    `${spec.idle}_1`
  )
    .setDepth(Z.HERO)
    .setScale(spec.scale)
    .setVisible(true)
    .setActive(true);

  // выбрать ближайший путь
  const pick = this._chooseHeroPathFromBase();
  const path = CONST.PATHS[pick.idx];
  const startIndex = pick.iNear;

  const h = {
    spr:s, type, level:1,
    hpMax: spec.hp, hp: spec.hp,
    dmg: spec.dmg, speed: spec.speed,
    range: spec.range, cooldown:700, _lastHit:0,
    idleKey: spec.idle, walkKey: spec.walk, atkKey: spec.atk, deadKey: spec.dead,
    path, pIndex:startIndex,
    hpBar: this.add.graphics().setDepth(Z.HERO_HP).setVisible(true),
    target: null, _dying:false
  };

  State.heroes.push(h);

  // сразу идёт по маршруту
  this.playIfExists(s, h.walkKey, true);
  this.time.delayedCall(500, ()=>{ this._updateHero(h); });
}

  // Выбор ближайшего к базе пути и стартового индекса точки
_chooseHeroPathFromBase(){
  const scored = CONST.PATHS.map((p, idx) => {
    let dmin = 1e9, near = 0;
    for(let i=0;i<p.length;i++){
      const wp = p[i];
      const d = Phaser.Math.Distance.Between(CONST.BASE_POS.x, CONST.BASE_POS.y, wp[0], wp[1]);
      if(d < dmin){ dmin = d; near = i; }
    }
    return { idx, d: dmin, iNear: near };
  }).sort((a,b)=> a.d - b.d);

  const pick = scored.slice(0, Math.min(3, scored.length)); // немного рандома из ближайших
  return pick[Math.floor(Math.random() * pick.length)];
} // ← закрывает функцию _chooseHeroPathFromBase
} /* конец класса AppScene */ // ← закрывает весь класс
  </script>
  <script>
  /* ========================= ЗАПУСК PHASER ========================= */
  const config = {
    type: Phaser.AUTO,
    parent: 'game',
    backgroundColor:'#000000',
    scale:{ mode:Phaser.Scale.FIT, autoCenter:Phaser.Scale.CENTER_BOTH, width:CONST.WIDTH, height:CONST.HEIGHT, autoRound:true },
    physics:{ default:'arcade', arcade:{ debug:false } },
    scene:[AppScene]
  };
  const game = new Phaser.Game(config);

  /* ========================= СВЯЗЬ DOM ↔ CANVAS ========================= */
  function syncStageToCanvas(){
    if(!game || !game.scale) return;
    const s=game.scale, cssW=(s.displaySize&&s.displaySize.width)||CONST.WIDTH, cssH=(s.displaySize&&s.displaySize.height)||CONST.HEIGHT;
    stageBox.style.width = Math.floor(cssW)+'px';
    stageBox.style.height= Math.floor(cssH)+'px';
  }
  window.addEventListener('load', ()=>{ showPreloader(); try{ game.scale.refresh(); }catch(_){ } syncStageToCanvas(); },{passive:true});
  window.addEventListener('resize', ()=>{ cancelAnimationFrame(syncStageToCanvas.__raf||0); syncStageToCanvas.__raf=requestAnimationFrame(()=>{ try{ game.scale.refresh(); }catch(_){ } syncStageToCanvas(); syncStageToCanvas.__raf=0; }); },{passive:true});
  window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ try{ game.scale.refresh(); }catch(_){ } syncStageToCanvas(); },300); },{passive:true});
  function afterBoot(){ try{ game.scale.on('resize', ()=> syncStageToCanvas()); }catch(_){ } syncStageToCanvas(); }
  if(document.readyState==='complete' || document.readyState==='interactive') setTimeout(afterBoot,0);
  else document.addEventListener('DOMContentLoaded', afterBoot);

  /* ========================= КНОПКИ МЕНЮ ========================= */
  startImg.addEventListener('click', ()=>{ const sc = game.scene.keys['AppScene']; if(!sc) return; hideMenuOverlay(); sc.beginNewGame(); },{passive:true});
  restartImg.addEventListener('click', ()=>{ const sc = game.scene.keys['AppScene']; if(!sc) return; hideGameoverOverlay(); sc.beginNewGame(); },{passive:true});
  </script>
