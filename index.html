<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <!-- ===== Touch / PWA оптимизация ===== -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- ====== ПОЛНАЯ ДИНАМИЧЕСКАЯ ПРЕДЗАГРУЗКА АССЕТОВ (можно расширять по мере добавления) ====== -->
  <script>
  const preloadAssets = () => {
    const add = (type, path, mime) => {
      const l = document.createElement('link');
      l.rel = 'preload';
      l.as = type;
      l.href = path;
      if (mime) l.type = mime;
      document.head.appendChild(l);
    };

    // ===== ВИДЕО =====
    add('video', 'assets/menu.webm', 'video/webm');
    add('video', 'assets/gameover.webm', 'video/webm');

    // ===== КАРТА =====
    add('image', 'assets/map.png', 'image/png');

    // ===== ЭЛЕМЕНТЫ UI (твои + новые) =====
    const ui = [
      'moloticon','up','noup','arrow','menu','reload','sound','soundoff',
      'fast','slow','pause','play2','gold','play','playagain',
      'bluecoin','hero1','hero2','hero3','helper1','helper2','helper3','heroup',
      'star1','star2','star3'
    ];
    ui.forEach(n => add('image', `assets/elements/${n}.png`, 'image/png'));

    // ===== БАЗА =====
    [0,20,40,60,80,100].forEach(v => add('image', `assets/base/base${v}.png`, 'image/png'));

    // ===== МОНЕТКИ =====
    for(let i=1;i<=6;i++) add('image', `assets/money/money${i}.png`, 'image/png');

    // ===== РЕКЛАМА =====
    for(let i=1;i<=6;i++) add('image', `assets/reklama/reklama${i}.png`, 'image/png');

    // ===== ВРАГИ =====
    for(let i=1;i<=7;i++) add('image', `assets/enemy/walk/walk${i}.png`, 'image/png');
    for(let i=1;i<=7;i++) add('image', `assets/enemy/atack_enemy/atackenemy${i}.png`, 'image/png');
    for(let i=1;i<=7;i++) add('image', `assets/enemy/die_enemy/dead${i}.png`, 'image/png');

    // ===== БАШНИ (12 уровней) =====
    for(let t=1;t<=12;t++){
      for(let j=1;j<=4;j++) add('image', `assets/attacktower/statik/tower${t}/stower${j}.png`, 'image/png');
      for(let j=1;j<=5;j++) add('image', `assets/attacktower/attack/tower${t}/aatcktower${j}.png`, 'image/png');
    }

    // ===== ГЕРОИ (3 типа) =====
    for(let h=1;h<=3;h++){
      for(let j=1;j<=4;j++) add('image', `assets/hero/h${h}_idle${j}.png`, 'image/png');
      for(let j=1;j<=4;j++) add('image', `assets/hero/h${h}_atk${j}.png`, 'image/png');
    }

    // ===== ПОМОЩНИКИ (3 типа) =====
    for(let t=1;t<=3;t++){
      for(let j=1;j<=4;j++) add('image', `assets/helpers/t${t}/walk${j}.png`, 'image/png');
      for(let j=1;j<=4;j++) add('image', `assets/helpers/t${t}/atk${j}.png`, 'image/png');
    }

    // ===== ЗВУКИ =====
    const mp3s = [
      'lobby','battle','arrow','gameover','towerup','towerrush','money','killenemy'
    ];
    mp3s.forEach(n => add('audio', `assets/sound/${n}.mp3`, 'audio/mpeg'));
    add('audio', 'assets/sound/klick.ogg', 'audio/ogg');
  };
  preloadAssets();
  </script>

  <!-- Статическая подстраховка предзагрузки звуков -->
  <link rel="preload" as="audio" href="assets/sound/lobby.mp3" type="audio/mpeg">
  <link rel="preload" as="audio" href="assets/sound/battle.mp3" type="audio/mpeg">
  <link rel="preload" as="audio" href="assets/sound/arrow.mp3" type="audio/mpeg">
  <link rel="preload" as="audio" href="assets/sound/gameover.mp3" type="audio/mpeg">
  <link rel="preload" as="audio" href="assets/sound/towerup.mp3" type="audio/mpeg">
  <link rel="preload" as="audio" href="assets/sound/towerrush.mp3" type="audio/mpeg">
  <link rel="preload" as="audio" href="assets/sound/money.mp3" type="audio/mpeg">
  <link rel="preload" as="audio" href="assets/sound/killenemy.mp3" type="audio/mpeg">
  <link rel="preload" as="audio" href="assets/sound/klick.ogg" type="audio/ogg">

  <!-- Масштабирование: только Phaser FIT -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <title>Tower Defense — герой, помощники, рекорды, 2-я валюта</title>

  <style>
    :root{ --w:720px; --h:1280px; --safe-pad:max(0px, env(safe-area-inset-top, 0px)); }
    html,body{ height:100%; margin:0; background:#000; overflow:hidden; -webkit-tap-highlight-color:transparent; }
    #viewport{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; touch-action:none; }
    #stage{ position:relative; width:var(--w); height:var(--h); overflow:hidden; image-rendering:crisp-edges; image-rendering:-webkit-optimize-contrast; user-select:none; padding-top:var(--safe-pad); }
    #game{ position:absolute; inset:0; }
    .overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:60; pointer-events:auto; }
    .hidden{ display:none; }
    .panel{ position:relative; z-index:2; display:flex; flex-direction:column; gap:1.6vh; align-items:center; justify-content:center; padding-top:min(24vh,340px); }
    .title{ color:#fff; margin:0; font-family:Arial,Helvetica,sans-serif; font-size: clamp(16px,2.4vh,26px); text-shadow:0 0 12px rgba(0,0,0,.6); z-index:2; }
    .bg-video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; pointer-events:none; filter:brightness(.9) contrast(1.05); }
    .imgbtn{ width:38%; max-width:340px; height:auto; cursor:pointer; filter:drop-shadow(0 0 16px rgba(0,0,0,.7)); transition:transform .08s ease; user-select:none; -webkit-user-drag:none; }
    .imgbtn:active{ transform:scale(.98); }
    #preloaderOverlay{ background:#000; }
    #prePanel{ gap:1.2vh; }
    #bar{ width:58%; max-width:520px; height:18px; background:#222; border-radius:9px; overflow:hidden; box-shadow: inset 0 0 12px rgba(0,0,0,.6); }
    #bar > div{ height:100%; width:0%; background:#1e90ff; transition:width .12s linear; }
    #hud{ display:none; }

    /* === NEW: Меню — слайдер героев + рекорды === */
    #menuContent{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:10px; width:80%; max-width:560px;}
    #heroCarousel{ display:grid; grid-template-columns: 60px 1fr 60px; align-items:center; gap:12px; width:100%; }
    .arrowBtn{ background:rgba(0,0,0,.45); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:12px; height:60px; width:60px; font-size:28px; cursor:pointer;}
    .arrowBtn:active{ transform:scale(.97); }
    #heroCard{ display:flex; flex-direction:column; align-items:center; gap:6px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:10px 12px; min-height:180px;}
    #heroName{ color:#fff; font-weight:bold; }
    #heroPrice{ color:#9fd6ff; }
    #buyHeroBtn{ background:#1e90ff; color:#fff; border:none; border-radius:12px; padding:10px 16px; cursor:pointer; }
    #buyHeroBtn:disabled{ opacity:.5; cursor:not-allowed; }
    #menuTopLine{ display:flex; justify-content:space-between; width:100%; color:#fff; }
    #bestList{ color:#fff; width:100%; font-size:14px; line-height:1.4; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:8px 12px; max-height:160px; overflow:auto; }

  </style>

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
</head>
<body>
  <div id="viewport">
    <div id="stage">

      <!-- ====== ПРЕЛОАДЕР ====== -->
      <div id="preloaderOverlay" class="overlay">
        <div id="prePanel" class="panel">
          <h2 class="title">Загрузка…</h2>
          <div id="bar"><div id="barFill"></div></div>
          <div id="pct" class="title">0%</div>
        </div>
      </div>

      <!-- ====== ГЛАВНОЕ МЕНЮ ====== -->
      <div id="menuOverlay" class="overlay hidden">
        <video id="menuVideo" class="bg-video" src="assets/menu.webm" autoplay loop muted playsinline></video>
        <div id="menuContent">
          <div id="menuTopLine">
            <div id="blueCoinsMenu">Синие монеты: <span id="blueCoinsVal">0</span></div>
            <div id="soundHint" style="opacity:.8">🎵 lobby</div>
          </div>

          <!-- === NEW: Слайдер героев === -->
          <div id="heroCarousel">
            <button id="prevHero" class="arrowBtn" aria-label="prev">&lt;</button>
            <div id="heroCard">
              <div id="heroCanvas" style="height:120px; display:flex; align-items:center; justify-content:center;">
                <!-- Здесь будет анимированный спрайт героя (Phaser ниже рисует в сцене меню) -->
                <div id="heroPhantom" style="color:#fff; opacity:.6">Герой</div>
              </div>
              <div id="heroName">Герой 1</div>
              <div id="heroPrice">Цена: 0 ⟨синих⟩</div>
              <button id="buyHeroBtn">Выбрать</button>
            </div>
            <button id="nextHero" class="arrowBtn" aria-label="next">&gt;</button>
          </div>

          <!-- === NEW: Таблица рекордов (ТОП-5 локально) === -->
          <div id="bestList">
            <div><b>Твои рекорды:</b></div>
            <ol id="bestOl" style="margin:6px 0 0 18px;"></ol>
          </div>

          <!-- Кнопка старт -->
          <div class="panel" style="padding-top:8px">
            <img id="startImg" class="imgbtn" src="assets/elements/play.png" alt="Start">
          </div>
        </div>
      </div>

      <!-- ====== GAME OVER ====== -->
      <div id="gameoverOverlay" class="overlay hidden">
        <video id="goVideo" class="bg-video" src="assets/gameover.webm" autoplay loop muted playsinline></video>
        <div class="panel">
          <h3 class="title" id="finalScoreTitle">Итог: 0 очков</h3>
          <img id="restartImg" class="imgbtn" src="assets/elements/playagain.png" alt="Play Again">
        </div>
      </div>

      <!-- Канвас для Phaser -->
      <div id="game"></div>

      <!-- (Старый DOM-HUD скрыт) -->
      <div id="hud"></div>

    </div>
  </div>

<script>
/* ========================================================================
   ЕДИНАЯ СЦЕНА: Preloader → Menu → Game → GameOver.
   НОВОЕ:
   - Меню: выбор/покупка героев (слайдер, Buy/Select), сохранение состояния
   - Рекорды (очки) с сохранением ТОП-5 в localStorage
   - HUD: синие монеты + очки рядом
   - Герой с полоской HP, оживление по таймеру, анимация на экране выбора
   - Помощники: покупка по клику на базу, бегут от базы по обратным путям
   - Враги: атакуют башни, помощников и героя (приоритизация по ближней цели)
   - Босс каждые 5 волн
   - Без scene.restart(), чистый reset
========================================================================= */

// ---------- Константы ----------
const CONST = {
  WIDTH: 720, HEIGHT: 1280,

  BUILD_SPOTS: [
    [484,95],[359,145],[435,235],[373,288],[218,310],[113,394],[316,417],[444,432],
    [589,550],[484,527],[351,539],[286,631],[162,630],[127,728],[416,706],[285,760],
    [430,822],[301,867],[285,1000],[355,1015],[511,992],[581,946],[667,1016],
    [532,1083],[458,1127],[329,1149],[174,1116]
  ],

  // Пути к базе: завершаются в [226,1059]
  PATHS: [
    [[377,50],[429,138],[410,189],[346,224],[311,257],[290,305],[331,354],[400,463],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
    [[81,335],[189,359],[331,354],[400,463],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
    [[636,490],[544,498],[413,491],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
    [[52,667],[168,691],[289,700],[347,736],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
    [[646,963],[565,1029],[441,1069],[312,1082],[226,1059]]
  ],

  START_GOLD: 600,
  KILL_REWARD: 100,
  HERO_REWARD: 10,                 // вторая валюта за убийство
  SCORE_PER_KILL: 1,               // очки за обычного
  SCORE_BOSS_MULT: 5,              // множитель очков за босса

  WAVE_BONUS: 80,
  TOWER_COST: 100,
  UPGRADE_COST_BASE: 120,

  ENEMY_AGGRO: 150,
  TOWER_RANGE: 200,

  PREWARM_ENEMIES: 40,
  PREWARM_BULLETS: 60,

  HELPER_COST: 50,                        // цена помощника (золото)

  // Стоимость анлока героев (героические монеты)
  HERO_UNLOCK_COSTS: {1:0, 2:5000, 3:10000},

  // Стоимость апгрейда героя (в игре, за 2-ю валюту)
  HERO_UPGRADE_COSTS: [2000, 10000, 20000], // индексы: lvl-1 (у нас макс 3)

  BASE_POS: {x:226, y:1059},          // позиция базы/героя
  HELPERS_MAX: 5
};

// ---------- DOM ----------
const $ = (id)=>document.getElementById(id);
const stageBox = $('stage');
const preloaderOverlay = $('preloaderOverlay');
const barFill = $('barFill');
const pct = $('pct');
const menuOverlay = $('menuOverlay');
const gameoverOverlay = $('gameoverOverlay');
const startImg = $('startImg');
const restartImg = $('restartImg');
const menuVideo = $('menuVideo');
const goVideo = $('goVideo');

// menu DOM (NEW)
const blueCoinsVal = $('blueCoinsVal');
const heroNameDom = $('heroName');
const heroPriceDom = $('heroPrice');
const buyHeroBtn = $('buyHeroBtn');
const bestOl = $('bestOl');
const prevHeroBtn = $('prevHero');
const nextHeroBtn = $('nextHero');

// ---------- Helpers (storage) ----------
const storage = {
  getJSON(k, def){ try{ const v = localStorage.getItem(k); return v? JSON.parse(v): def; }catch(e){return def;} },
  setJSON(k, val){ try{ localStorage.setItem(k, JSON.stringify(val)); }catch(e){} }
};

// ---------- Глобальное состояние ----------
const State = {
  started: false,
  paused: false,
  soundEnabled: true,

  gold: CONST.START_GOLD,     // обычное золото
  heroCoins: storage.getJSON('td_heroCoins', 0), // вторая валюта (персистентная)
  score: 0,

  wave: 0,
  baseHp: 100,                // % 0..100

  // Герои
  heroType: storage.getJSON('td_heroType', 1),          // 1..3
  heroUnlocked: Object.assign({1:true,2:false,3:false}, storage.getJSON('td_heroUnlocked', {})),
  heroLevel: storage.getJSON('td_heroLevel', 1),        // 1..3

  // меню карусель
  carouselIndex: 0 // 0..2 (соответствует герою 1..3)
};

// Оверлеи
const showPreloader = ()=> preloaderOverlay.classList.remove('hidden');
const hidePreloader = ()=> preloaderOverlay.classList.add('hidden');
const showMenuOverlay = ()=> { menuOverlay.classList.remove('hidden'); menuOverlay.style.display = 'flex'; gameoverOverlay.classList.add('hidden'); };
const hideMenuOverlay = ()=> { menuOverlay.classList.add('hidden'); menuOverlay.style.display = 'none'; };
const showGameoverOverlay = ()=> { gameoverOverlay.classList.remove('hidden'); menuOverlay.classList.add('hidden'); };
const hideGameoverOverlay = ()=> gameoverOverlay.classList.add('hidden');

// ====== Лидерборд (ТОП-5 локально) ======
function getBest() { return storage.getJSON('td_best', []); }
function pushBest(score){
  const arr = getBest();
  arr.push({score, ts: Date.now()});
  arr.sort((a,b)=> b.score - a.score);
  storage.setJSON('td_best', arr.slice(0,5));
}
function renderBestList(){
  const arr = getBest();
  bestOl.innerHTML = '';
  if(!arr.length){
    bestOl.innerHTML = '<li>Пока пусто — сыграй!</li>';
    return;
  }
  arr.forEach((it,i)=>{
    const li = document.createElement('li');
    li.textContent = `${it.score} очков`;
    bestOl.appendChild(li);
  });
}

// ========================================================================
//                         PHASER: СЦЕНА
// ========================================================================
class AppScene extends Phaser.Scene {
  constructor(){ super({ key:'AppScene' }); }

  preload(){
    showPreloader();
    this.load.on('progress', (v)=>{
      const p = Math.floor(v*100);
      barFill.style.width = p + '%';
      pct.textContent = p + '%';
    });

    // Карта
    this.load.image('map','assets/map.png');

    // UI / постройки
    this.load.image('molot','assets/elements/moloticon.png');
    this.load.image('up_icon','assets/elements/up.png');
    this.load.image('noup_icon','assets/elements/noup.png');

    // Пуля
    this.load.image('arrow','assets/elements/arrow.png');

    // Боковые кнопки
    this.load.image('menu','assets/elements/menu.png');
    this.load.image('reload','assets/elements/reload.png');
    this.load.image('sound_on','assets/elements/sound.png');
    this.load.image('sound_off','assets/elements/soundoff.png');

    // TURBO / PAUSE / RESUME
    this.load.image('turbo_on','assets/elements/fast.png');
    this.load.image('turbo_off','assets/elements/slow.png');
    this.load.image('pause','assets/elements/pause.png');
    this.load.image('resume','assets/elements/play2.png');

    // GOLD панель + монетка
    this.load.image('gold_panel','assets/elements/gold.png');
    for(let i=1;i<=6;i++) this.load.image(`coin_${i}`, `assets/money/money${i}.png`);

    // Вторая валюта (иконка)
    this.load.image('bluecoin','assets/elements/bluecoin.png');

    // HUD базы
    [0,20,40,60,80,100].forEach(p=>{
      this.load.image(`base_${p}`, `assets/base/base${p}.png`);
    });

    // Кнопка «реклама»
    for(let i=1;i<=6;i++) this.load.image(`ad_${i}`, `assets/reklama/reklama${i}.png`);

    // Враги
    for(let i=0;i<7;i++){
      this.load.image(`e_walk_${i}`,`assets/enemy/walk/walk${i+1}.png`);
      this.load.image(`e_atk_${i}`,`assets/enemy/atack_enemy/atackenemy${i+1}.png`);
      this.load.image(`e_die_${i}`,`assets/enemy/die_enemy/dead${i+1}.png`);
    }

    // Башни: 12 уровней
    for(let i=1;i<=12;i++){
      for(let j=1;j<=4;j++) this.load.image(`tower${i}_idle_${j}`, `assets/attacktower/statik/tower${i}/stower${j}.png`);
      for(let j=1;j<=5;j++) this.load.image(`tower${i}_atk_${j-1}`, `assets/attacktower/attack/tower${i}/aatcktower${j}.png`);
    }

    // Герои (3 типа)
    for(let h=1;h<=3;h++){
      for(let j=1;j<=4;j++) this.load.image(`h${h}_idle_${j}`, `assets/hero/h${h}_idle${j}.png`);
      for(let j=1;j<=4;j++) this.load.image(`h${h}_atk_${j}`,  `assets/hero/h${h}_atk${j}.png`);
    }
    this.load.image('star1','assets/elements/star1.png');
    this.load.image('star2','assets/elements/star2.png');
    this.load.image('star3','assets/elements/star3.png');

    // Кнопки выбора героя и помощников
    this.load.image('btn_hero1','assets/elements/hero1.png');
    this.load.image('btn_hero2','assets/elements/hero2.png');
    this.load.image('btn_hero3','assets/elements/hero3.png');
    this.load.image('btn_helper1','assets/elements/helper1.png');
    this.load.image('btn_helper2','assets/elements/helper2.png');
    this.load.image('btn_helper3','assets/elements/helper3.png');
    this.load.image('btn_heroup','assets/elements/heroup.png');

    // Помощники (3 типа)
    for(let t=1;t<=3;t++){
      for(let j=1;j<=4;j++) this.load.image(`hp_t${t}_w${j}`, `assets/helpers/t${t}/walk${j}.png`);
      for(let j=1;j<=4;j++) this.load.image(`hp_t${t}_a${j}`, `assets/helpers/t${t}/atk${j}.png`);
    }

    // Звуки
    this.load.audio('lobby','assets/sound/lobby.mp3');
    this.load.audio('battle','assets/sound/battle.mp3');
    this.load.audio('arrow_s','assets/sound/arrow.mp3');
    this.load.audio('klick','assets/sound/klick.ogg');
    this.load.audio('gameover_s','assets/sound/gameover.mp3');
    this.load.audio('towerup','assets/sound/towerup.mp3');
    this.load.audio('towerrush','assets/sound/towerrush.mp3');
    this.load.audio('money','assets/sound/money.mp3');
    this.load.audio('kill','assets/sound/killenemy.mp3');
  }

  create(){
    // Карта
    this.add.image(CONST.WIDTH/2, CONST.HEIGHT/2, 'map').setDisplaySize(CONST.WIDTH, CONST.HEIGHT);

    // Группы/пулы
    this.enemies = this.add.group();
    this.bullets = this.add.group();
    this.helpers = this.add.group(); // помощники
    this.towers = [];
    this.buildSprites = new Array(CONST.BUILD_SPOTS.length).fill(null);

    // Преднагрев
    this.enemyPool = [];
    this.bulletPool = [];
    this.helperPool = [];

    for(let i=0;i<CONST.PREWARM_ENEMIES;i++){
      const e = this.add.sprite(-9999,-9999,'e_walk_0').setScale(0.35).setVisible(false).setActive(false);
      e.hpBar = this.add.graphics().setDepth(40).setVisible(false);
      e.hpBar.__owner = e;
      this.enemies.add(e);
      this.enemyPool.push(e);
    }
    for(let i=0;i<CONST.PREWARM_BULLETS;i++){
      const b = this.add.image(-9999,-9999,'arrow').setVisible(false).setActive(false);
      this.bullets.add(b);
      this.bulletPool.push(b);
    }
    for(let i=0;i<20;i++){
      const h = this.add.sprite(-9999,-9999,'hp_t1_w1').setScale(0.45).setVisible(false).setActive(false).setDepth(35);
      h.hpBar = this.add.graphics().setDepth(40).setVisible(false);
      h.hpBar.__owner = h;
      this.helpers.add(h);
      this.helperPool.push(h);
    }

    // Скорость
    this.speedScale = 1;
    this.time.timeScale = this.speedScale;

    // Звук
    this.sndLobby   = this.sound.add('lobby',  { loop:true, volume:0.6 });
    this.sndBattle  = this.sound.add('battle', { loop:true, volume:0.6 });
    this.sndArrowLp = this.sound.add('arrow_s',{ loop:true, volume:0.35 });
    this.sndOver    = this.sound.add('gameover_s', { volume: 0.9 });
    this.sndUp      = this.sound.add('towerup', { volume: 0.9 });
    this.sndRush    = this.sound.add('towerrush', { volume: 0.9 });
    this.sndMoney   = this.sound.add('money',   { volume: 0.9 });
    this.sndKill    = this.sound.add('kill',    { volume: 0.8 });

    // mute
    try{
      const saved = localStorage.getItem('td_mute');
      if(saved!==null) State.soundEnabled = (saved!=='1');
    }catch(_){}
    this.sound.setMute(!State.soundEnabled);

    // Хелперы звука
    this.stopAllLoops = ()=>{
      try{ this.sndArrowLp.stop(); }catch(_){}
      try{ this.sndBattle.stop(); }catch(_){}
      try{ this.sndLobby.stop(); }catch(_){}
    };
    this.playLobby   = ()=>{ if(State.paused) return; this.stopAllLoops(); try{ !this.sndLobby.isPlaying  && this.sndLobby.play(); }catch(_){} };
    this.playBattle  = ()=>{ if(State.paused) return; this.stopAllLoops(); try{ !this.sndBattle.isPlaying && this.sndBattle.play(); }catch(_){} };
    this.playGameOver= ()=>{ this.stopAllLoops(); try{ this.sndOver.play(); }catch(_){} };

    // Прелоадер завершён → меню + lobby
    hidePreloader();
    showMenuOverlay();
    this.playLobby();

    // Строительные споты
    CONST.BUILD_SPOTS.forEach((p,i)=> this._createHammer(p,i));

    // Анимации
    this._createAnims();

    // HUD/кнопки
    this._buildSideButtons();
    this._buildHUD();

    // Герой + UI апгрейда/помощники
    this._spawnHero();        // у базы
    this._buildHelperUI();    // выбор типа помощника
    this._enableBaseClickForHelper(); // клик по базе — покупка

    // Тикеры
    this.shootTicker = this.time.addEvent({ delay: 120, loop: true, callback: ()=> this._towersTick() });
    this.heroTicker  = this.time.addEvent({ delay: 80,  loop: true, callback: ()=> this._heroTick()   });

    // === NEW: отрисовать меню (слайдер, цены, рекорды, анимировать героя в меню) ===
    this._initMenuCarousel();
    renderBestList();
    this._refreshMenuHeroPanel();
  }

  // ====== Update ======
  update(){
    if(!State.started || State.paused) { this._syncHUD(); return; }
    this.enemies.getChildren().forEach(e => { if(e.active && e.visible) this._updateEnemy(e); });
    this.helpers.getChildren().forEach(h => { if(h.active && h.visible) this._updateHelper(h); });
    this.bullets.getChildren().forEach(b => { if(b.active && b.visible) this._updateBullet(b); });
    this._syncHUD();
  }

  // ====== HUD ======
  _buildHUD(){
    const yBottom = CONST.HEIGHT - 463;

    // Золото
    this.goldPanel = this.add.image(80, yBottom, 'gold_panel')
      .setOrigin(0,1).setScale(1/3).setDepth(91);

    this.coin = this.add.sprite(this.goldPanel.x + 58, this.goldPanel.y - 36, 'coin_1')
      .setDepth(92).setScale(0.65);
    if (this.anims.exists('coin_anim')) this.coin.play('coin_anim');

    this.goldText = this.add.text(this.goldPanel.x + 95, this.goldPanel.y - 36, String(State.gold), {
      font:'26px Arial', fill:'#fff', stroke:'#000', strokeThickness:4
    }).setOrigin(0,0.5).setDepth(999);

    // База HUD
    this.baseHud = this.add.image(CONST.WIDTH - 550, CONST.HEIGHT - 450, 'base_100').setDepth(20);
    this._applyBaseHudTexture();

    // Вторая валюта (верхняя панель) + очки (NEW)
    this.blueCoinIcon = this.add.image(CONST.WIDTH/2 - 70, 46, 'bluecoin').setDepth(95).setScale(0.9);
    this.blueCoinText = this.add.text(CONST.WIDTH/2 - 34, 46, String(State.heroCoins), {
      font:'26px Arial', fill:'#9fd6ff', stroke:'#002', strokeThickness:4
    }).setOrigin(0,0.5).setDepth(95);

    this.scoreText = this.add.text(CONST.WIDTH/2 + 120, 46, 'Очки: 0', {
      font:'24px Arial', fill:'#fff', stroke:'#000', strokeThickness:3
    }).setOrigin(0,0.5).setDepth(95);

    // «Реклама»
    this.adBtn = this.add.sprite(CONST.WIDTH - 76, CONST.HEIGHT - 96, 'ad_1')
      .setDepth(95).setInteractive({useHandCursor:true});
    if(this.anims.exists('ad_anim')) this.adBtn.play('ad_anim');
    this.adBtn.on('pointerdown', ()=>{
      if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
      State.gold += 1000;
      this._syncHUD();
    });
  }

  _applyBaseHudTexture(){
    const p = Math.max(0, Math.min(100, Math.round(State.baseHp/20)*20));
    const key = `base_${p}`;
    if(this.textures.exists(key)) this.baseHud.setTexture(key);
  }

  _syncHUD(){
    if(this.goldText) this.goldText.setText(String(State.gold|0));
    if(this.blueCoinText) this.blueCoinText.setText(String(State.heroCoins|0));
    if(this.scoreText) this.scoreText.setText('Очки: ' + (State.score|0));
    if(this.baseHud) this._applyBaseHudTexture();
    this._syncHeroStars();
    this._refreshHelperButtons();
    blueCoinsVal.textContent = String(State.heroCoins|0); // меню топ-строка
  }

  _buildSideButtons(){
    const x = 576;
    const yMenu   = 629;
    const yReload = 709;
    const ySound  = 789;
    const yTurbo  = 869;
    const gap     = 80;

    const btnMenu = this.add.image(x, yMenu, 'menu').setInteractive().setDepth(60);
    btnMenu.on('pointerdown', ()=>{
      if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
      this.returnToMenu();
    });

    const btnReload = this.add.image(x, yReload, 'reload').setInteractive().setDepth(60);
    btnReload.on('pointerdown', ()=>{
      if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
      this.beginNewGame();
    });

    const btnSound = this.add.image(x, ySound, State.soundEnabled ? 'sound_on' : 'sound_off')
      .setInteractive().setDepth(60);
    const applyMuteIcon = ()=> btnSound.setTexture(State.soundEnabled ? 'sound_on' : 'sound_off');
    btnSound.on('pointerdown', ()=>{
      State.soundEnabled = !State.soundEnabled;
      this.sound.setMute(!State.soundEnabled);
      try{ localStorage.setItem('td_mute', State.soundEnabled ? '0':'1'); }catch(_){}
      applyMuteIcon();
      if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){ }
    });

    this.btnTurbo = this.add.image(x, yTurbo, 'turbo_off').setInteractive().setDepth(60);
    const applyTurboIcon = ()=> this.btnTurbo.setTexture(this.speedScale>1?'turbo_on':'turbo_off');
    this.btnTurbo.on('pointerdown', ()=>{
      if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
      this._toggleTurbo(); applyTurboIcon();
    });
    applyTurboIcon();

    this.btnPause = this.add.image(x, yTurbo + gap, 'pause').setDepth(60).setInteractive({useHandCursor:true});
    this.btnResume= this.add.image(x, yTurbo + gap, 'resume').setDepth(60).setInteractive({useHandCursor:true}).setVisible(false);

    this.btnPause.on('pointerdown', ()=>{
      if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
      this._setPaused(true);
    });
    this.btnResume.on('pointerdown', ()=>{
      if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
      this._setPaused(false);
    });
  }

  _toggleTurbo(){
    this.speedScale = this.speedScale>1 ? 1 : 2;
    if(!State.paused){
      this.time.timeScale = this.speedScale;
      this.tweens.timeScale = this.speedScale;
    }
  }

  _setPaused(flag){
    State.paused = !!flag;
    if(this.btnPause && this.btnResume){
      this.btnPause.setVisible(!State.paused);
      this.btnResume.setVisible(State.paused);
    }
    if(State.paused){
      this.time.timeScale = 0;
      this.tweens.pauseAll();
    } else {
      this.time.timeScale = this.speedScale;
      this.tweens.resumeAll();
    }
  }

  // ====== Чистый старт ======
  beginNewGame(){
    hideMenuOverlay();
    try{ menuVideo.pause(); }catch(_){}
    this.stopAllLoops();
    try{ this.sndLobby.stop(); }catch(_){}

    if (this.waveTimer?.hasDispatched) this.waveTimer.remove();
    if (this.waveTimer) { try{ this.waveTimer.remove(); }catch(_){ } this.waveTimer = null; }

    this._hardResetState();

    this.playBattle();

    State.started = true;
    this._scheduleNextWave(1200);
  }

  returnToMenu(){
    State.started = false;
    this._setPaused(false);
    this.stopAllLoops();
    try { this.sndBattle.stop(); }catch(_){}
    try { this.sndArrowLp.stop(); }catch(_){}
    this.playLobby();
    showMenuOverlay();

    try {
      menuVideo.currentTime = 0;
      menuVideo.play().catch(()=>{});
    } catch(_) {}

    if (this.waveTimer?.hasDispatched) this.waveTimer.remove();
    if (this.waveTimer) { try{ this.waveTimer.remove(); }catch(_){} this.waveTimer = null; }

    // обновить панель меню (монеты/кнопка героя/рекорды)
    this._refreshMenuHeroPanel();
    renderBestList();
  }

  showGameOver(){
    State.started = false;
    this._setPaused(false);
    this.stopAllLoops();
    try{ this.sndBattle.stop(); }catch(_){}
    try{ this.sndArrowLp.stop(); }catch(_){}
    this.playGameOver();
    showGameoverOverlay();
    try{ goVideo.currentTime = 0; goVideo.play().catch(()=>{}); }catch(_){}

    // сохранить рекорд
    pushBest(State.score);
    $('finalScoreTitle').textContent = `Итог: ${State.score|0} очков`;

    if (this.waveTimer?.hasDispatched) this.waveTimer.remove();
    if (this.waveTimer) { try{ this.waveTimer.remove(); }catch(_){ } this.waveTimer = null; }
  }

  _hardResetState(){
    State.gold = CONST.START_GOLD;
    State.wave = 0;
    State.baseHp = 100;
    State.paused = false;
    State.score = 0; // сброс очков
    this.speedScale = 1;
    this.time.timeScale = 1;
    this.tweens.timeScale = 1;

    // враги
    this.enemies.getChildren().forEach(e=>{
      if(e.hpBar){ e.hpBar.clear().setVisible(false); }
      e.setActive(false).setVisible(false).setPosition(-9999,-9999);
      e.state='idle'; e.target=null; e.targetTower=null; e.path=null; e.pathIndex=0;
      e.isBoss = false; e.setScale(0.35); e.clearTint && e.clearTint();
    });
    // пули
    this.bullets.getChildren().forEach(b=>{
      b.setActive(false).setVisible(false).setPosition(-9999,-9999);
      b.target=null;
    });
    // помощники
    this.helpers.getChildren().forEach(h=>{
      if(h.hpBar){ h.hpBar.clear().setVisible(false); }
      h.setActive(false).setVisible(false).setPosition(-9999,-9999);
      h.state='idle'; h.target=null; h.path=null; h.pathIndex=0;
    });

    // Башни
    try{
      this.towers.forEach(t=>{
        if(t && t.sprite && t.sprite.active){ t.sprite.destroy(); }
        if(t && t.sprite?.upIcon){ try{ t.sprite.upIcon.destroy(); }catch(_){ } }
      });
      this.towers = [];
    }catch(_){}

    // Молоты
    try{
      this.buildSprites.forEach((spr, i)=>{
        if(spr && spr.active) spr.destroy();
        const pos = CONST.BUILD_SPOTS[i];
        this._createHammer(pos, i);
      });
    }catch(_){}

    // Герой (оставляем выбранный тип и уровень), восстановить HP и позицию
    this._removeHero();
    this._spawnHero();

    this._syncHUD();
  }

  // ====== Строительство / улучшение башен ======
  _createHammer(pos, index){
    const img = this.add.image(pos[0],pos[1],'molot').setInteractive({useHandCursor:true}).setScale(0.6).setDepth(10);
    img.on('pointerdown', ()=> this._buildTower(index));
    this.buildSprites[index] = img;
  }

  _buildTower(index){
    if(State.gold < CONST.TOWER_COST){
      this._floatText(CONST.WIDTH/2, CONST.HEIGHT/2 - 80, 'Недостаточно золота');
      if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
      return;
    }
    const pos = CONST.BUILD_SPOTS[index];

    if(this.buildSprites[index]){
      try{ this.buildSprites[index].destroy(); }catch(_){}
      this.buildSprites[index] = null;
    }
    State.gold -= CONST.TOWER_COST;
    this._syncHUD();
    try{ this.sndMoney && this.sndMoney.play(); }catch(_){}

    const ts = this.add.sprite(pos[0],pos[1],'tower1_idle_1').setInteractive().setDepth(5);
    ts.level = 1;
    ts._typeKey = 'tower1';
    ts._range = CONST.TOWER_RANGE;
    ts._shootRate = 900;
    ts._bulletSpeed = 9;
    ts._damage = 5 * ts.level;
    ts.hp = 50;
    ts._upgradeCost = CONST.UPGRADE_COST_BASE * (ts.level + 1);

    if(this.textures.exists('up_icon') && this.textures.exists('noup_icon')){
      ts.upIcon = this.add.image(pos[0]-28,pos[1]+40,'noup_icon').setScale(0.6).setDepth(6).setVisible(true);
    }
    ts.on('pointerdown', ()=> this._upgradeTower(ts));

    const idle = `${ts._typeKey}_idle_anim`;
    if(this.anims.exists(idle)) ts.play(idle);
    ts.setFlipX(ts.x > CONST.WIDTH/2);

    ts.on('destroy', ()=> {
      this.buildSprites[index] = null;
      this._createHammer(pos,index);
    });

    this.towers.push({ sprite: ts });
  }

  _upgradeTower(ts){
    const cost = Math.floor(ts._upgradeCost || (CONST.UPGRADE_COST_BASE * (ts.level + 1)));
    if(ts.level >= 12) return;
    if(State.gold < cost){
      this._floatText(ts.x, ts.y - 70, 'Недостаточно золота');
      if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
      return;
    }
    State.gold -= cost; this._syncHUD();
    ts.level += 1;
    ts._typeKey = 'tower' + ts.level;
    ts._range = Math.min(300, ts._range + 30);
    ts._shootRate = Math.max(300, ts._shootRate - 120);
    ts._damage = 5 * ts.level;
    ts.hp += 50;
    ts._upgradeCost = CONST.UPGRADE_COST_BASE * (ts.level + 1);
    const idle = `${ts._typeKey}_idle_anim`;
    if(this.anims.exists(idle)) ts.play(idle);
    if(ts.level >= 12 && ts.upIcon) ts.upIcon.setVisible(false);
    try{ this.sndUp.play(); }catch(_){}
  }

  // ====== ПУЛ ПУЛЬ ======
  _getBullet(){
    for(let i=0;i<this.bulletPool.length;i++){
      const b = this.bulletPool[i];
      if(!b.active && !b.visible) return b;
    }
    const nb = this.add.image(-9999,-9999,'arrow').setVisible(false).setActive(false);
    this.bullets.add(nb);
    this.bulletPool.push(nb);
    return nb;
  }

  // ====== ПУЛ ВРАГОВ ======
  _getEnemy(){
    for(let i=0;i<this.enemyPool.length;i++){
      const e = this.enemyPool[i];
      if(!e.active && !e.visible) return e;
    }
    const e = this.add.sprite(-9999,-9999,'e_walk_0').setScale(0.35).setVisible(false).setActive(false);
    e.hpBar = this.add.graphics().setDepth(40).setVisible(false);
    e.hpBar.__owner = e;
    this.enemies.add(e);
    this.enemyPool.push(e);
    return e;
  }

  // ====== ПУЛ ПОМОЩНИКОВ ======
  _getHelper(){
    for(let i=0;i<this.helperPool.length;i++){
      const h = this.helperPool[i];
      if(!h.active && !h.visible) return h;
    }
    const h = this.add.sprite(-9999,-9999,'hp_t1_w1').setScale(0.45).setVisible(false).setActive(false).setDepth(35);
    h.hpBar = this.add.graphics().setDepth(40).setVisible(false);
    h.hpBar.__owner = h;
    this.helpers.add(h);
    this.helperPool.push(h);
    return h;
  }

  // ====== Башни / стрельба ======
  _towersTick(){
    if(!State.started || State.paused) return;

    let anyShot = false;
    const now = Date.now();

    for(const tObj of this.towers){
      const ts = tObj.sprite; if(!ts || !ts.active) continue;

      if(ts.upIcon){
        const nextCost = Math.floor(ts._upgradeCost || (CONST.UPGRADE_COST_BASE*(ts.level+1)));
        const key = State.gold >= nextCost ? 'up_icon' : 'noup_icon';
        if(ts.upIcon.texture && ts.upIcon.texture.key !== key) ts.upIcon.setTexture(key);
        ts.upIcon.setVisible(!(ts.level>=12));
        ts.upIcon.x = ts.x - 28; ts.upIcon.y = ts.y + 40;
      }

      ts._lastShotTime = ts._lastShotTime || 0;
      if(now - ts._lastShotTime < ts._shootRate){
        const idleKey = `${ts._typeKey}_idle_anim`;
        if(this.anims.exists(idleKey) && (!ts.anims.currentAnim || ts.anims.currentAnim.key.indexOf('_idle_anim')===-1)) ts.play(idleKey, true);
        continue;
      }

      // поиск цели
      let target=null, dmin=1e9;
      this.enemies.getChildren().forEach(e=>{
        if(!e.active || !e.visible || e.state==='die') return;
        const d = Phaser.Math.Distance.Between(ts.x, ts.y, e.x, e.y);
        if(d < ts._range && d < dmin){ dmin=d; target=e; }
      });

      ts._lastShotTime = now;
      if(target){
        let b = this._getBullet();
        b.setActive(true).setVisible(true);
        b.setTexture('arrow');
        b.setScale(0.5);
        b.setPosition(ts.x, ts.y - Math.round((ts.displayHeight||40)*0.4));
        b.target = target;
        b.speed = ts._bulletSpeed || 9;
        b.damage = ts._damage || (5*ts.level);
        b.hitRadius = 16;
        b.setDepth(30);

        const atkKey = `${ts._typeKey}_atk_anim`; if(this.anims.exists(atkKey)) ts.play(atkKey,true);
        ts.setFlipX(ts.x > CONST.WIDTH/2);
        anyShot = true;
      }else{
        const idleKey = `${ts._typeKey}_idle_anim`; if(this.anims.exists(idleKey)) ts.play(idleKey,true);
      }
    }

    try{
      if(anyShot){
        if(!this.sndArrowLp.isPlaying && !this.sound.mute) this.sndArrowLp.play();
      }else{
        if(this.sndArrowLp.isPlaying) this.sndArrowLp.stop();
      }
    }catch(_){}
  }

  // ====== Пули ======
  _updateBullet(b){
    if(!b || !b.active || !b.visible) return;

    if(!b.target || !b.target.active || !b.target.visible || b.target.state==='die'){
      b.setActive(false).setVisible(false).setPosition(-9999,-9999);
      b.target=null;
      return;
    }

    const dx = b.target.x - b.x;
    const dy = b.target.y - b.y;
    const dist = Math.hypot(dx, dy);
    const sp = b.speed || 8;
    const hitR = b.hitRadius || 16;

    if(dist <= hitR){
      const dmg = (b.damage || 5);
      b.target.hp -= dmg;
      this._floatText(b.target.x, b.target.y-28, '-' + dmg);
      if(b.target.hp <= 0){ this._killEnemy(b.target); }
      b.setActive(false).setVisible(false).setPosition(-9999,-9999);
      b.target=null;
      return;
    }

    const nx = dx / dist, ny = dy / dist;
    b.x += nx * sp;
    b.y += ny * sp;
    b.rotation = Phaser.Math.Angle.Between(b.x,b.y,b.target.x,b.target.y);

    if(b.x < -50 || b.x > CONST.WIDTH+50 || b.y < -50 || b.y > CONST.HEIGHT+50){
      b.setActive(false).setVisible(false).setPosition(-9999,-9999);
      b.target=null;
    }
  }

  _floatText(x,y,text,color='#ffec8b'){
    const t = this.add.text(x, y, text, {font:'20px Arial', fill:color, stroke:'#000', strokeThickness:3}).setDepth(100);
    t.setOrigin(0.5,1);
    this.tweens.add({ targets:t, y:y-30, alpha:0, duration:650, ease:'Cubic.easeOut', onComplete:()=> t.destroy() });
  }

  _killEnemy(e){
    if(!e || e.state==='die') return;
    e.state = 'die';
    if(e.anims) e.anims.stop();

    const hasDieAnim = this.anims.exists('e_die_anim');
    if (hasDieAnim) {
      e.once(Phaser.Animations.Events.ANIMATION_COMPLETE, () => { this._deactivateEnemy(e); });
      e.play('e_die_anim');
    } else {
      this._deactivateEnemy(e);
    }

    try{ this.sndKill && this.sndKill.play(); }catch(_){}

    // валюты
    const bossMult = e.isBoss ? 5 : 1;
    State.gold += CONST.KILL_REWARD * bossMult;
    State.heroCoins += CONST.HERO_REWARD;
    State.score += CONST.SCORE_PER_KILL * (e.isBoss ? CONST.SCORE_BOSS_MULT : 1);

    // персистим синие монеты
    storage.setJSON('td_heroCoins', State.heroCoins);

    if (e.isBoss) this._floatText(e.x, e.y - 50, 'БОСС ПОБЕЖДЁН!', '#ffd6d6');

    this._syncHUD();
  }

  _deactivateEnemy(e){
    if(e.hpBar){ e.hpBar.clear().setVisible(false); }
    e.setActive(false).setVisible(false).setPosition(-9999,-9999);
    e.target=null; e.targetTower=null; e.path=null; e.pathIndex=0; e.state='idle';
    e.isBoss = false;
    e.setScale(0.35);
    e.clearTint && e.clearTint();
  }

  // ====== Враги ======
  _spawnEnemy(path, hp){
    const spawn = path[0];
    const e = this._getEnemy();
    e.isBoss = false;
    e.setScale(0.35);
    e.clearTint && e.clearTint();

    e.maxHp = hp; e.hp = hp;
    e.speed = 0.12 + Math.min(0.018 * State.wave, 0.32);
    e.path = path; e.pathIndex = 1;
    e.state='walk'; e._savedPathIndex=null; e._lastAttack=0;

    e.setPosition(spawn[0],spawn[1]).setVisible(true).setActive(true);
    if(this.anims.exists('e_walk_anim')) e.play('e_walk_anim');

    e.hpBar.setVisible(true);
    this._drawHpBar(e);
  }

  _spawnBoss(path) {
    const spawn = path[0];
    const e = this._getEnemy();
    e.maxHp = (25 + State.wave * 5) * 3;
    e.hp = e.maxHp;
    e.speed = 0.05;
    e.path = path;
    e.pathIndex = 1;
    e.state = 'walk';
    e.isBoss = true;
    e.setScale(0.7);

    e.setPosition(spawn[0], spawn[1]).setVisible(true).setActive(true);
    if(this.anims.exists('e_walk_anim')) e.play('e_walk_anim');

    e.hpBar.setVisible(true);
    this._drawHpBar(e);
    this._floatText(e.x, e.y - 60, 'БОСС!', '#ff8080');
  }

  _drawHpBar(e){
    if(!e || !e.hpBar || !e.visible) return;
    const w = 40, h = 6;
    const x = e.x - w/2;
    const y = e.y - 40;
    const p = Math.max(0, Math.min(1, e.hp / e.maxHp));
    e.hpBar.clear();
    e.hpBar.fillStyle(0x000000, 0.5).fillRect(x-1,y-1,w+2,h+2);
    e.hpBar.fillStyle(0x8b0000, 0.6).fillRect(x,y,w,h);
    e.hpBar.fillStyle(0x32cd32, 0.9).fillRect(x,y,w*p,h);
  }

  _updateEnemy(e){
    if(!e || !e.active || !e.visible || e.state==='die') return;

    if(e.hpBar){ this._drawHpBar(e); }

    // === NEW: искать ближайшую цель среди (1) башен, (2) помощников, (3) героя
    const target = this._findClosestTargetForEnemy(e);
    if(target){
      e.target = target;
      e._savedPathIndex = e.pathIndex;
      if(this.anims.exists('e_atk_anim') && e.anims?.currentAnim?.key!=='e_atk_anim') e.play('e_atk_anim');

      // двигаться к цели
      this._moveTowards(e, target.x, target.y, e.speed);
      e.setFlipX(target.x < e.x);
      const d = Phaser.Math.Distance.Between(e.x,e.y,target.x,target.y);
      if(d < 26 && (!e._lastAttack || Date.now()-e._lastAttack > 900)){
        e._lastAttack = Date.now();

        // нанести урон
        const dmg = e.isBoss ? 20 : 10;

        if(target.__kind==='tower'){
          target.hp -= dmg;
          try{
            target.setTint && target.setTint(0xff9999);
            this.time.delayedCall(80,()=>{ try{ target.clearTint && target.clearTint(); }catch(_){} });
          }catch(_){}
          if(target.hp <= 0){
            try{ this.sndRush.play(); }catch(_){}
            try{ target.upIcon && target.upIcon.destroy(); }catch(_){ }
            try{ target.destroy(); }catch(_){}
            this.towers = this.towers.filter(t => t && t.sprite && t.sprite.active);
            e.target=null; e.state='returning';
            if(e._savedPathIndex!=null) e.pathIndex=e._savedPathIndex;
          }
        } else if(target.__kind==='helper'){
          target.hp -= dmg;
          if(target.hp <= 0) this._killHelper(target);
        } else if(target.__kind==='hero'){
          this._damageHero(dmg);
        }
      }
      return;
    }

    // Возврат к пути
    if(e.state==='returning'){
      const targetPt = e.path[e.pathIndex] || e.path[e.path.length-1];
      this._moveTowards(e, targetPt[0], targetPt[1], e.speed);
      if(Phaser.Math.Distance.Between(e.x,e.y,targetPt[0],targetPt[1])<8){
        e.state='walk'; if(this.anims.exists('e_walk_anim') && e.anims?.currentAnim?.key!=='e_walk_anim') e.play('e_walk_anim');
      }
      return;
    }

    // Дошёл до базы
    if(e.pathIndex >= e.path.length){
      if(!e._lastAttack || Date.now()-e._lastAttack > 900){
        e._lastAttack = Date.now();
        State.baseHp -= 5; if(State.baseHp < 0) State.baseHp = 0;
        this._syncHUD();
        if(State.baseHp<=0){ this.showGameOver(); }
      }
      if(this.anims.exists('e_atk_anim') && e.anims?.currentAnim?.key!=='e_atk_anim') e.play('e_atk_anim');
      return;
    }

    // Движение по точкам
    const wp = e.path[e.pathIndex];
    if(wp){
      this._moveTowards(e, wp[0], wp[1], e.speed);
      if(Phaser.Math.Distance.Between(e.x,e.y,wp[0],wp[1])<6) e.pathIndex++;
      e.setFlipX(wp[0] < e.x);
      if(this.anims.exists('e_walk_anim') && e.anims?.currentAnim?.key!=='e_walk_anim') e.play('e_walk_anim');
    }
  }

  _findClosestTargetForEnemy(e){
    let cand = null, dmin = CONST.ENEMY_AGGRO;

    // башни
    for(const tObj of this.towers){
      const ts=tObj.sprite; if(!ts||!ts.active) continue;
      ts.__kind='tower';
      const d=Phaser.Math.Distance.Between(e.x,e.y,ts.x,ts.y);
      if(d < dmin){ dmin=d; cand=ts; }
    }

    // помощники
    this.helpers.getChildren().forEach(h=>{
      if(!h.active || !h.visible) return;
      h.__kind='helper';
      const d=Phaser.Math.Distance.Between(e.x,e.y,h.x,h.y);
      if(d < dmin){ dmin=d; cand=h; }
    });

    // герой
    if(this.hero && this.hero.active){
      this.hero.__kind='hero';
      const d=Phaser.Math.Distance.Between(e.x,e.y,this.hero.x,this.hero.y);
      if(d < dmin){ dmin=d; cand=this.hero; }
    }
    return cand;
  }

  _moveTowards(obj, tx, ty, speed){
    const dx=tx-obj.x, dy=ty-obj.y, dist=Math.hypot(dx,dy);
    if(dist<0.1) return;
    obj.x += (dx/dist)*speed*2;
    obj.y += (dy/dist)*speed*2;
  }

  // ====== Волны ======
  _scheduleNextWave(delay = 1500) {
    if (this.waveTimer?.hasDispatched) this.waveTimer.remove();
    if (this.waveTimer) { this.waveTimer.remove(); this.waveTimer = null; }
    this.waveTimer = this.time.addEvent({ delay, callback: () => this._startWave() });
  }

  _startWave() {
    if (!State.started || State.paused) return;

    State.wave++;
    this._syncHUD();

    const enemyHpBase = 25 + State.wave * 5;
    const hpJitter = Phaser.Math.Between(-2, 4);
    const enemiesPerSpawn = Math.min(1 + Math.floor((State.wave - 1) / 4), 4);

    let spawnCount;
    if (State.wave <= 2) spawnCount = 1;
    else if (State.wave <= 6) spawnCount = Phaser.Math.Between(1, 2);
    else spawnCount = Phaser.Math.Between(2, 3);
    spawnCount = Math.min(spawnCount, CONST.PATHS.length);

    const chosenIndexes = Phaser.Utils.Array.Shuffle(
      [...Array(CONST.PATHS.length).keys()]
    ).slice(0, spawnCount);

    chosenIndexes.forEach((pathIndex, idx) => {
      const path = CONST.PATHS[pathIndex];
      for (let j = 0; j < enemiesPerSpawn; j++) {
        const base = (State.wave <= 3) ? Phaser.Math.Between(2400, 3000) : Phaser.Math.Between(2000, 2600);
        const delay = j * base + idx * 1000;
        const hp = Math.max(10, enemyHpBase + hpJitter);
        this.time.addEvent({ delay, callback: () => this._spawnEnemy(path, hp) });
      }
    });

    const nextDelayBase = (State.wave <= 3) ? 12000 : 10000;
    const nextDelay = nextDelayBase + enemiesPerSpawn * 3200 + Phaser.Math.Between(0, 1800);

    // Босс раз в 5 волн
    if (State.wave % 5 === 0) {
      const bossPath = Phaser.Utils.Array.GetRandom(CONST.PATHS);
      this.time.addEvent({ delay: 2500, callback: () => this._spawnBoss(bossPath) });
    }

    this._scheduleNextWave(nextDelay);
  }

  // ====== Анимации ======
  _createAnims(){
    // Башни
    for(let i=1;i<=12;i++){
      const idle=[], atk=[];
      for(let j=1;j<=4;j++) idle.push({key:`tower${i}_idle_${j}`});
      for(let j=0;j<5;j++) atk.push({key:`tower${i}_atk_${j}`});
      if(!this.anims.exists(`tower${i}_idle_anim`))
        this.anims.create({key:`tower${i}_idle_anim`,frames:idle,frameRate:8,repeat:-1});
      if(!this.anims.exists(`tower${i}_atk_anim`))
        this.anims.create({key:`tower${i}_atk_anim`, frames:atk, frameRate:12,repeat:-1});
    }

    // Враги
    const eWalk=[], eAtk=[], eDie=[];
    for(let i=0;i<7;i++){
      eWalk.push({key:`e_walk_${i}`});
      eAtk.push({key:`e_atk_${i}`});
      eDie.push({key:`e_die_${i}`});
    }
    if(!this.anims.exists('e_walk_anim'))
      this.anims.create({key:'e_walk_anim', frames:eWalk, frameRate:8, repeat:-1});
    if(!this.anims.exists('e_atk_anim'))
      this.anims.create({key:'e_atk_anim', frames:eAtk, frameRate:8, repeat:-1});
    if(!this.anims.exists('e_die_anim'))
      this.anims.create({ key:'e_die_anim', frames:eDie.map(f=>({key:f.key})), frameRate:10, repeat:0, hideOnComplete:false });

    // Монетка
    if(!this.anims.exists('coin_anim')){
      this.anims.create({key:'coin_anim',
        frames:[1,2,3,4,5,6].map(i=>({key:`coin_${i}`})),
        frameRate: 10, repeat:-1
      });
    }
    // Реклама
    if(!this.anims.exists('ad_anim')){
      this.anims.create({key:'ad_anim',
        frames:[1,2,3,4,5,6].map(i=>({key:`ad_${i}`})),
        frameRate: 8, repeat:-1
      });
    }

    // Герои: три набора анимаций (idle/atk)
    for(let h=1;h<=3;h++){
      if(!this.anims.exists(`hero${h}_idle`)){
        this.anims.create({ key:`hero${h}_idle`, frames:[1,2,3,4].map(i=>({key:`h${h}_idle_${i}`})), frameRate:6, repeat:-1 });
      }
      if(!this.anims.exists(`hero${h}_atk`)){
        this.anims.create({ key:`hero${h}_atk`,  frames:[1,2,3,4].map(i=>({key:`h${h}_atk_${i}`})),  frameRate:10, repeat:0 });
      }
    }

    // Помощники: для каждого типа walk/atk
    for(let t=1;t<=3;t++){
      if(!this.anims.exists(`hp${t}_walk`)){
        this.anims.create({ key:`hp${t}_walk`, frames:[1,2,3,4].map(i=>({key:`hp_t${t}_w${i}`})), frameRate:8, repeat:-1 });
      }
      if(!this.anims.exists(`hp${t}_atk`)){
        this.anims.create({ key:`hp${t}_atk`,  frames:[1,2,3,4].map(i=>({key:`hp_t${t}_a${i}`})), frameRate:10, repeat:0 });
      }
    }
  }

  /* ================= HERO ================= */

  _spawnHero(){
    const hx = CONST.BASE_POS.x, hy = CONST.BASE_POS.y; // возле базы

    const h = this.add.sprite(hx, hy, 'h1_idle_1').setDepth(50).setScale(0.7);
    this.hero = h;
    this._applyHeroTypeVisual();

    // статы от уровня (HP растёт, кд уменьшается)
    const baseHp = 200 + (State.heroLevel-1)*120;
    const baseCd = Math.max(700, 2000 - (State.heroLevel-1)*400);

    h.hpMax = baseHp;
    h.hp    = baseHp;
    h.range = 110;                 // радиус ближней атаки
    h.cooldown = baseCd;           // 1 удар / 2 сек (урезается апгрейдами)
    h._lastHit = 0;
    h.level = State.heroLevel;     // 1..3
    h.active = true;

    // звёзды над героем
    this.heroStar = this.add.image(hx, hy - 60, 'star1').setDepth(60).setScale(0.9);
    this._syncHeroStars();

    // === NEW: HP-бар героя ===
    this.heroHpBar = this.add.graphics().setDepth(60).setVisible(true);
    this._drawHeroHp();
  }

  _removeHero(){
    try{ this.hero && this.hero.destroy(); }catch(_){}
    try{ this.heroStar && this.heroStar.destroy(); }catch(_){}
    try{ this.heroHpBar && this.heroHpBar.destroy(); }catch(_){}
    this.hero = null; this.heroStar = null; this.heroHpBar = null;
  }

  _applyHeroTypeVisual(){
    if(!this.hero) return;
    const htype = State.heroType|0 || 1;
    const idleKey = `hero${htype}_idle`;
    if(this.anims.exists(idleKey)) this.hero.play(idleKey, true);
  }

  _drawHeroHp(){
    if(!this.hero || !this.heroHpBar) return;
    const w = 48, h = 7;
    const x = this.hero.x - w/2;
    const y = this.hero.y - 48;
    const p = Math.max(0, Math.min(1, this.hero.hp / this.hero.hpMax));
    this.heroHpBar.clear();
    this.heroHpBar.fillStyle(0x000000, 0.6).fillRect(x-1,y-1,w+2,h+2);
    this.heroHpBar.fillStyle(0x003300, 0.7).fillRect(x,y,w,h);
    this.heroHpBar.fillStyle(0x33cc33, 0.95).fillRect(x,y,w*p,h);
  }

  _damageHero(dmg){
    if(!this.hero || !this.hero.active) return;
    this.hero.hp -= dmg;
    this._drawHeroHp();
    if(this.hero.hp <= 0){
      // "смерть" героя: отключить на 6 сек, затем возродить с 50% HP
      this.hero.active = false;
      this._floatText(this.hero.x, this.hero.y-70, 'Герой выбывает', '#ffaaaa');
      if(this.anims.exists(`hero${State.heroType}_idle`)) this.hero.stop();
      this.time.delayedCall(6000, ()=>{
        if(!this.hero) return;
        this.hero.hp = Math.max(1, Math.round(this.hero.hpMax*0.5));
        this.hero.active = true;
        this._applyHeroTypeVisual();
        this._drawHeroHp();
        this._floatText(this.hero.x, this.hero.y-70, 'Герой вернулся', '#aaffaa');
      });
    }
  }

  _heroTick(){
    if(!State.started || State.paused || !this.hero || !this.hero.active) return;

    // Находим ближайшего врага в радиусе
    let target = null, dmin = 1e9;
    this.enemies.getChildren().forEach(e=>{
      if(!e.active || !e.visible || e.state==='die') return;
      const d = Phaser.Math.Distance.Between(this.hero.x,this.hero.y,e.x,e.y);
      if(d < this.hero.range && d < dmin){ dmin=d; target=e; }
    });
    if(!target) { this._drawHeroHp(); return; }

    // КД
    const now = Date.now();
    if(now - (this.hero._lastHit||0) < this.hero.cooldown) { this._drawHeroHp(); return; }
    this.hero._lastHit = now;

    // Визуал атаки
    const atkKey = `hero${State.heroType}_atk`;
    if(this.anims.exists(atkKey)) this.hero.play(atkKey);
    this.time.delayedCall(220, ()=>{ this._heroKill(target); });
    this.time.delayedCall(600, ()=>{ this._applyHeroTypeVisual(); this._drawHeroHp(); });
  }

  _heroKill(e){
    if(!e || !e.active) return;
    // Герой убивает с 1 удара
    e.hp = 0;
    this._killEnemy(e);
  }

  _syncHeroStars(){
    if(!this.heroStar) return;
    if(State.heroLevel===1) this.heroStar.setTexture('star1');
    else if(State.heroLevel===2) this.heroStar.setTexture('star2');
    else this.heroStar.setTexture('star3');
  }

  // ====== Меню: слайдер героев / покупка / выбор ======
  _initMenuCarousel(){
    // индексация 0..2 => тип героя 1..3
    State.carouselIndex = Math.max(0, Math.min(2, (State.heroType|0)-1));

    prevHeroBtn.onclick = ()=>{
      State.carouselIndex = (State.carouselIndex + 2) % 3;
      this._refreshMenuHeroPanel();
    };
    nextHeroBtn.onclick = ()=>{
      State.carouselIndex = (State.carouselIndex + 1) % 3;
      this._refreshMenuHeroPanel();
    };

    buyHeroBtn.onclick = ()=>{
      const t = State.carouselIndex + 1;
      const cost = CONST.HERO_UNLOCK_COSTS[t]||0;
      if(State.heroUnlocked[t]){
        // уже открыт — просто выбрать
        State.heroType = t;
        storage.setJSON('td_heroType', State.heroType);
        this._applyHeroTypeVisual();
        this._refreshMenuHeroPanel();
        if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
        return;
      }
      // покупка
      if(State.heroCoins < cost){
        this._floatText(CONST.WIDTH/2, 120, `Нужно ${cost} ⟨синих⟩`, '#9fd6ff');
        return;
      }
      State.heroCoins -= cost;
      storage.setJSON('td_heroCoins', State.heroCoins);
      State.heroUnlocked[t] = true;
      storage.setJSON('td_heroUnlocked', State.heroUnlocked);
      State.heroType = t;
      storage.setJSON('td_heroType', State.heroType);
      this._applyHeroTypeVisual();
      this._refreshMenuHeroPanel();
      this._syncHUD();
      this._floatText(CONST.WIDTH/2, 120, 'Герой открыт!', '#9fd6ff');
      if(State.soundEnabled) try{ this.sound.play('towerup'); }catch(_){}
    };
  }

  _refreshMenuHeroPanel(){
    const t = State.carouselIndex + 1;
    const cost = CONST.HERO_UNLOCK_COSTS[t]||0;
    const opened = !!State.heroUnlocked[t];

    heroNameDom.textContent = `Герой ${t}`;
    heroPriceDom.textContent = opened ? 'Открыт' : `Цена: ${cost} ⟨синих⟩`;
    buyHeroBtn.textContent = opened ? (State.heroType===t ? 'Выбран' : 'Выбрать') : 'Купить';
    buyHeroBtn.disabled = (!opened && State.heroCoins < cost);

    // Обновить HUD монет в меню
    blueCoinsVal.textContent = String(State.heroCoins|0);
  }

  // ====== HELPERS (помощники) ======
  _buildHelperUI(){
    // Кнопки выбора типа помощника (слева сверху от базы)
    const x = CONST.WIDTH - 140, y0 = CONST.HEIGHT - 420, gap = 66;
    this.btnHelper1 = this.add.image(x, y0+0*gap, 'btn_helper1').setDepth(95).setScale(0.9).setInteractive();
    this.btnHelper2 = this.add.image(x, y0+1*gap, 'btn_helper2').setDepth(95).setScale(0.9).setInteractive();
    this.btnHelper3 = this.add.image(x, y0+2*gap, 'btn_helper3').setDepth(95).setScale(0.9).setInteractive();

    State.helperType = 1;

    const pick = (t)=>{
      State.helperType = t;
      this._floatText(this.baseHud.x, this.baseHud.y-110, `Помощник ${t}`, '#c7ffc7');
      this._refreshHelperButtons();
    };
    this.btnHelper1.on('pointerdown', ()=>{ if(State.soundEnabled) this.sound.play('klick'); pick(1); });
    this.btnHelper2.on('pointerdown', ()=>{ if(State.soundEnabled) this.sound.play('klick'); pick(2); });
    this.btnHelper3.on('pointerdown', ()=>{ if(State.soundEnabled) this.sound.play('klick'); pick(3); });
  }

  _refreshHelperButtons(){
    const tintSel = 0xffffff, tintDis = 0x888888;
    if(this.btnHelper1) this.btnHelper1.setTint(State.helperType===1?tintSel:tintDis);
    if(this.btnHelper2) this.btnHelper2.setTint(State.helperType===2?tintSel:tintDis);
    if(this.btnHelper3) this.btnHelper3.setTint(State.helperType===3?tintSel:tintDis);
  }

  _enableBaseClickForHelper(){
    this.baseHud.setInteractive({useHandCursor:true});
    this.baseHud.on('pointerdown', ()=>{
      if(!State.started || State.paused) return;
      if(this.helpers.countActive(true) >= CONST.HELPERS_MAX){
        this._floatText(this.baseHud.x, this.baseHud.y-120, 'Лимит помощников', '#ffd6a0');
        return;
      }
      if(State.gold < CONST.HELPER_COST){
        this._floatText(this.baseHud.x, this.baseHud.y-120, 'Нужно 50 золота', '#ffd6a0');
        if(State.soundEnabled) try{ this.sound.play('klick'); }catch(_){}
        return;
      }
      State.gold -= CONST.HELPER_COST;
      this._syncHUD();
      this._spawnHelper(State.helperType||1);
    });
  }

  _spawnHelper(type){
    const h = this._getHelper();
    const stats = {
      1: {speed:0.22, hp:60,  dmg:18, scale:0.45, walk:'hp1_walk', atk:'hp1_atk'},
      2: {speed:0.12, hp:150, dmg:10, scale:0.52, walk:'hp2_walk', atk:'hp2_atk'},
      3: {speed:0.17, hp:90,  dmg:28, scale:0.48, walk:'hp3_walk', atk:'hp3_atk'},
    }[type||1];

    h.type = type;
    h.maxHp = stats.hp;
    h.hp = stats.hp;
    h.dmg = stats.dmg;
    h.speed = stats.speed;
    h.setScale(stats.scale);

    // старт от базы
    h.x = CONST.BASE_POS.x;
    h.y = CONST.BASE_POS.y;
    h.setActive(true).setVisible(true);

    // анимация ходьбы
    const wkey = {1:'hp1_walk',2:'hp2_walk',3:'hp3_walk'}[type];
    if(this.anims.exists(wkey)) h.play(wkey,true);

    h.state = 'run';
    h.target = null;
    h._lastHit = 0;
    h.range = 24;

    // === NEW: путь от базы к внешним точкам (обратные пути)
    const rev = this._pickOutwardPathFromBase();
    h.path = rev;
    h.pathIndex = 0;

    // HP-бар
    h.hpBar.setVisible(true);
    this._drawHelperHp(h);
  }

  _killHelper(h){
    if(!h) return;
    this._floatText(h.x, h.y-20, '✖', '#ffaaaa');
    if(h.hpBar){ h.hpBar.clear().setVisible(false); }
    h.setActive(false).setVisible(false).setPosition(-9999,-9999);
    h.target=null; h.path=null; h.pathIndex=0; h.state='idle';
  }

  _drawHelperHp(h){
    if(!h || !h.hpBar || !h.visible) return;
    const w = 32, hh = 5;
    const x = h.x - w/2, y = h.y - 34;
    const p = Math.max(0, Math.min(1, h.hp / h.maxHp));
    h.hpBar.clear();
    h.hpBar.fillStyle(0x000000, 0.5).fillRect(x-1,y-1,w+2,hh+2);
    h.hpBar.fillStyle(0x003366, 0.6).fillRect(x,y,w,hh);
    h.hpBar.fillStyle(0x66ccff, 0.9).fillRect(x,y,w*p,hh);
  }

  _updateHelper(h){
    if(!h || !h.active || !h.visible) return;
    this._drawHelperHp(h);

    // цель — ближайший враг
    if(!h.target || !h.target.active || h.target.state==='die'){
      h.target = this._findNearestEnemy(h.x,h.y,220);
    }
    if(h.target){
      const e = h.target;
      const d = Phaser.Math.Distance.Between(h.x,h.y,e.x,e.y);
      if(d > h.range){
        this._moveTowards(h, e.x, e.y, h.speed);
        const wkey = {1:'hp1_walk',2:'hp2_walk',3:'hp3_walk'}[h.type||1];
        if(this.anims.exists(wkey) && (!h.anims.currentAnim || h.anims.currentAnim.key!==wkey)) h.play(wkey,true);
      }else{
        // атака, кд 600мс
        const now = Date.now();
        if(now - (h._lastHit||0) >= 600){
          h._lastHit = now;
          const akey = {1:'hp1_atk',2:'hp2_atk',3:'hp3_atk'}[h.type||1];
          if(this.anims.exists(akey)) h.play(akey,false);
          e.hp -= h.dmg;
          this._floatText(e.x, e.y-20, '-' + h.dmg, '#c7ffc7');
          if(e.hp <= 0) this._killEnemy(e);
        }
      }
      return;
    }

    // иначе — идти по внешнему пути
    const path = h.path;
    if(path && h.pathIndex < path.length){
      const wp = path[h.pathIndex];
      this._moveTowards(h, wp[0], wp[1], h.speed);
      if(Phaser.Math.Distance.Between(h.x,h.y,wp[0],wp[1])<6) h.pathIndex++;
      return;
    }

    // если дошёл до конца — просто гулять в центр
    this._moveTowards(h, CONST.WIDTH/2, CONST.HEIGHT/2, h.speed);
  }

  _findNearestEnemy(x,y, radius=220){
    let g=null, dmin=radius;
    this.enemies.getChildren().forEach(e=>{
      if(!e.active || !e.visible || e.state==='die') return;
      const d = Phaser.Math.Distance.Between(x,y,e.x,e.y);
      if(d < dmin){ dmin=d; g=e; }
    });
    return g;
  }

  // === NEW: собираем обратный путь (от базы к какому-то спавну)
  _pickOutwardPathFromBase(){
    const arr = [];
    // Взять случайный путь, развернуть (от базы к первому элементу)
    const base = CONST.BASE_POS;
    const pick = Phaser.Utils.Array.GetRandom(CONST.PATHS);
    const rev = pick.slice().reverse();
    // убедиться, что старт близко к базе
    if(Phaser.Math.Distance.Between(rev[0][0],rev[0][1], base.x, base.y) > 40) {
      // если первая точка не совсем база — вставим базу как точку старта
      rev.unshift([base.x, base.y]);
    }
    return rev;
  }

  /* ================== МЕНЮ (слайдер героя — отрисовка в сцене) ================== */
  // Здесь мы не создаём отдельную сцену меню; просто управляем DOM-кнопками и визуалом героя в игре.

} // class AppScene

// ========================================================================
//                       PHASER СТАРТ (адаптив, без двойного масштаба)
// ========================================================================
const config = {
  type: Phaser.AUTO,
  parent: 'game',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: CONST.WIDTH,
    height: CONST.HEIGHT,
    autoRound: true
  },
  physics:{ default:'arcade', arcade:{ debug:false } },
  scene:[AppScene],
  backgroundColor: '#000000'
};
const game = new Phaser.Game(config);

/* ========================================================================
   СИНХРОН DOM ↔ КАНВАС
========================================================================= */
function syncStageToCanvas(){
  if(!game || !game.scale) return;
  const s = game.scale;
  const cssW = Math.floor((s.displaySize && s.displaySize.width) || (s.gameSize && s.gameSize.width) || CONST.WIDTH);
  const cssH = Math.floor((s.displaySize && s.displaySize.height) || (s.gameSize && s.gameSize.height) || CONST.HEIGHT);
  if (cssW > 0) stageBox.style.width  = cssW + 'px';
  if (cssH > 0) stageBox.style.height = cssH + 'px';
}
window.addEventListener('load', ()=>{
  showPreloader();
  try { if (game.isBooted && game.scale) game.scale.refresh(); } catch(e){}
  syncStageToCanvas();
}, { passive:true });
window.addEventListener('resize', ()=>{
  if (syncStageToCanvas.__raf) cancelAnimationFrame(syncStageToCanvas.__raf);
  syncStageToCanvas.__raf = requestAnimationFrame(()=>{
    try { game.scale.refresh(); } catch(e){}
    syncStageToCanvas();
    syncStageToCanvas.__raf = 0;
  });
}, { passive:true });
window.addEventListener('orientationchange', ()=>{
  setTimeout(()=>{
    try { game.scale.refresh(); } catch(e){}
    syncStageToCanvas();
  }, 300);
}, { passive:true });
const onReady = ()=>{
  try{ game.scale.on('resize', ()=>{ syncStageToCanvas(); }); }catch(_){}
  syncStageToCanvas();
};
if (document.readyState === 'complete' || document.readyState === 'interactive'){
  setTimeout(onReady, 0);
}else{
  document.addEventListener('DOMContentLoaded', onReady);
}

// ========================================================================
//                   DOM-КНОПКИ (экраны) — БЕЗ scene.restart
// ========================================================================
startImg.addEventListener('click', ()=>{
  const sc = game.scene.keys['AppScene'];
  if(!sc) return;
  sc.beginNewGame();
}, {passive:true});
restartImg.addEventListener('click', ()=>{
  hideGameoverOverlay();
  const sc = game.scene.keys['AppScene'];
  if(!sc) return;
  sc.beginNewGame();
}, {passive:true});

// === При показе меню обновляем список рекордов ===
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){
    renderBestList();
  }
});
</script>
