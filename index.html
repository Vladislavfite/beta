<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=720, height=1280, user-scalable=no" />
  <title>Tower Game — single file</title>
  <style>
    :root{--w:720px;--h:1280px}
    html,body{height:100%;margin:0;background:#000;display:flex;align-items:center;justify-content:center}
    #container{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#000}
    canvas{position:absolute;left:0;top:0}

    /* Common overlay card */
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:auto}
    .panel{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
    .visually-hidden{display:none}

    /* Menu styles */
    #menu{background:transparent}
    #menu .btn{width:280px;height:80px;border-radius:18px;border:none;font-size:28px;background:#1e90ff;color:#fff;cursor:pointer;box-shadow:0 0 20px rgba(0,0,0,.5)}

    /* Gameover */
    #gameover .btn{width:280px;height:80px;border-radius:18px;border:none;font-size:28px;background:#1e90ff;color:#fff;cursor:pointer}

    /* Minimal HUD inside DOM so it's always crisp */
    #hud{position:absolute;left:0;right:0;bottom:0;height:120px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;z-index:50;pointer-events:none}
    #hud .left,#hud .right{pointer-events:auto}
    #hud .text{color:#fff;font-family:Arial,sans-serif; text-shadow:0 0 6px rgba(0,0,0,.8)}

    /* small responsive tweak when viewport is smaller */
    @media (max-width:800px){#container{transform:scale(.9)}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
</head>
<body>
  <div id="container">
    <!-- Video layers - use DOM video for better mobile handling -->
    <video id="menuVideo" class="visually-hidden" src="assets/menu.webm" loop muted playsinline></video>
    <video id="gameoverVideo" class="visually-hidden" src="assets/gameover.webm" loop muted playsinline></video>

    <!-- Phaser will create canvas inside this element -->
    <div id="game" style="width:720px;height:1280px"></div>

    <!-- Menu overlay -->
    <div id="menu" class="overlay">
      <div class="panel">
        <h1 style="color:#fff;margin:0;font-family:Arial">Tower Defense</h1>
        <button id="startBtn" class="btn">▶ Начать игру</button>
      </div>
    </div>

    <!-- Gameover overlay -->
    <div id="gameover" class="overlay visually-hidden">
      <div class="panel">
        <h2 style="color:#fff;margin:0;font-family:Arial">Game Over</h2>
        <button id="restartBtn" class="btn">▶ Начать заново</button>
      </div>
    </div>

    <!-- HUD (DOM) -->
    <div id="hud">
      <div class="left"><div id="goldText" class="text">Gold: 0</div><div id="waveText" class="text">Wave: 0</div></div>
      <div class="right"><div id="baseText" class="text">BASE HP 1000</div></div>
    </div>
  </div>

  <script>
  // ------------ CONFIG & CONSTANTS (kept near original but tidy) ------------
  const CONST = {
    WIDTH: 720, HEIGHT: 1280,
    BUILD_SPOTS: [[484,95],[359,155],[435,235],[373,288],[218,310],[113,394],[316,417],[444,432],[589,550],[484,527],[351,539],[286,631],[162,630],[127,728],[416,706],[285,781],[430,822],[301,867],[275,1016],[355,1015],[511,992],[581,946],[667,1016],[532,1083],[458,1127],[329,1149],[174,1116]],
    PATHS: [
      [[377,50],[429,138],[410,189],[346,224],[311,257],[290,305],[331,354],[400,463],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[81,335],[189,359],[331,354],[400,463],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[636,490],[544,498],[413,491],[425,542],[397,608],[349,663],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[52,667],[168,691],[289,700],[347,736],[365,808],[375,901],[446,1024],[441,1069],[312,1082],[226,1059]],
      [[646,963],[565,1029],[441,1069],[312,1082],[226,1059]]
    ],
    START_GOLD: 50000, KILL_REWARD: 10, WAVE_BONUS: 50, TOWER_COST: 100, UPGRADE_COST_BASE: 150,
    ENEMY_AGGRO: 150, TOWER_RANGE: 200
  };

  // ------------ DOM Shortcuts ------------
  const $ = id => document.getElementById(id);
  const menuEl = $('menu'), gameoverEl = $('gameover'), startBtn = $('startBtn'), restartBtn = $('restartBtn');
  const goldText = $('goldText'), waveText = $('waveText'), baseText = $('baseText');
  const menuVideo = $('menuVideo'), gameoverVideo = $('gameoverVideo');

  // ------------ GAME STATE (keeps globals minimal) ------------
  const State = {
    gold: CONST.START_GOLD,
    wave: 0,
    baseHp: 1000,
    isPaused: false
  };

  // ------------ Phaser Scene ------------
  class AppScene extends Phaser.Scene {
    constructor(){ super({ key: 'AppScene' }); }

    preload(){
      // map & UI
      this.load.image('map','assets/map.png');
      this.load.image('molot','assets/elements/moloticon.png');
      this.load.image('up_icon','assets/elements/up.png');
      this.load.image('noup_icon','assets/elements/noup.png');
      this.load.image('arrow','assets/elements/arrow.png');

      // towers & enemies (only load frames that exist; errors caught)
      for(let i=1;i<=12;i++){
        for(let j=1;j<=4;j++) this.load.image(`tower${i}_idle_${j}`, `assets/attacktower/statik/tower${i}/stower${j}.png`);
        for(let j=1;j<=5;j++) this.load.image(`tower${i}_atk_${j-1}`, `assets/attacktower/attack/tower${i}/aatcktower${j}.png`);
      }
      for(let i=0;i<7;i++){
        this.load.image('e_walk_'+i,`assets/enemy/walk/walk${i+1}.png`);
        this.load.image('e_atk_'+i,`assets/enemy/atack_enemy/atackenemy${i+1}.png`);
        this.load.image('e_die_'+i,`assets/enemy/die_enemy/dead${i+1}.png`);
      }

      // misc UI and sounds
      ['play_btn','menu_icon','play2','pause_icon','reload_icon','sound_on','sound_off','reklama'].forEach(k=>this.load.image(k,`assets/elements/${k}.png`));
      for(let i=0;i<12;i++) this.load.image('money_'+i, `assets/money/m${i+1}.png`);

      // videos (preload as DOM videos are used)
      // audio
      [['arrow_s','assets/sound/arrow.mp3'],['battle','assets/sound/battle.mp3'],['lobby','assets/sound/lobby.mp3'],['gameover_s','assets/sound/gameover.mp3'],['klick','assets/sound/klick.ogg']].forEach(([k,p])=>{try{this.load.audio(k,p);}catch(e){}
      });
    }

    create(){
      // background
      this.add.image(CONST.WIDTH/2, CONST.HEIGHT/2, 'map').setDisplaySize(CONST.WIDTH, CONST.HEIGHT);

      // groups
      this.enemies = this.add.group();
      this.bullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: 300, runChildUpdate: false });
      this.towers = [];
      this.buildSprites = new Array(CONST.BUILD_SPOTS.length).fill(null);

      // create hammers
      CONST.BUILD_SPOTS.forEach((p,i)=> this._createHammerAt(p,i));

      // UI DOM sync
      this._syncHUD();

      // create animations
      this._createAnims();

      // optimized firing loop via timed event instead of setInterval
      this.time.addEvent({ delay: 100, loop: true, callback: ()=> this._towerFireTick() });

      // bullets overlap
      this.physics.add.overlap(this.bullets, this.enemies, (b,e)=> this._onBulletHit(b,e));

      // start waves
      this.time.addEvent({ delay: 1000, callback: ()=> this._startNextWave() });
    }

    update(){
      if(State.isPaused) return;
      // enemies & bullets update
      this.enemies.getChildren().forEach(e => this._updateEnemy(e));
      this.bullets.getChildren().forEach(b => this._updateBullet(b));
      // update HUD
      this._syncHUD();
    }

    // ----------------- helper methods -----------------
    _syncHUD(){ goldText.textContent = 'Gold: ' + State.gold; waveText.textContent = 'Wave: ' + State.wave; baseText.textContent = 'BASE HP ' + Math.max(0, State.baseHp); }

    _createHammerAt(pos,index){
      try{
        const img = this.add.image(pos[0],pos[1],'molot').setInteractive({useHandCursor:true}).setScale(0.6).setDepth(10);
        img.on('pointerdown', ()=> this._buildTower(index));
        this.buildSprites[index] = img;
      }catch(e){console.warn(e)}
    }

    _buildTower(index){
      if(State.gold < CONST.TOWER_COST){ alert('Not enough gold'); return; }
      const pos = CONST.BUILD_SPOTS[index];
      try{ this.buildSprites[index] && this.buildSprites[index].destroy(); }catch(e){}
      this.buildSprites[index] = null;
      State.gold -= CONST.TOWER_COST;

      const ts = this.add.sprite(pos[0],pos[1], 'tower1_idle_1').setInteractive().setDepth(5);
      ts.level = 1; ts._typeKey = 'tower1'; ts._range = CONST.TOWER_RANGE; ts._shootRate = 500; ts._bulletSpeed = 10; ts._damage = 10; ts._upgradeCost = CONST.UPGRADE_COST_BASE * (ts.level + 1);

      // up icon
      if(this.textures.exists('up_icon') && this.textures.exists('noup_icon')){
        ts.upIcon = this.add.image(pos[0]-28,pos[1]+40,'noup_icon').setScale(0.6).setDepth(6);
      }

      ts.on('pointerdown', ()=> this._upgradeTower(ts));
      this.towers.push({ sprite: ts });
      ts.setFlipX(ts.x > CONST.WIDTH/2);
      ts.on('destroy', ()=> this._createHammerAt(pos, index));
    }

    _upgradeTower(ts){
      if(!ts) return; const cost = Math.floor(ts._upgradeCost || (CONST.UPGRADE_COST_BASE*(ts.level+1)));
      if(ts.level >= 12) return; if(State.gold < cost){ alert('Need ' + cost + ' gold'); return; }
      State.gold -= cost; ts.level++; ts._typeKey = 'tower' + ts.level; ts._range = Math.min(300, ts._range+30); ts._shootRate = Math.max(200, ts._shootRate-100); ts._damage = 10 * ts.level; ts.hp = (ts.hp||50)+50; ts._upgradeCost = CONST.UPGRADE_COST_BASE*(ts.level+1);
      const idle = ts._typeKey + '_idle_anim'; if(this.anims.exists(idle)) ts.play(idle);
      if(ts.level>=12 && ts.upIcon) ts.upIcon.setVisible(false);
    }

    _towerFireTick(){
      if(State.isPaused) return;
      const now = Date.now();
      const scene = this;
      for(const tObj of this.towers.slice()){ const ts = tObj.sprite; if(!ts || !ts.active) continue;
        ts._lastShotTime = ts._lastShotTime||0;
        if(now - ts._lastShotTime < ts._shootRate) { const idleKey = `${ts._typeKey}_idle_anim`; if(this.anims.exists(idleKey) && (!ts.anims.currentAnim || ts.anims.currentAnim.key.indexOf('_idle_anim')===-1)) ts.play(idleKey, true); continue; }
        // find nearest enemy in range
        let target=null, dmin=1e9;
        this.enemies.getChildren().forEach(e=>{ if(!e.active||e.state==='die') return; const d=Phaser.Math.Distance.Between(ts.x,ts.y,e.x,e.y); if(d<ts._range && d<dmin){ dmin=d; target=e; } });
        ts._lastShotTime = now;
        if(target){
          const b = this.bullets.get() || this.physics.add.image(ts.x, ts.y, 'arrow');
          b.setActive(true).setVisible(true); if(b.body) b.body.enable=true;
          b.setPosition(ts.x, ts.y - Math.round((ts.displayHeight||40)*0.4)); b.setScale(0.5);
          b.target = target; b.speed = ts._bulletSpeed || 10; b.damage = ts._damage || (10*ts.level);
          try{ b.setDepth(30); b.setOrigin(0.5,0.5); }catch(e){}
          ts._isAttacking=true; const atkKey = `${ts._typeKey}_atk_anim`; if(this.anims.exists(atkKey)) ts.play(atkKey,true);
          ts.setFlipX(ts.x > CONST.WIDTH/2);
        } else {
          ts._isAttacking=false; const idleKey = `${ts._typeKey}_idle_anim`; if(this.anims.exists(idleKey)) ts.play(idleKey,true);
        }

        // update upIcon visibility
        if(ts.upIcon){ const nextCost = Math.floor(ts._upgradeCost || (CONST.UPGRADE_COST_BASE*(ts.level+1))); const key = State.gold >= nextCost ? 'up_icon' : 'noup_icon'; if(ts.upIcon.texture.key !== key) ts.upIcon.setTexture(key); ts.upIcon.setVisible(!(ts.level>=12)); ts.upIcon.x = ts.x-28; ts.upIcon.y = ts.y+40; }
      }
    }

    _onBulletHit(b,e){
      if(!b.active || !e.active) return;
      e.hp -= (b.damage || 10);
      if(e.setTint) e.setTint(0xffcccc);
      this.time.delayedCall(60, ()=>{ try{ if(e && e.clearTint) e.clearTint(); }catch(e){} });
      if(e.hp <= 0 && e.state !== 'die'){
        e.state = 'die'; e.play('e_die_anim'); State.gold += CONST.KILL_REWARD; // ui will sync next frame
        e.once('animationcomplete', ()=>{ try{ e.body&& (e.body.enable=false); e.destroy(); }catch(_){} });
      }
      // recycle bullet
      try{ b.setActive(false); b.setVisible(false); if(b.body){ b.body.enable=false; b.body.setVelocity(0,0); } }catch(_){}
    }

    _updateBullet(b){ if(!b || !b.active) return; if(!b.target || !b.target.active || b.target.state==='die'){ try{ b.setActive(false); b.setVisible(false); if(b.body){ b.body.enable=false; b.body.setVelocity(0,0); } }catch(e){} return; }
      const angle = Phaser.Math.Angle.Between(b.x,b.y,b.target.x,b.target.y); b.rotation=angle; const speed=b.speed||8; b.x += Math.cos(angle)*speed; b.y += Math.sin(angle)*speed; const dx=b.target.x-b.x, dy=b.target.y-b.y; if(Math.sqrt(dx*dx+dy*dy) < 10){ try{ if(b.target && b.target.active){ b.target.hp -= (b.damage||10); if(b.target.setTint) b.target.setTint(0xffcccc); this.time.delayedCall(60, ()=>{ try{ if(b.target && b.target.clearTint) b.target.clearTint(); }catch(e){} }); } }catch(e){} try{ b.setActive(false); b.setVisible(false); if(b.body){ b.body.enable=false; b.body.setVelocity(0,0); } }catch(e){} }
      if(b.x < -50 || b.x > CONST.WIDTH+50 || b.y < -50 || b.y > CONST.HEIGHT+50){ try{ b.setActive(false); b.setVisible(false); if(b.body) b.body.enable=false; }catch(e){} }
    }

    _createAnims(){
      for(let i=1;i<=12;i++){ const idleFrames=[], atkFrames=[]; for(let j=1;j<=4;j++) idleFrames.push({key:`tower${i}_idle_${j}`}); for(let j=0;j<5;j++) atkFrames.push({key:`tower${i}_atk_${j}`}); if(!this.anims.exists(`tower${i}_idle_anim`)) this.anims.create({ key:`tower${i}_idle_anim`, frames:idleFrames, frameRate:8, repeat:-1}); if(!this.anims.exists(`tower${i}_atk_anim`)) this.anims.create({ key:`tower${i}_atk_anim`, frames:atkFrames, frameRate:12, repeat:-1}); }
      const eWalk=[], eAtk=[], eDie=[]; for(let i=0;i<7;i++){ eWalk.push({key:`e_walk_${i}`}); eAtk.push({key:`e_atk_${i}`}); eDie.push({key:`e_die_${i}`}); } if(!this.anims.exists('e_walk_anim')) this.anims.create({key:'e_walk_anim',frames:eWalk,frameRate:8,repeat:-1}); if(!this.anims.exists('e_atk_anim')) this.anims.create({key:'e_atk_anim',frames:eAtk,frameRate:8,repeat:-1}); if(!this.anims.exists('e_die_anim')) this.anims.create({key:'e_die_anim',frames:eDie,frameRate:10,repeat:0});
    }

    _startNextWave(){ State.wave++; State.gold += CONST.WAVE_BONUS; // spawn logic
      const enemyHp = 100 + State.wave; const maxEnemiesPerSpawn = 20; const baseEnemies = 1; const enemiesPerSpawn = Math.min(maxEnemiesPerSpawn, baseEnemies + State.wave); const totalSpawns = CONST.PATHS.length;
      for(let i=0;i<totalSpawns;i++){ const path = CONST.PATHS[i]; for(let j=0;j<enemiesPerSpawn;j++){ this.time.addEvent({ delay: j*800 + i*300, callback: ()=> this._spawnEnemy(path, enemyHp) }); } }
      const nextDelay = (enemiesPerSpawn * 800) + 3000; this.time.addEvent({ delay: nextDelay, callback: ()=> this._startNextWave() });
    }

    _spawnEnemy(path=null, customHp=100){ if(!path) path = CONST.PATHS[Math.floor(Math.random()*CONST.PATHS.length)]; if(!path || path.length===0) return; const spawn = path[0]; let e = this.physics.add.sprite(spawn[0],spawn[1],'e_walk_0').setScale(0.35); e.maxHp = customHp; e.hp = e.maxHp; e.speed = 0.2 + Math.min(0.05*State.wave,0.5); e.path = path; e.pathIndex = 1; e.state='walk'; e._lastAttack=0; e.play('e_walk_anim'); this.enemies.add(e); }

    _updateEnemy(e){ if(!e || !e.active || e.state==='die') return; // attack tower logic
      if(e.targetTower && e.targetTower.active){ e.state='attack'; this._moveTowards(e, e.targetTower.x, e.targetTower.y, e.speed); e.setFlipX(e.targetTower.x < e.x); const d = Phaser.Math.Distance.Between(e.x,e.y,e.targetTower.x,e.targetTower.y); if(d < 26 && (!e._lastAttack || Date.now()-e._lastAttack > 800)){ e._lastAttack = Date.now(); if(e.targetTower.hp != null){ e.targetTower.hp -= 10; if(e.targetTower.setTint) e.targetTower.setTint(0xff9999); this.time.delayedCall(80, ()=>{ try{ if(e.targetTower && e.targetTower.clearTint) e.targetTower.clearTint(); }catch(e){} }); if(e.targetTower.hp <= 0){ // destroy tower
            let idx = this.buildSprites.findIndex(s=>s==null); if(idx >= 0){ const p = CONST.BUILD_SPOTS[idx]; this.buildSprites[idx] = this.add.image(p[0],p[1],'molot').setInteractive().setScale(0.6).on('pointerdown', ()=> this._buildTower(idx)); }
            try{ if(e.targetTower.upIcon) e.targetTower.upIcon.destroy(); }catch(_){} try{ e.targetTower.destroy(); }catch(_){} this.towers = this.towers.filter(t=>t && t.sprite && t.sprite.active); e.targetTower=null; e.state='returning'; if(e._savedPathIndex != null) e.pathIndex = e._savedPathIndex; } } else { e.targetTower = null; e.state='returning'; } }
        if(e.anims && e.anims.currentAnim && e.anims.currentAnim.key !== 'e_atk_anim') e.play('e_atk_anim'); return; }

      // aggro
      let nearest=null, nd=1e9; for(const tObj of this.towers){ const ts = tObj.sprite; if(!ts || !ts.active) continue; const d = Phaser.Math.Distance.Between(e.x,e.y,ts.x,ts.y); if(d < CONST.ENEMY_AGGRO && d < nd){ nd=d; nearest=ts; } }
      if(nearest){ e.targetTower = nearest; e._savedPathIndex = e.pathIndex; if(e.anims && e.anims.currentAnim && e.anims.currentAnim.key !== 'e_atk_anim') e.play('e_atk_anim'); return; }

      if(e.state === 'returning'){ const target = e.path[e.pathIndex] || e.path[e.path.length-1]; this._moveTowards(e, target[0], target[1], e.speed); if(Phaser.Math.Distance.Between(e.x,e.y,target[0],target[1]) < 8){ e.state='walk'; if(e.anims && (!e.anims.currentAnim || e.anims.currentAnim.key !== 'e_walk_anim')) e.play('e_walk_anim'); } return; }

      if(e.pathIndex >= e.path.length){ // damage base
        e.state='attack'; if(!e._lastAttack || Date.now()-e._lastAttack > 800){ e._lastAttack = Date.now(); State.baseHp -= 10; if(State.baseHp <= 0){ State.baseHp = 0; this.scene.pause(); // show gameover
            showGameOver(); } }
        if(e.anims && e.anims.currentAnim && e.anims.currentAnim.key !== 'e_atk_anim') e.play('e_atk_anim'); return; }

      // walk path
      e.state='walk'; const wp = e.path[e.pathIndex]; if(wp){ this._moveTowards(e, wp[0], wp[1], e.speed); if(Phaser.Math.Distance.Between(e.x,e.y,wp[0],wp[1]) < 6) e.pathIndex++; e.setFlipX(wp[0] < e.x); if(e.anims && (!e.anims.currentAnim || e.anims.currentAnim.key !== 'e_walk_anim')) e.play('e_walk_anim'); }
    }

    _moveTowards(obj, tx, ty, speed){ const dx = tx - obj.x, dy = ty - obj.y, dist = Math.sqrt(dx*dx+dy*dy); if(dist < 0.1) return; obj.x += (dx / dist) * speed * 2; obj.y += (dy / dist) * speed * 2; }

  }

  // ---------- Phaser start ----------
  const config = { type: Phaser.AUTO, width: CONST.WIDTH, height: CONST.HEIGHT, parent: 'game', physics:{ default:'arcade', arcade:{ debug:false } }, scene: [AppScene] };
  const game = new Phaser.Game(config);

  // ----------------- UI controls (DOM) -----------------
  function showMenu(){ menuEl.classList.remove('visually-hidden'); gameoverEl.classList.add('visually-hidden'); menuVideo.classList.remove('visually-hidden'); try{ menuVideo.play().catch(()=>{}); }catch(e){} }
  function hideMenu(){ menuEl.classList.add('visually-hidden'); try{ menuVideo.pause(); menuVideo.classList.add('visually-hidden'); }catch(e){} }
  function showGameOver(){ gameoverEl.classList.remove('visually-hidden'); menuEl.classList.add('visually-hidden'); gameoverVideo.classList.remove('visually-hidden'); try{ gameoverVideo.play().catch(()=>{}); }catch(e){} }
  function hideGameOver(){ gameoverEl.classList.add('visually-hidden'); try{ gameoverVideo.pause(); gameoverVideo.classList.add('visually-hidden'); }catch(e){} }

  startBtn.addEventListener('click', ()=>{
    hideMenu(); // start or resume scene
    try{ const sc = game.scene.keys['AppScene']; if(sc) sc.scene.resume(); }catch(e){}
  });

  restartBtn.addEventListener('click', ()=>{
    hideGameOver(); State.gold = CONST.START_GOLD; State.wave = 0; State.baseHp = 1000; State.isPaused = false; try{ const sc = game.scene.keys['AppScene']; if(sc){ sc.scene.restart(); sc.scene.resume(); } }catch(e){}
  });

  // on load show menu
  window.addEventListener('load', ()=>{
    // make menu visually present
    showMenu();
  });

  </script>
</body>
</html>
