<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=720, height=1280, user-scalable=no" />
  <title>Меню игры</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #game-container {
      width: 720px;
      height: 1280px;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 720px;
      height: 1280px;
      object-fit: cover;
    }
    button {
      position: absolute;
      bottom: 260px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 80px;
      font-size: 28px;
      font-family: sans-serif;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      transition: transform 0.1s;
    }
    button:hover {
      transform: translateX(-50%) scale(1.05);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <video id="bg-video" src="assets/menu.webm" autoplay loop muted></video>
    <audio id="menu-music" src="assets/sound/lobby.mp3" autoplay loop></audio>
    <button id="startBtn">▶ Начать игру</button>
  </div>

  <script>
    const btn = document.getElementById('startBtn');
    const music = document.getElementById('menu-music');

    btn.addEventListener('click', () => {
      try { 
        music.pause();
        const clickSound = new Audio('assets/sound/klick.ogg');
        clickSound.play();
      } catch(e){}
      window.location.href = 'main.html';
    });
  </script>
</body>
</html>
