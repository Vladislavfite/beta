<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Menu</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000}
    #bg{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0}
    #play{position:absolute;left:373px;top:829px;z-index:2;cursor:pointer}
    #logo{position:absolute;left:50%;top:150px;transform:translateX(-50%);z-index:2;color:#fff;font-family:Arial, sans-serif}
  </style>
</head>
<body>
  <video id="bg" autoplay loop muted playsinline src="assets/menu.webm" width="1280" height="720"></video>
  <div id="logo"><h1 style="margin:0">My Game</h1></div>
  <img id="play" src="assets/elements/play.png" alt="Play" width="200" height="80">
  <audio id="lobby" src="assets/sound/lobby.mp3" loop></audio>
<script>
(function(){
  const lobby = document.getElementById('lobby');
  // try autoplaying lobby; most browsers block autoplay with sound until interaction.
  function tryPlayLobby(){ lobby.play().catch(()=>{}); }
  // mute video but play audio when user interacts
  document.addEventListener('pointerdown', ()=>{ tryPlayLobby(); }, { once:true });

  // If autoplay allowed, attempt to play immediately
  tryPlayLobby();

  document.getElementById('play').addEventListener('click', ()=>{
    try{ lobby.pause(); }catch(e){}
    // go to game index (assumes index.html runs the game)
    window.location.href = 'index.html';
  });
})();
</script>
</body>
</html>
