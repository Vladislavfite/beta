<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=720, height=1280, user-scalable=no" />
  <title>Game Over</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #game-container {
      width: 720px;
      height: 1280px;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 720px;
      height: 1280px;
      object-fit: cover;
      z-index: 0;
    }
    button {
      position: absolute;
      bottom: 800px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 80px;
      font-size: 28px;
      font-family: sans-serif;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      transition: transform 0.1s, background 0.2s;
      z-index: 2;
    }
    button:hover {
      transform: translateX(-50%) scale(1.05);
      background: #3ba3ff;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <video id="bg-video" src="assets/gameover.webm" autoplay loop muted playsinline></video>
    <audio id="gameover-sound" src="assets/sound/gameover.mp3"></audio>
    <button id="restartBtn">▶ Начать заново</button>
  </div>

  <script>
    const restartBtn = document.getElementById('restartBtn');
    const gameOverSound = document.getElementById('gameover-sound');

    window.addEventListener('load', () => {
      gameOverSound.play().catch(()=>{});
    });

    restartBtn.addEventListener('click', () => {
      try { 
        gameOverSound.pause();
        const clickSound = new Audio('assets/sound/klick.ogg');
        clickSound.play();
      } catch(e){}
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
