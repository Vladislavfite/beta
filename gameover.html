<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Game Over</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000}
    #bg{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0}
    #play{position:absolute;left:340px;top:340px;z-index:2;cursor:pointer}
    #msg{position:absolute;left:50%;top:80px;transform:translateX(-50%);z-index:2;color:#fff;font-family:Arial, sans-serif}
  </style>
</head>
<body>
  <video id="bg" autoplay playsinline src="assets/gameover.webm" width="1280" height="720"></video>
  <div id="msg"><h2 style="margin:0">Game Over</h2></div>
  <img id="play" src="assets/elements/play.png" alt="Play" width="160" height="60">
  <audio id="gameover_s" src="assets/sound/gameover.mp3"></audio>
<script>
(function(){
  const g = document.getElementById('gameover_s');
  window.addEventListener('load', ()=>{
    // try to play gameover sound; browsers may require interaction
    g.play().catch(()=>{});
  });
  document.getElementById('play').addEventListener('click', ()=>{
    try{ g.pause(); }catch(e){}
    window.location.href = 'index.html';
  });
})();
</script>
</body>
</html>
